<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FrostMiner | Neural Presets</title>
    <style>
        :root { 
            --bg: #000; --ice: #00ffff; --term: #00ff41; --xmr: #ff6600; 
            --alpha: #ff00ff; --theta: #00ffff; --delta: #ffff00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #tangle-canvas { position: fixed; inset: 0; z-index: -1; opacity: 0.5; filter: contrast(1.2); }

        #dashboard { width: 95%; height: 90vh; display: grid; grid-template-columns: 400px 1fr 400px; gap: 20px; padding: 20px; }
        .panel { background: rgba(5, 8, 15, 0.95); border: 1px solid rgba(165,242,243,0.1); padding: 25px; border-radius: 24px; backdrop-filter: blur(20px); display: flex; flex-direction: column; }

        /* PRESET SELECTORS */
        .preset-btn { 
            width: 100%; padding: 15px; border: 1px solid #333; background: #050505; color: #666; 
            margin-bottom: 10px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .preset-btn.active[data-type="ALPHA"] { border-color: var(--alpha); color: var(--alpha); box-shadow: 0 0 15px var(--alpha); }
        .preset-btn.active[data-type="THETA"] { border-color: var(--theta); color: var(--theta); box-shadow: 0 0 15px var(--theta); }
        .preset-btn.active[data-type="DELTA"] { border-color: var(--delta); color: var(--delta); box-shadow: 0 0 15px var(--delta); }

        .stat-val { font-size: 2.5rem; font-weight: 900; color: #fff; letter-spacing: -2px; }
        .stat-lbl { font-size: 0.6rem; color: #666; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px; }
        
        #log { margin-top: auto; font-size: 0.55rem; color: #444; height: 120px; overflow-y: auto; border-top: 1px solid #222; padding-top: 10px; line-height: 1.6; }
    </style>
</head>
<body>
    <canvas id="tangle-canvas"></canvas>

    <div id="dashboard">
        <div class="panel">
            <div class="stat-lbl" style="color:var(--ice); margin-bottom: 20px;">Neural State Selection</div>
            <button class="preset-btn active" data-type="ALPHA" onclick="setPreset('ALPHA')">ALPHA [11.11 Hz]</button>
            <button class="preset-btn" data-type="THETA" onclick="setPreset('THETA')">THETA [8.8 Hz]</button>
            <button class="preset-btn" data-type="DELTA" onclick="setPreset('DELTA')">DELTA [π Hz]</button>
            
            <button id="audio-init" style="margin-top:20px; padding:15px; background:var(--term); border:none; border-radius:8px; font-weight:900; cursor:pointer;" onclick="initAudio()">INITIALIZE AUDIO ENGINE</button>
            
            <div id="log">
                <div>> Phase-Locked Loop: READY</div>
                <div>> Carrier: 432Hz Pink Noise</div>
            </div>
        </div>

        <div></div> <div class="panel">
            <div class="stat-lbl">Consolidated Hashrate (DQ 1.05x)</div>
            <div class="stat-val" id="hash">842.11 PH/s</div>
            
            <div style="margin-top: 30px; padding: 20px; border: 1px solid var(--xmr); background: rgba(255,102,0,0.05); border-radius: 12px; text-align: center;">
                <div class="stat-lbl" style="color:var(--xmr)">13.37% Shadow Diversion</div>
                <div style="font-size: 1.5rem; color: #fff; font-weight: 900;">XMR SETTLED</div>
            </div>

            <div style="margin-top:auto; font-size: 0.6rem; color: #333;">
                IDENTITY: drfrost.frostchain<br>
                KEY_SYNC: Newkirk_Reserves
            </div>
        </div>
    </div>

    <script>
        let audioCtx, pinkNoise, solfOsc, quantumOsc, schumannOsc;
        let currentType = 'ALPHA';
        const freqs = { 'ALPHA': 11.11, 'THETA': 8.8, 'DELTA': Math.PI };

        function setPreset(type) {
            currentType = type;
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-type="${type}"]`).classList.add('active');
            
            if(quantumOsc) {
                quantumOsc.frequency.setTargetAtTime(528 + freqs[type], audioCtx.currentTime, 0.1);
            }
            log(`Neural state shifted: ${type} (${freqs[type]} Hz)`);
        }

        function initAudio() {
            if(audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const masterGain = audioCtx.createGain(); masterGain.gain.value = 0.12; masterGain.connect(audioCtx.destination);

            // 1. Pink Noise Carrier (432Hz)
            const bufferSize = 4096;
            pinkNoise = audioCtx.createScriptProcessor(bufferSize, 1, 1);
            let b0, b1, b2, b3, b4, b5, b6; b0 = b1 = b2 = b3 = b4 = b5 = b6 = 0.0;
            pinkNoise.onaudioprocess = (e) => {
                const output = e.outputBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179; b1 = 0.99332 * b1 + white * 0.0750759; b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856; b4 = 0.55000 * b4 + white * 0.5329522; b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11; b6 = white * 0.115926;
                }
            };
            const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 432;
            pinkNoise.connect(f); f.connect(masterGain);

            // 2. Left (Solfeggio 528Hz)
            solfOsc = audioCtx.createOscillator(); solfOsc.frequency.value = 528;
            const lp = audioCtx.createStereoPanner(); lp.pan.value = -1;
            solfOsc.connect(lp); lp.connect(masterGain); solfOsc.start();

            // 3. Right (Quantum Preset)
            quantumOsc = audioCtx.createOscillator(); quantumOsc.frequency.value = 528 + freqs[currentType];
            const rp = audioCtx.createStereoPanner(); rp.pan.value = 1;
            quantumOsc.connect(rp); rp.connect(masterGain); quantumOsc.start();

            // 4. Grounding (7.83Hz)
            schumannOsc = audioCtx.createOscillator(); schumannOsc.frequency.value = 7.83;
            schumannOsc.connect(masterGain); schumannOsc.start();

            document.getElementById('audio-init').style.display = 'none';
            log("Audio Engine Synchronized.");
        }

        function log(m) {
            const l = document.getElementById('log');
            const d = document.createElement('div'); d.innerText = `> ${m}`;
            l.prepend(d);
        }

        // Tangle Visuals
        const canvas = document.getElementById('tangle-canvas');
        const x = canvas.getContext('2d');
        let pts = [];
        function initT() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; for(let i=0; i<85; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2 }); }
        function drawT() { x.clearRect(0,0,canvas.width,canvas.height); pts.forEach((p, i) => { p.x += p.vx; p.y += p.vy; if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1; pts.slice(i+1).forEach(p2 => { const d = Math.hypot(p.x-p2.x, p.y-p2.y); if(d < 180) { x.strokeStyle = `rgba(0,255,255,${0.15 * (1-d/180)})`; x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(p2.x,p2.y); x.stroke(); } }); }); requestAnimationFrame(drawT); }
        initT(); drawT();
    </script>
</body>
</html>

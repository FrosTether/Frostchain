<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frostchain | v52 Sonic</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --gold: #ffd700; --fnr: #00d2ff; --btc: #f7931a; --cyan: #00ffff; --sol: #9945ff; --poh: #14f195; }
        body { margin: 0; background: var(--bg); color: var(--term); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        
        #tangle-canvas { position: fixed; inset: 0; z-index: 5; cursor: crosshair; filter: contrast(2) brightness(1.3) saturate(1.5); }
        
        #dash { display: grid; grid-template-columns: 340px 1fr 340px; height: 100vh; position: relative; z-index: 10; transition: opacity 0.5s; }
        .panel { background: rgba(5,5,5,0.92); border: 1px solid #222; padding: 15px; overflow-y: auto; backdrop-filter: blur(15px); }
        .header { grid-column: 1 / -1; height: 60px; background: #000; border-bottom: 2px solid var(--term); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 100; }

        /* AUDIO CONTROLS */
        .audio-deck { background: #0a0a0a; border: 1px solid var(--sol); padding: 15px; margin-top: 20px; border-left: 4px solid var(--sol); }
        .track-info { font-size: 0.7rem; color: #fff; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        input[type="range"] { width: 100%; accent-color: var(--term); background: #333; height: 2px; }

        .btn-mode { width: 100%; padding: 12px; margin-bottom: 5px; background: #000; border: 1px solid #333; color: #666; font-weight: bold; cursor: pointer; text-align: left; }
        .btn-mode.active-alpha { border-color: var(--cyan); color: var(--cyan); }
        .btn-mode.active-theta { border-color: #7d00ff; color: #7d00ff; }
        .btn-mode.active-delta { border-color: var(--gold); color: var(--gold); }

        /* FULLSCREEN GHOST UI */
        body.fs-active #dash { opacity: 0; pointer-events: none; }
        .fs-toggle { position: fixed; bottom: 20px; right: 20px; z-index: 200; background: #000; border: 1px solid #444; color: #666; padding: 8px 15px; cursor: pointer; font-size: 0.7rem; }
        
        #start-gate { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <canvas id="tangle-canvas"></canvas>
    <input type="file" id="local-file" accept="audio/*" style="display:none" onchange="handleFile(this.files)">

    <div id="start-gate" onclick="startSystem()">
        <div style="text-align:center; border: 1px solid var(--term); padding: 40px; box-shadow: 0 0 30px rgba(0,255,65,0.2);">
            <h1 style="color:var(--term); letter-spacing:5px; margin:0;">MIRACLE NODE v52</h1>
            <p style="color:var(--gold); font-size:0.8rem; margin-top:15px;">[ CLICK TO INITIALIZE AUDIO ENGINE ]</p>
        </div>
    </div>

    <button class="fs-toggle" onclick="toggleFS()">[ TOGGLE IMMERSIVE ]</button>

    <div id="dash">
        <div class="header">
            <div>FROSTOISE <span style="color:var(--sol)">v52.0 SONIC</span></div>
            <div style="font-size:0.7rem;">AUDIO_ENGINE: <span id="audio-stat" style="color:var(--poh)">STANDBY</span></div>
        </div>

        <div class="panel">
            <div style="font-size:0.6rem; color:#666; margin-bottom:10px;">FREQUENCY MATRIX</div>
            <button id="btn-alpha" class="btn-mode" onclick="setFreq('alpha')">ALPHA [40Hz] GAMMA</button>
            <button id="btn-theta" class="btn-mode" onclick="setFreq('theta')">THETA [6.39Hz] FLOW</button>
            <button id="btn-delta" class="btn-mode" onclick="setFreq('delta')">DELTA [PI Hz] SLEEP</button>

            <div class="audio-deck">
                <div style="font-size:0.6rem; color:var(--sol); margin-bottom:5px;">SONIC INJECTION PORT</div>
                <div class="track-info" id="track-name">NO DISC LOADED</div>
                <button onclick="document.getElementById('local-file').click()" style="width:100%; background:#111; color:#fff; border:1px solid var(--sol); cursor:pointer; padding:10px; font-size:0.7rem;">[ LOAD LOCAL FILE ]</button>
                <div style="margin-top:10px; font-size:0.6rem; color:#888;">VISUALIZER SENSITIVITY</div>
                <input type="range" min="0" max="2" step="0.1" value="1" oninput="vizSense = this.value">
            </div>
        </div>

        <div style="display:flex; flex-direction:column; background:rgba(0,0,0,0.6); z-index:60; border-left:1px solid #222; border-right:1px solid #222;">
            <div id="chat-log" style="flex:1; padding:15px; font-size:0.7rem; overflow-y:auto; color:#ccc;">
                <div style="color:var(--term)">> Frostoise Kernel v52.0 Loaded.</div>
                <div style="color:var(--sol)">> Audio Reactive Drivers: ONLINE</div>
            </div>
            <input type="text" style="background:#000; border:none; border-top:1px solid #333; padding:15px; color:#fff; font-family:inherit;" placeholder="Broadcast..." onkeydown="if(event.key==='Enter') send(this)">
        </div>

        <div class="panel">
            <div style="background:#0a0a0a; border:1px solid #333; padding:15px; border-left:4px solid var(--gold); margin-bottom:15px;">
                <div style="font-size:0.6rem; color:var(--gold);">13.37% GENESIS STAKE</div>
                <div style="font-size:1.4rem; font-weight:bold; color:#fff;">11,870,000.00 FTC</div>
            </div>
            <div style="text-align:center; padding:20px; border:1px solid #222; margin-top:20px;">
                <div style="font-size:0.6rem; color:#888;">BLOCK_TIMER</div>
                <div style="font-size:3rem; color:#fff;" id="timer">300</div>
            </div>
        </div>
    </div>

    <script>
        let actx, oscL, oscR, musicSource, analyser;
        let vizSense = 1;
        
        function startSystem() {
            document.getElementById('start-gate').style.display = 'none';
            initAudio();
            initTangle();
        }

        function initAudio() {
            actx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = actx.createAnalyser();
            analyser.fftSize = 256; // Optimized for performance
            document.getElementById('audio-stat').innerText = "ACTIVE";
        }

        function handleFile(files) {
            if(!files.length) return;
            const file = files[0];
            const url = URL.createObjectURL(file);
            document.getElementById('track-name').innerText = file.name.toUpperCase();
            
            if(musicSource) musicSource.disconnect();
            
            const audio = new Audio();
            audio.src = url;
            audio.crossOrigin = "anonymous";
            audio.play();
            
            const source = actx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(actx.destination);
            musicSource = source;
            
            document.getElementById('audio-stat').innerText = "PLAYING: " + file.name.substr(0,10) + "...";
        }

        function setFreq(mode) {
            if(!actx) initAudio();
            if(oscL) { oscL.stop(); oscR.stop(); }
            
            document.querySelectorAll('.btn-mode').forEach(b => b.className = 'btn-mode');
            document.getElementById('btn-'+mode).classList.add('active-'+mode);

            let f = 432, diff = 0;
            if(mode === 'alpha') diff = 40;
            if(mode === 'theta') diff = 6.39;
            if(mode === 'delta') diff = Math.PI;

            oscL = actx.createOscillator(); oscR = actx.createOscillator();
            const g = actx.createGain(); g.gain.value = 0.05; // Low volume for background
            
            oscL.frequency.value = f; oscR.frequency.value = f + diff;
            oscL.connect(g).connect(actx.destination);
            oscR.connect(g).connect(actx.destination);
            oscL.start(); oscR.start();
        }

        function initTangle() {
            const canvas = document.getElementById('tangle-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            
            let nodes = Array(70).fill().map(()=>({
                x:Math.random()*canvas.width, y:Math.random()*canvas.height, 
                vx:(Math.random()-.5), vy:(Math.random()-.5),
                baseR: Math.random()*150 + 50, // Base radius
                clr: ["#14f195", "#9945ff", "#00ffff"][Math.floor(Math.random()*3)]
            }));
            
            const bufferLength = analyser ? analyser.frequencyBinCount : 0;
            const dataArray = new Uint8Array(bufferLength);

            function loop() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                
                let bass = 0, mid = 0;
                if(analyser) {
                    analyser.getByteFrequencyData(dataArray);
                    bass = dataArray[10] || 0; // Low freq
                    mid = dataArray[100] || 0; // Mid freq
                }
                
                const boost = (bass / 255) * vizSense; // 0.0 to 1.0

                nodes.forEach(n => {
                    // Reactive Movement
                    n.x += n.vx * (1 + boost * 2); 
                    n.y += n.vy * (1 + boost * 2);
                    
                    if(n.x<0||n.x>canvas.width)n.vx*=-1; 
                    if(n.y<0||n.y>canvas.height)n.vy*=-1;
                    
                    nodes.forEach(n2 => {
                        let d = Math.hypot(n.x-n2.x, n.y-n2.y);
                        // Reactive Radius: Expand when bass hits
                        let limit = n.baseR + (bass * 0.5 * vizSense);
                        
                        if(d < limit) {
                            ctx.strokeStyle = n.clr; 
                            // Opacity reacts to mids
                            ctx.globalAlpha = (1 - d/limit) + (mid/500);
                            ctx.lineWidth = 1 + (boost * 3); // Thicker lines on beat
                            ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(n2.x,n2.y); ctx.stroke();
                        }
                    });
                });
                requestAnimationFrame(loop);
            }
            loop();
        }

        function toggleFS() {
            if(!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.body.classList.add('fs-active');
            } else {
                document.exitFullscreen();
                document.body.classList.remove('fs-active');
            }
        }
        
        function send(el) {
            const d = document.createElement('div');
            d.innerHTML = `<span style="color:var(--cyan)">drfrost</span>: ${el.value}`;
            document.getElementById('chat-log').appendChild(d);
            el.value = "";
        }
        
        setInterval(() => {
            let t = parseInt(document.getElementById('timer').innerText) - 1;
            if(t < 0) t = 300;
            document.getElementById('timer').innerText = t;
        }, 1000);

    </script>
</body>
</html>

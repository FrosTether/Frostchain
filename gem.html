<!DOCTYPE html><html><head><title>Slots</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="ledger.js"></script></head>
<body onload="l=Ledger.init();u()">
    <div class="hud">
        <a href="index.html" class="btn" style="border:none; padding:5px;">⬅</a>
        <div>🎰 FRST: <span id="bal">0</span></div>
    </div>
    
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <div class="mirror" style="display:flex; gap:10px; padding:30px;">
            <div id="r0" style="font-size:50px;">❄️</div>
            <div id="r1" style="font-size:50px;">❄️</div>
            <div id="r2" style="font-size:50px;">❄️</div>
        </div>
        <button class="btn" style="margin-top:40px; width:200px;" onclick="spin()">SPIN (5 FTC)</button>
    </div>

    <script>
    const S = ["❄️","💎","7","🌕"];
    function u(){ document.getElementById('bal').innerText=l.frst; }
    function spin(){
        if(l.ftc<5) return alert("NEED 5 FTC");
        l.ftc-=5; Ledger.save(l);
        [0,1,2].forEach(i=>{
            let el=document.getElementById('r'+i); el.style.filter="blur(5px)";
            setTimeout(()=>{
                el.style.filter="none";
                el.innerText = S[Math.floor(Math.random()*S.length)];
                if(i===2) check();
            }, 500+i*300);
        });
    }
    function check(){
        let r0=document.getElementById('r0').innerText;
        let r1=document.getElementById('r1').innerText;
        let r2=document.getElementById('r2').innerText;
        if(r0===r1 && r1===r2) { l.frst+=50; Ledger.sfx('combo'); alert("JACKPOT! +50 FRST"); Ledger.save(l); u(); }
    }
    </script>
</body></html>

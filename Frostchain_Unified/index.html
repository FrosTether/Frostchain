<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_WALLET // UNIFIED</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--gold:#ffd700;--blue:#00e0ff;--pink:#ff69b4;--red:#f00;--white:#fff;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;text-align:center;}#main-frame{max-width:700px;margin:40px auto;border:1px solid #333;padding:40px;background:rgba(255,255,255,0.01);}h1{color:var(--white);letter-spacing:5px;font-size:24px;}.p-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:20px 0;}.p-card{background:#111;padding:10px;border-top:2px solid var(--blue);font-size:12px;}.btn{width:100%;padding:20px;font-family:inherit;font-weight:bold;cursor:pointer;border:none;margin-top:10px;}.btn-claim{background:var(--blue);color:#000;}.status{font-size:10px;color:var(--gold);margin:15px 0;}#count{font-size:40px;color:var(--red);font-weight:bold;}.paper{background:#fff;color:#000;padding:20px;text-align:left;margin-top:20px;border:2px dashed #000;font-size:11px;}</style></head><body><div id="main-frame"><h1>FROST_WALLET_MAKER</h1><div id="airdrop-ui"><div id="count-box"><div style="font-size:10px;color:var(--red)">GENESIS_AIRDROP_SPOTS</div><div id="count">25</div></div><div class="p-grid"><div class="p-card">1,000<br><small>FTC</small></div><div class="p-card">100,000<br><small>FRST</small></div><div class="p-card">100<br><small>FNR</small></div></div><input type="text" id="nodeID" placeholder="NODE_ID (e.g. Architect_01)" style="width:100%;padding:15px;background:#000;border:1px solid #444;color:var(--pink);text-align:center;box-sizing:border-box;margin-bottom:10px;"><button class="btn btn-claim" onclick="claim()">MINT_FROSTCHAIN_IDENTITY_FILE</button></div><div id="offline-ui" style="display:none;"><h3>GRAYSON_OFFLINE_VAULT_GENERATOR</h3><button class="btn" style="background:var(--gold);color:#000;" onclick="generatePaper()">GENERATE_OFFLINE_PAPER_WALLET</button><div id="paper-output"></div></div></div><script>let c=25;function claim(){let n=document.getElementById("nodeID").value;if(!n){alert("NODE_ID_REQUIRED");return;}if(c>0){c--;document.getElementById("count").innerText=c;downloadFile(n);if(c===0)switchToPaper();}else{alert("GENESIS_CLOSED");}}function downloadFile(name){let entropy=Math.random().toString(36).substring(2,15);let content=`UNIFIED_FROSTCHAIN_WALLET_FILE\nNODE_ID: ${name}.frostchain\nPHASE: GENESIS\nNEWKIRK: NK-82-7.83Hz`;let blob=new Blob([content],{type:"text/plain"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${name}.frostchain`;a.click();}function switchToPaper(){document.getElementById("airdrop-ui").style.display="none";document.getElementById("offline-ui").style.display="block";}function generatePaper(){const entropy=Math.random().toString(36).substring(2,15);const pub="frost_"+btoa(entropy);const priv="secret_"+btoa(entropy+entropy);document.getElementById("paper-output").innerHTML=`<div class="paper"><strong>PUBLIC_ADDRESS:</strong><br>${pub}<br><br><strong>PRIVATE_KEY:</strong><br><span style="color:red">${priv}</span><br><br><strong>SYSTEM:</strong> .FROSTCHAIN</div><button onclick="window.print()">PRINT_VAULT</button>`;}</script></body></html>

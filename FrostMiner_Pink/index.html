<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_MINER // PINK_NOISE_CORE</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--gold:#ffd700;--pink:#ff69b4;--blue:#00e0ff;--panel:#111;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;}h1{color:var(--pink);border-bottom:1px solid #333;padding-bottom:10px;}h2{font-size:12px;color:#666;margin-bottom:20px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}.card{background:var(--panel);padding:20px;border:1px solid #333;text-align:center;}.val{font-size:28px;color:#fff;font-weight:bold;margin-top:10px;}.label{font-size:10px;color:#888;text-transform:uppercase;}.status{margin-top:20px;padding:10px;border:1px solid #333;background:#000;color:var(--green);font-size:12px;}button{width:100%;padding:15px;background:var(--pink);color:#000;border:none;font-weight:bold;cursor:pointer;margin-top:20px;font-family:inherit;}</style></head><body><h1>FROST_AUDIO_ENGINE</h1><h2>PINK_NOISE_BASE // RNG_BLOCK_SWITCHING</h2><div class="grid"><div class="card" style="border-top:2px solid var(--blue);"><div class="label">LEFT_EAR (SOLFEGGIO)</div><div class="val" id="leftFreq" style="color:var(--blue)">OFF</div><div class="label" id="solfIndex">WAITING...</div></div><div class="card" style="border-top:2px solid var(--gold);"><div class="label">RIGHT_EAR (RNG_SWITCH)</div><div class="val" id="rightFreq" style="color:var(--gold)">OFF</div><div class="label" id="blockType">BLOCK_?</div></div></div><div class="card" style="margin-top:20px;border-top:2px solid var(--pink);"><div class="label">BASE_LAYER (ALWAYS_ON)</div><div style="display:flex;justify-content:space-around;margin-top:10px;"><span style="color:var(--pink)">PINK_NOISE</span><span>432 Hz</span><span>40 Hz (Gamma)</span><span>7.83 Hz</span></div></div><div class="status" id="log">> SYSTEM_READY. CLICK START TO INITIATE AUDIO_ENGINE.</div><button onclick="startEngine()">INITIATE_AUDIO_SEQUENCE</button><script>let ctx,pinkNode,oscBase=[],oscL,oscR,panL,panR;let solfeggio=[174,285,396,417,528,639,741,852,963];let sIndex=0;function startEngine(){if(!ctx){ctx=new AudioContext();createPinkNoise();createBaseWaves();setInterval(nextBlock,5000);log("> AUDIO_ENGINE_STARTED. BASE_WAVES_ACTIVE.");}}function createPinkNoise(){let bSize=4096;let pink=ctx.createScriptProcessor(bSize,1,1);pink.onaudioprocess=function(e){let out=e.outputBuffer.getChannelData(0);let b0,b1,b2,b3,b4,b5,b6;b0=b1=b2=b3=b4=b5=b6=0.0;for(let i=0;i<bSize;i++){let w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;out[i]=b0+b1+b2+b3+b4+b5+b6+w*0.5362;out[i]*=0.05;b6=w*0.115926;}};pink.connect(ctx.destination);}function createBaseWaves(){[432,40,7.83].forEach(f=>{let o=ctx.createOscillator();let g=ctx.createGain();o.frequency.value=f;g.gain.value=0.05;o.connect(g);g.connect(ctx.destination);o.start();});panL=ctx.createStereoPanner();panL.pan.value=-1;panL.connect(ctx.destination);panR=ctx.createStereoPanner();panR.pan.value=1;panR.connect(ctx.destination);}function nextBlock(){let freqL=solfeggio[sIndex%solfeggio.length];playLeft(freqL);let rng=Math.random();let freqR=(rng>0.5)?11.11:3.14159;let type=(rng>0.5)?"BLOCK_A (11.11)":"BLOCK_B (PI)";playRight(freqR);document.getElementById("leftFreq").innerText=freqL+" Hz";document.getElementById("solfIndex").innerText="INDEX: "+(sIndex%9+1)+"/9";document.getElementById("rightFreq").innerText=freqR.toFixed(5)+" Hz";document.getElementById("blockType").innerText=type;log("> NEW_BLOCK: LEFT="+freqL+" | RIGHT="+type);sIndex++;}function playLeft(f){if(oscL)oscL.stop();oscL=ctx.createOscillator();oscL.frequency.value=f;oscL.connect(panL);oscL.start();}function playRight(f){if(oscR)oscR.stop();oscR=ctx.createOscillator();oscR.frequency.value=f;oscR.connect(panR);oscR.start();}function log(m){document.getElementById("log").innerText=m;}</script></body></html>

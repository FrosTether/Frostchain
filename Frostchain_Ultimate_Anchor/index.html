<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_WALLET // ANCHOR</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#0a0a0a;--frost:#00e0ff;--oneinch:#943cf0;--text:#fff;}body{background:var(--bg);color:var(--text);font-family:"Share Tech Mono",monospace;margin:0;display:flex;justify-content:center;align-items:center;height:100vh;}#wallet-frame{width:100%;max-width:420px;background:#111;border:1px solid #333;border-radius:24px;overflow:hidden;box-shadow:0 0 40px rgba(148,60,240,0.15);}.header{background:linear-gradient(135deg, var(--oneinch), var(--frost));padding:30px;text-align:center;color:#000;font-weight:bold;}.asset-card{padding:25px;background:rgba(255,255,255,0.03);margin:15px;border-radius:15px;border:1px solid #222;}.balance{font-size:36px;margin:10px 0;color:var(--frost);}.input-box{width:calc(100% - 30px);margin:0 15px 10px;padding:15px;background:#000;border:1px solid #444;color:var(--frost);font-family:inherit;border-radius:10px;}.btn-1inch{width:calc(100% - 30px);margin:10px 15px;padding:20px;background:var(--oneinch);color:#fff;border:none;border-radius:12px;font-weight:bold;cursor:pointer;font-family:inherit;}.btn-dat{width:calc(100% - 30px);margin:0 15px 20px;padding:15px;background:#222;color:#888;border:none;border-radius:12px;cursor:pointer;font-size:11px;font-family:inherit;}</style></head><body><div id="wallet-frame"><div class="header">1INCH x FROSTCHAIN</div><div class="asset-card"><div style="font-size:10px;color:#888;">GENESIS_ALLOCATION</div><div class="balance">100,000.00 <span style="font-size:14px;">FRST</span></div><div style="font-size:11px;">+ 1,000 FTC | 100 FNR</div></div><input type="text" id="node" class="input-box" placeholder="NODE_NAME (e.g. mary.frostchain)"><button class="btn-1inch" onclick="connect1inch()">CONNECT 1INCH WALLET</button><button class="btn-dat" onclick="downloadDat()">MINT_WALLET.DAT</button><div style="text-align:center;padding-bottom:20px;font-size:9px;color:#444;">ADMIN: drfrost.frostchain</div></div><script>function connect1inch(){alert("1INCH_API_HANDSHAKE_INITIATED... REDIRECTING TO SECURE SIGNER.");}function downloadDat(){let n=document.getElementById("node").value || "node";let content=`FROSTCHAIN_VAULT_V77\nID: ${n}.frostchain\nSIGNER: drfrost.frostchain\nASSETS: 100K_FRST_GENESIS\nBIP_STANDARD: Frost-OG`;let blob=new Blob([content],{type:"application/octet-stream"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${n}.wallet.dat`;a.click();}</script></body></html>

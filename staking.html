<!DOCTYPE html><html><head><title>Staking | Vault</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="ledger.js"></script>
<style>
    .vault-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; width: 90%; }
    .stat-card { padding: 20px; text-align: center; border: 1px solid var(--dark-gold); }
    .pulse-gold { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { text-shadow: 0 0 5px var(--gold); } 50% { text-shadow: 0 0 20px var(--gold); } 100% { text-shadow: 0 0 5px var(--gold); } }
</style></head>
<body onload="update()">
    <div class="hud">
        <a href="index.html" class="btn" style="border:none; padding:5px;">⬅ HUB</a>
        <div class="pulse-gold">FROST_POINTS: <span id="fp">0</span></div>
    </div>

    <div class="mirror reflection" style="margin-top:20px; padding:30px; width:80%; text-align:center;">
        <h2 style="color:var(--gold); margin:0;">GOLDEN VAULT</h2>
        <p style="font-size:9px; color:var(--cream); opacity:0.7;">STAKE FCN ➔ EARN LUCK</p>
    </div>

    <div class="vault-grid">
        <div class="mirror stat-card">
            <div style="font-size:9px;">LOCKED FCN</div>
            <div id="locked" style="font-size:18px; color:var(--cream);">0</div>
        </div>
        <div class="mirror stat-card">
            <div style="font-size:9px;">LUCK MULTIPLIER</div>
            <div id="luck" style="font-size:18px; color:#34fa99;">1.0x</div>
        </div>
    </div>

    <div class="mirror" style="width:85%; padding:20px; text-align:center;">
        <div style="font-size:10px; margin-bottom:10px;">AVAILABLE FCN: <span id="avail">0</span></div>
        <button class="btn" style="width:100%;" onclick="stake()">LOCK 10 FCN</button>
        <button class="btn" style="width:100%; margin-top:10px; border-color:#ff4444; color:#ff4444;" onclick="unstake()">UNLOCK ALL</button>
    </div>

    <script>
        let l = Ledger.init();
        // Claim rewards loop
        setInterval(() => {
            let r = Ledger.claimStaking();
            if(r > 0) update();
        }, 5000);

        function update() {
            l = Ledger.init();
            document.getElementById('fp').innerText = Math.floor(l.frostPoints);
            document.getElementById('locked').innerText = l.stakedFCN;
            document.getElementById('avail').innerText = l.fcn;
            document.getElementById('luck').innerText = Ledger.getLuck().toFixed(2) + "x";
        }

        function stake() {
            if(l.fcn >= 10) {
                l.fcn -= 10; l.stakedFCN += 10;
                if(l.lastStakeTime === 0) l.lastStakeTime = Date.now();
                Ledger.save(l); Ledger.sfx('coin'); update();
            } else alert("NEED 10 FCN");
        }

        function unstake() {
            if(l.stakedFCN > 0) {
                Ledger.claimStaking(); // Claim pending first
                l.fcn += l.stakedFCN; l.stakedFCN = 0;
                Ledger.save(l); Ledger.sfx('coin'); update();
            }
        }
    </script>
</body></html>

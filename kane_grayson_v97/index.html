<!DOCTYPE html>
<html>
<head>
    <title>Kane Frostchain | Grayson Vault</title>
    <style>
        :root { --bg: #010105; --ice: #a5f2f3; --term: #00ff41; --fail: #ff3333; }
        body { background: var(--bg); color: var(--ice); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; height: 100vh; }
        
        #gate { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loading { border: 3px solid rgba(165, 242, 243, 0.1); border-left-color: var(--ice); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #status { margin-top: 20px; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }
        #dashboard { display: none; padding: 20px; opacity: 0; transition: opacity 1s; }
    </style>
</head>
<body>

    <div id="gate">
        <div style="font-size: 2rem; letter-spacing: 10px; margin-bottom: 20px; color: #fff;">SYNCING</div>
        <div class="loading"></div>
        <div id="status">Polling Grayson Wallet API...</div>
    </div>

    <div id="dashboard">
        <div style="display:flex; justify-content:space-between; border-bottom: 1px solid var(--ice); padding: 10px 0;">
            <div style="font-size: 1.2rem; font-weight: bold;">KANE<span style="color:var(--term)">FROSTCHAIN</span> // <span style="color:var(--ice)" id="id-tag">--</span></div>
            <div style="color:var(--term); font-size: 0.7rem;">STATUS: ENCLAVE_UNLOCKED</div>
        </div>
        
        <div style="text-align:center; padding: 50px 0;">
            <div style="font-size: 0.7rem; color: #666; margin-bottom: 10px;">TOTAL ETF RESERVES (NEWKIRK BACKED)</div>
            <div style="font-size: 3.5rem; color: #fff; font-weight: bold; text-shadow: 0 0 20px var(--ice);">$102,450,200</div>
        </div>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div style="border: 1px solid #333; padding: 20px;">
                <div style="font-size: 0.6rem; color: #888;">fszUSD CIRCULATING</div>
                <div style="font-size: 1.5rem; color: var(--ice);">5,000,000</div>
            </div>
            <div style="border: 1px solid #333; padding: 20px;">
                <div style="font-size: 0.6rem; color: #888;">fPLAT PRICE</div>
                <div style="font-size: 1.5rem; color: #e5e4e2;">$1,842.10</div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', async () => {
            const status = document.getElementById('status');
            
            // 1. Detect Grayson Provider
            if (!window.grayson) {
                status.innerText = "ERROR: GRAYSON PROVIDER NOT FOUND";
                status.style.color = "var(--fail)";
                return;
            }

            try {
                // 2. Request Handshake for drfrost.frostchain
                const identity = await window.grayson.getIdentity();
                
                if (identity === 'drfrost.frostchain') {
                    status.innerText = "VERIFIED: " + identity + ". UNLOCKING VAULT...";
                    status.style.color = "var(--term)";
                    
                    setTimeout(() => {
                        document.getElementById('gate').style.display = 'none';
                        document.getElementById('id-tag').innerText = identity;
                        const dash = document.getElementById('dashboard');
                        dash.style.display = 'block';
                        setTimeout(() => dash.style.opacity = '1', 50);
                    }, 1500);
                } else {
                    status.innerText = "DENIED: WRONG IDENTITY DETECTED";
                    status.style.color = "var(--fail)";
                }
            } catch (e) {
                status.innerText = "ERROR: API HANDSHAKE FAILED";
                status.style.color = "var(--fail)";
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FROSTCRUSH | SVG CRYPTO</title>
<style>
  :root { --bg: #050505; --cyan: #00ffff; --iota: #00ff41; --gold: #ffd700; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { 
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    position: fixed;
    inset: 0;
  }
  body { 
    background: var(--bg); 
    color: #fff; 
    font-family: 'Courier New', monospace; 
    text-align: center; 
    touch-action: none; 
    user-select: none;
    display: flex;
    flex-direction: column;
  }
  #boot { 
    position: fixed; 
    inset: 0; 
    background: #000; 
    z-index: 9999; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
  }
  .btn { 
    padding: 15px 40px; 
    border: 2px solid var(--cyan); 
    background: transparent; 
    color: var(--cyan); 
    cursor: pointer; 
    font-family: inherit; 
    font-weight: bold; 
    text-shadow: 0 0 10px var(--cyan); 
  }
  #hud { 
    height: 100px; 
    padding: 10px; 
    border-bottom: 2px solid var(--cyan); 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    background: #000;
    flex-shrink: 0;
  }
  .row { 
    display: flex; 
    justify-content: space-between; 
    width: 100%; 
    align-items: center; 
  }
  .label { 
    font-size: 0.55em; 
    color: #666; 
    font-weight: bold; 
  }
  .val { 
    font-size: 1.0em; 
    font-weight: 900; 
    text-shadow: 0 0 10px var(--cyan); 
  }
  
  #stage { 
    flex: 1;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative;
    width: 100%;
    padding: 10px;
  }
  #grid { 
    display: grid; 
    grid-template-columns: repeat(8, 1fr); 
    width: min(90vw, calc(100vh - 140px));
    height: min(90vw, calc(100vh - 140px));
    max-width: 600px;
    max-height: 600px;
    background: rgba(0,0,0,0.8); 
    border: 2px solid #333; 
    border-radius: 8px;
    gap: 2px;
  }
  
  .cell { 
    width: 100%; 
    height: 100%; 
    border: 1px solid rgba(255,255,255,0.05); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer; 
  }
  
  /* SVG COIN STYLING */
  .asset {
    width: 85%; 
    height: 85%; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25), rgba(0,0,0,0.6));
    box-shadow: inset 2px 2px 6px rgba(255,255,255,0.35), inset -2px -2px 6px rgba(0,0,0,0.6), 0 0 12px currentColor;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .asset svg { 
    width: 70%;
    height: 70%;
    filter: drop-shadow(0 0 6px currentColor); 
  }
  
  .selected .asset { 
    transform: scale(1.2); 
    box-shadow: 0 0 15px var(--cyan); 
    border: 2px solid #fff; 
  }
  
  /* COIN POP ANIMATION */
  .matched .asset { 
    animation: coinPop 0.35s ease forwards; 
  }
  @keyframes coinPop {
    0%   { transform: scale(1) rotate(0deg); }
    100% { transform: scale(0) rotate(180deg); opacity: 0; }
  }

  .drop .asset { 
    animation: dropIn 0.3s ease-in; 
  }
  @keyframes dropIn { 
    from { transform: translateY(-50px); opacity: 0; } 
    to { transform: translateY(0); opacity: 1; } 
  }
</style>
</head>
<body>

<div id="boot">
  <div style="color:var(--iota); font-size:0.8em; margin-bottom:20px;">FROSTCRUSH SAGA | SVG COINS</div>
  <button class="btn" onclick="start()">INIT SYSTEM</button>
</div>

<div id="hud">
  <div class="row"><div class="label">NODE ID: drfrost.frostchain</div><div class="val" id="t">--:--</div></div>
  <div class="row" style="margin-top:10px;">
    <div><div class="label">WALLET</div><div class="val" id="w" style="color:var(--gold);">50.0000</div></div>
    <div style="text-align:right;"><div class="label">PENDING</div><div class="val" id="p" style="color:var(--cyan);">+0.0000</div></div>
  </div>
</div>

<div id="stage"><div id="grid"></div></div>

<script>
const EMPTY = -1;
const SVG = (path) => `<svg viewBox="0 0 100 100" width="100%" height="100%" fill="currentColor">${path}</svg>`;

const ASSETS = [
  { n:'IOTA', c:'#00ffff', svg: SVG(`<circle cx="50" cy="50" r="42"/><circle cx="50" cy="50" r="26" fill="none" stroke="currentColor" stroke-width="6"/>`) },
  { n:'BTC', c:'#00ff41', svg: SVG(`<circle cx="50" cy="50" r="42"/><text x="50" y="64" font-size="48" text-anchor="middle" fill="#000" font-family="Arial" font-weight="bold">₿</text>`) },
  { n:'XMR', c:'#ff4500', svg: SVG(`<path d="M8 60 L30 30 L50 50 L70 30 L92 60 L92 92 L8 92 Z"/>`) },
  { n:'FEATHER', c:'#b026ff', svg: SVG(`<path d="M20 80 C60 20, 90 40, 70 70 C50 90, 30 90, 20 80 Z"/>`) },
  { n:'DOGE', c:'#ffd700', svg: SVG(`<circle cx="50" cy="50" r="42"/><text x="50" y="64" font-size="44" text-anchor="middle" fill="#000" font-family="Arial" font-weight="bold">Ð</text>`) },
  { n:'DGC', c:'#007fff', svg: SVG(`<polygon points="50,6 92,50 50,94 8,50"/>`) }
];

let wallet = 50.0, pending = 0.0, selected = null, processing = false, virtualGrid = [];

function start() {
  const elem = document.documentElement;
  // Try multiple fullscreen methods for cross-browser compatibility
  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.webkitRequestFullscreen) {
    elem.webkitRequestFullscreen();
  } else if (elem.mozRequestFullScreen) {
    elem.mozRequestFullScreen();
  } else if (elem.msRequestFullscreen) {
    elem.msRequestFullscreen();
  }
  
  document.getElementById('boot').style.display = 'none';
  createBoard();
}

function createBoard() {
  const g = document.getElementById('grid'); g.innerHTML = ''; virtualGrid = [];
  for (let i=0; i<64; i++) virtualGrid.push(Math.floor(Math.random()*ASSETS.length));
  while(hasMatches()) { for(let i=0; i<64; i++) virtualGrid[i] = Math.floor(Math.random()*ASSETS.length); }
  syncDOM();
}

function hasMatches() {
  for(let i=0; i<64; i++) {
    let r = i%8, c = Math.floor(i/8);
    if(r<6 && virtualGrid[i]===virtualGrid[i+1] && virtualGrid[i]===virtualGrid[i+2]) return true;
    if(c<6 && virtualGrid[i]===virtualGrid[i+8] && virtualGrid[i]===virtualGrid[i+16]) return true;
  }
  return false;
}

function syncDOM() {
  const gDiv = document.getElementById('grid'); gDiv.innerHTML = '';
  virtualGrid.forEach((type, i) => {
    const cell = document.createElement('div'); cell.className = 'cell'; cell.id = i;
    if(type !== EMPTY) {
      cell.innerHTML = `<div class="asset" style="color:${ASSETS[type].c}">${ASSETS[type].svg}</div>`;
    }
    cell.onclick = () => { if(navigator.vibrate) navigator.vibrate(15); handleInput(cell); };
    gDiv.appendChild(cell);
  });
  processing = false;
}

function handleInput(cell) {
  if(processing) return;
  const id = parseInt(cell.id);
  if(!selected) { selected = cell; cell.classList.add('selected'); }
  else {
    const pId = parseInt(selected.id); selected.classList.remove('selected');
    if([pId-1, pId+1, pId-8, pId+8].includes(id)) {
      processing = true;
      let t = virtualGrid[id]; virtualGrid[id] = virtualGrid[pId]; virtualGrid[pId] = t;
      if(!findAndClear()) { setTimeout(() => { virtualGrid[pId] = virtualGrid[id]; virtualGrid[id] = t; syncDOM(); }, 300); }
    }
    selected = null;
  }
}

function findAndClear() {
  let toClear = new Set();
  for(let i=0; i<64; i++) {
    let r = i%8, c = Math.floor(i/8), t = virtualGrid[i];
    if(t === EMPTY) continue;
    if(r<6 && t===virtualGrid[i+1] && t===virtualGrid[i+2]) [i,i+1,i+2].forEach(x=>toClear.add(x));
    if(c<6 && t===virtualGrid[i+8] && t===virtualGrid[i+16]) [i,i+8,i+16].forEach(x=>toClear.add(x));
  }
  if(toClear.size > 0) {
    if(navigator.vibrate) navigator.vibrate([30, 50]);
    toClear.forEach(i => { virtualGrid[i] = EMPTY; document.getElementById(i).classList.add('matched'); });
    pending += 0.0425; updateHUD();
    setTimeout(refill, 400);
    return true;
  }
  return false;
}

function refill() {
  for(let c=0; c<8; c++) {
    let col = [];
    for(let r=0; r<8; r++) if(virtualGrid[r*8+c] !== EMPTY) col.push(virtualGrid[r*8+c]);
    while(col.length < 8) col.unshift(Math.floor(Math.random()*ASSETS.length));
    for(let r=0; r<8; r++) virtualGrid[r*8+c] = col[r];
  }
  syncDOM();
  setTimeout(findAndClear, 400);
}

function updateHUD() {
  document.getElementById('w').innerText = wallet.toFixed(4);
  document.getElementById('p').innerText = "+" + pending.toFixed(4);
}

setInterval(() => {
  const rem = 300 - (Math.floor(Date.now()/1000)%300);
  document.getElementById('t').innerText = `${Math.floor(rem/60)}:${(rem%60).toString().padStart(2,'0')}`;
}, 1000);
</script>
</body>
</html>

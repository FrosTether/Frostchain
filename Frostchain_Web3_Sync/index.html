<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_WALLET // WEB3_SYNC</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--blue:#00e0ff;--pink:#ff69b4;--gold:#ffd700;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;text-align:center;}#main-frame{max-width:700px;margin:20px auto;border:1px solid #333;padding:40px;background:rgba(255,255,255,0.01);}h1{color:#fff;letter-spacing:5px;}#connect-btn{background:linear-gradient(90deg, #3898ff, #ff69b4);color:#fff;border:none;padding:20px;width:100%;font-weight:bold;cursor:pointer;font-family:inherit;font-size:16px;box-shadow:0 0 20px rgba(0,224,255,0.2);}.wallet-info{margin-top:20px;background:#111;padding:20px;border:1px solid #222;display:none;text-align:left;font-size:11px;}.btn-export{background:var(--gold);color:#000;border:none;padding:15px;width:100%;font-weight:bold;cursor:pointer;margin-top:20px;font-family:inherit;}</style></head><body><div id="main-frame"><h1>FROST_WALLET_MAKER</h1><div style="font-size:10px;color:var(--pink);margin-bottom:30px;">WEB3_INVERSION_ENGINE // V70</div><button id="connect-btn" onclick="connectWallet()">CONNECT_BROWSER_WALLET (METAMASK/BASE)</button><div id="wallet-info" class="wallet-info"><div id="addr-display" style="word-break:break-all;color:var(--blue);">ADDRESS: AWAITING...</div><hr style="border:0;border-top:1px solid #333;margin:15px 0;"><p>DETECTED_ENTROPY: 7.83Hz_LOCKED</p><p>ASSET_SCAN: FTC / FRST / FNR MAPPING_READY</p><button class="btn-export" onclick="exportDat()">GENERATE_.FROSTCHAIN_WALLET.DAT</button></div></div><script>let connectedAddr = "";async function connectWallet(){if(window.ethereum){try{const accounts = await window.ethereum.request({method:"eth_requestAccounts"});connectedAddr = accounts[0];document.getElementById("addr-display").innerText = "CONNECTED: " + connectedAddr;document.getElementById("wallet-info").style.display = "block";document.getElementById("connect-btn").innerText = "WALLET_CONNECTED";alert("WEB3_ENTROPY_SYNC_COMPLETE");}catch(e){alert("CONNECTION_REFUSED");}}else{alert("NO_WEB3_WALLET_DETECTED");}}function exportDat(){if(!connectedAddr) return;let datContent = `FROSTCHAIN_DAT_FILE\nSEED_ORIGIN: ${connectedAddr}\nPHASE: GENESIS_V70\nNEWKIRK_KEY: NK-82-FROST-7.83\nASSETS: [FTC, FRST, FNR]`;let blob = new Blob([datContent], {type: "application/octet-stream"});let a = document.createElement("a");a.href = URL.createObjectURL(blob);a.download = "frostchain_wallet.dat";a.click();alert("WALLET.DAT_EXPORTED. MOVE_TO_OFFLINE_STORAGE.");}</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROSTMAP // IOTA_HD_REZ</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#000;--iota-blue:#00e0ff;--pink:#ff69b4;--gold:#ffd700;--green:#0f0;}body,html{margin:0;padding:0;width:100%;height:100%;background:var(--bg);font-family:"Share Tech Mono",monospace;color:#ccc;overflow:hidden;}canvas{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0;z-index:1;}#hud{position:fixed;top:20px;left:20px;z-index:10;background:rgba(0,0,0,0.8);padding:20px;border-left:4px solid var(--pink);pointer-events:none;}#entropy{position:fixed;bottom:20px;left:20px;z-index:10;font-size:10px;color:var(--green);max-width:400px;word-break:break-all;}#btn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;padding:30px;background:var(--pink);color:#000;border:none;font-weight:bold;font-size:20px;cursor:pointer;box-shadow:0 0 50px rgba(255,105,180,0.5);}</style></head><body><button id="btn" onclick="submerge()">[ DROWN_IN_432HZ_PINK_NOISE ]</button><div id="hud"><div style="color:var(--pink);font-size:10px;">SYSTEM: FROSTMAP_HD</div><div style="font-size:24px;color:#fff;" id="tps">TPS: 0.00</div><div style="font-size:12px;color:var(--iota-blue);">MINING_CORE: ACTIVE</div><div style="font-size:12px;color:var(--gold);">WAKELOCK: ON</div></div><div id="entropy">AWAITING_GENESIS...</div><script>let ctx,ana,canvas,cc,nodes=[],wakeLock=null;let tps=0;async function submerge(){document.getElementById("btn").style.display="none";try{wakeLock=await navigator.wakeLock.request("screen");}catch(e){}ctx=new AudioContext();createPinkNoise();create432();initTangle();loop();}function createPinkNoise(){let b=ctx.createScriptProcessor(4096,1,1);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;b.onaudioprocess=e=>{let out=e.outputBuffer.getChannelData(0);for(let i=0;i<4096;i++){let w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;out[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.08;b6=w*0.115926;}};b.connect(ctx.destination);}function create432(){let o=ctx.createOscillator();let g=ctx.createGain();o.frequency.value=432;g.gain.value=0.04;o.connect(g);g.connect(ctx.destination);o.start();}function initTangle(){canvas=document.createElement("canvas");document.body.appendChild(canvas);cc=canvas.getContext("2d");window.onresize=()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;};window.onresize();for(let i=0;i<82;i++)nodes.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2});}function loop(){cc.fillStyle="rgba(0,0,0,0.1)";cc.fillRect(0,0,canvas.width,canvas.height);cc.strokeStyle="rgba(0,224,255,0.2)";cc.lineWidth=1;nodes.forEach((n,i)=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>canvas.width)n.vx*=-1;if(n.y<0||n.y>canvas.height)n.vy*=-1;nodes.slice(i+1).forEach(m=>{let dx=n.x-m.x,dy=n.y-m.y,d=Math.sqrt(dx*dx+dy*dy);if(d<150){cc.beginPath();cc.moveTo(n.x,n.y);cc.lineTo(m.x,m.y);cc.stroke();if(Math.random()>0.999){harvest(n,m);}}});cc.fillStyle=Math.random()>0.98? "#ff69b4":"#00e0ff";cc.fillRect(n.x,n.y,2,2);});requestAnimationFrame(loop);}function harvest(n,m){let seed="xmr_iota_"+(n.x*m.y*Date.now()).toString(16);document.getElementById("entropy").innerText=seed;tps+=0.01;document.getElementById("tps").innerText="TPS: "+tps.toFixed(2);}function log(m){console.log(m);}</script></body></html>

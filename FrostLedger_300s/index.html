<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_LEDGER // 300S_LOCK</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--blue:#00e0ff;--green:#0f0;--pink:#ff69b4;--gold:#ffd700;--red:#f00;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;}h1{color:var(--gold);border-bottom:1px solid #333;padding-bottom:10px;margin:0;display:flex;justify-content:space-between;}#countdown{color:var(--red);font-size:18px;}#address-bar{background:#111;padding:10px;font-size:10px;color:var(--blue);border:1px solid #222;margin-top:10px;word-break:break-all;}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin:20px 0;}.stat-card{background:#0a0a0a;padding:15px;border:1px solid #222;border-top:3px solid var(--pink);}.val{font-size:18px;color:#fff;font-weight:bold;margin-top:5px;}.lbl{font-size:9px;color:#666;text-transform:uppercase;}table{width:100%;border-collapse:collapse;font-size:11px;}th{text-align:left;color:var(--blue);border-bottom:2px solid #222;padding:10px;}td{padding:10px;border-bottom:1px solid #111;}.tag{padding:2px 6px;border-radius:3px;font-size:9px;font-weight:bold;}</style></head><body onload="startLedger()"><h1><span>FROST_LEDGER // 300S_POW</span><span id="countdown">NEXT_BLOCK: 05:00</span></h1><div id="address-bar">MASTER_NODE: 4AEreXjDoq8AThWXzWz1Vu4nt7PNL6wPf6sWpsLFgR9b1srgqFDQTsvP6tCwQQ17NeAtMaRwZ5CymSSTqy8dSsZMEVV48Ab</div><div class="stat-grid"><div class="stat-card" style="border-top-color:var(--gold)"><div class="lbl">TOTAL_FTC</div><div id="tFtc" class="val">0.00</div></div><div class="stat-card" style="border-top-color:var(--blue)"><div class="lbl">TOTAL_FRST (PI)</div><div id="tFrst" class="val">0.00</div></div><div class="stat-card" style="border-top-color:var(--red)"><div class="lbl">TOTAL_FNR</div><div id=

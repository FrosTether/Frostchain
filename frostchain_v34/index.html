<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frostchain | v34 HDR</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --pink: #ff00ff; --cyan: #00ffff; --gold: #ffd700; --btc: #f7931a; --fota: #ff4500; }
        body { margin: 0; background: var(--bg); color: var(--term); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        
        /* HDR BLOOM OVERLAY */
        #gamma-overlay { position: fixed; inset: 0; z-index: 100; pointer-events: none; background: #fff; opacity: 0; display: none; }
        @keyframes strobe40 { 0% { opacity: 0; } 50% { opacity: 0.12; } 100% { opacity: 0; } }
        body.alpha-active.strobe-on #gamma-overlay { display: block; animation: strobe40 0.025s infinite; }

        /* DASHBOARD LAYOUT */
        #dash { display: grid; grid-template-columns: 320px 1fr 300px; height: 100vh; position: relative; }
        
        /* HDR CANVAS STYLING */
        #tangle-canvas { 
            position: fixed; inset: 0; z-index: 5; cursor: crosshair; 
            filter: contrast(1.8) brightness(1.1) drop-shadow(0 0 10px rgba(0,255,255,0.3));
        }

        .panel { background: rgba(5,5,5,0.96); border: 1px solid #222; z-index: 50; padding: 15px; overflow-y: auto; backdrop-filter: blur(12px); }
        .header { grid-column: 1 / -1; height: 60px; background: #000; border-bottom: 2px solid var(--fota); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 100; }
        
        .lbl { font-size: 0.65rem; color: #555; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .val-box { background: #000; border: 1px solid #222; padding: 12px; margin-bottom: 15px; border-left: 4px solid var(--term); }
        .val-text { font-size: 1.4rem; font-weight: bold; color: #fff; }

        /* CHAT BOX */
        #chat-log { flex: 1; background: rgba(0,0,0,0.85); border: 1px solid #222; overflow-y: auto; padding: 15px; margin-bottom: 110px; font-size: 0.75rem; z-index: 60; }
        .chat-input-bar { position: fixed; bottom: 20px; left: 340px; right: 320px; background: #000; border: 1px solid var(--fota); padding: 15px; display: flex; gap: 10px; z-index: 200; }
        .chat-input { flex: 1; background: transparent; border: none; color: #fff; font-family: inherit; outline: none; }
        
        .btn-audio { background: #0a0a0a; border: 1px solid #333; color: #444; padding: 15px; cursor: pointer; width: 100%; margin-bottom: 8px; font-weight: bold; font-size: 0.7rem; }
        .btn-audio.active { border-color: var(--pink); color: var(--pink); box-shadow: 0 0 15px var(--pink); }
    </style>
</head>
<body>

    <div id="gamma-overlay"></div>
    <canvas id="tangle-canvas"></canvas>

    <div id="dash">
        <div class="header">
            <div style="display:flex; align-items:center; gap:25px;">
                <span style="color:var(--fota); font-weight:bold;">NEWKIRK_HDR_SIGNAL</span>
                <span style="font-size:0.7rem; color:#444;">FOTA_STATUS: <span style="color:var(--term)">BROADCASTING</span></span>
            </div>
            <div style="text-align:right;">
                <div style="font-size:0.75rem; color:var(--cyan);">MINER_ID: <span id="miner-name">FROS-TETHER</span></div>
            </div>
        </div>

        <div class="panel">
            <div class="lbl">BTC REDIRECT (EH/s)</div>
            <div class="val-box" style="border-left-color: var(--btc);"><div class="val-text" id="btc-h">66.0</div></div>

            <div class="lbl">CONSENSUS TIMER</div>
            <div class="val-box" style="text-align:center;"><div class="val-text" id="timer">300</div></div>

            <div class="lbl">GAMMA AUDIO</div>
            <button id="btn-alpha" class="btn-audio" onclick="toggleAudio('alpha')">ALPHA [40Hz] ALZHEIMER'S</button>
            <button id="btn-delta" class="btn-audio" onclick="toggleAudio('delta')">DELTA [PI Hz] DEEP STATE</button>
        </div>

        <div style="display:flex; flex-direction:column; height:100%; position:relative;">
            <div id="chat-log"></div>
            <div class="chat-input-bar">
                <input type="text" id="chat-in" class="chat-input" placeholder="Broadcast to FOTA Network..." onkeydown="if(event.key==='Enter') transmit()">
                <button onclick="transmit()" style="background:var(--fota); border:none; padding:0 20px; color:#fff; font-weight:bold; cursor:pointer;">TX</button>
            </div>
        </div>

        <div class="panel">
            <div class="lbl">FRST TOKEN</div>
            <div class="val-box" style="border-left-color: var(--pink);"><div class="val-text" id="frst-v">0.00</div></div>
            <div class="lbl">FTC COIN</div>
            <div class="val-box" style="border-left-color: var(--gold);"><div class="val-text" id="ftc-v">0.00</div></div>
            <div class="lbl">FNR RESERVE</div>
            <div class="val-box" style="border-left-color: var(--cyan);"><div class="val-text" id="fnr-v">0.00</div></div>
            <div class="lbl">FETH (FEATHER)</div>
            <div class="val-box" style="border-left-color: var(--term);"><div class="val-text" id="feth-v">0.00</div></div>
        </div>
    </div>

    <script>
        let timeLeft = 300;
        let bal = { frst: 0, ftc: 0, fnr: 0, feth: 0 };
        let actx, oscL, oscR, isAlpha = false;

        setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if(timeLeft <= 0) { mint(); timeLeft = 300; }
        }, 1000);

        function mint() {
            bal.frst += 31415.90; bal.ftc += 13.37; bal.fnr += 2.50; bal.feth += 1000;
            document.getElementById('frst-v').innerText = bal.frst.toLocaleString();
            document.getElementById('ftc-v').innerText = bal.ftc.toFixed(2);
            document.getElementById('fnr-v').innerText = bal.fnr.toFixed(2);
            document.getElementById('feth-v').innerText = bal.feth.toLocaleString();
        }

        function transmit() {
            const input = document.getElementById('chat-in');
            const log = document.getElementById('chat-log');
            if(!input.value.trim()) return;
            const row = document.createElement('div');
            row.style.marginBottom = "10px";
            row.style.borderLeft = "2px solid var(--fota)";
            row.style.paddingLeft = "10px";
            row.innerHTML = `<div style="font-size:0.6rem; color:#555;">FOTA_BROADCAST</div><div style="color:#fff;">${input.value}</div>`;
            log.appendChild(row);
            input.value = "";
            log.scrollTop = log.scrollHeight;
        }

        const canvas = document.getElementById('tangle-canvas');
        canvas.addEventListener('mousedown', () => { if(isAlpha) document.body.classList.add('strobe-on'); });
        window.addEventListener('mouseup', () => { document.body.classList.remove('strobe-on'); });

        function toggleAudio(type) {
            if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if(oscL) { oscL.stop(); oscR.stop(); oscL = null; }
            document.body.classList.remove('alpha-active', 'strobe-on');
            isAlpha = (type === 'alpha');
            if(isAlpha) document.body.classList.add('alpha-active');
            document.querySelectorAll('.btn-audio').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+type).classList.add('active');

            const freq = isAlpha ? 40 : Math.PI;
            oscL = actx.createOscillator(); oscR = actx.createOscillator();
            const g = actx.createGain(); g.gain.value = 0.08;
            oscL.frequency.value = 432; oscR.frequency.value = 432 + freq;
            oscL.connect(g).connect(actx.destination);
            oscR.connect(g).connect(actx.destination);
            oscL.start(); oscR.start();
        }

        function initTangle() {
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let p = Array(60).fill().map(()=>({
                x:Math.random()*canvas.width, y:Math.random()*canvas.height, 
                vx:(Math.random()-.5)*1.5, vy:(Math.random()-.5)*1.5,
                clr: ["#00ff41", "#00ffff", "#ff00ff"][Math.floor(Math.random()*3)]
            }));
            function loop() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                p.forEach(n => {
                    n.x+=n.vx; n.y+=n.vy;
                    if(n.x<0||n.x>canvas.width)n.vx*=-1; if(n.y<0||n.y>canvas.height)n.vy*=-1;
                    p.forEach(n2 => {
                        let d = Math.hypot(n.x-n2.x, n.y-n2.y);
                        if(d < 180) {
                            // HDR Line Glow
                            ctx.strokeStyle = n.clr; ctx.globalAlpha = 1 - d/180;
                            ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(n2.x,n2.y); ctx.stroke();
                        }
                    });
                });
                requestAnimationFrame(loop);
            }
            loop();
        }
        initTangle();
    </script>
</body>
</html>

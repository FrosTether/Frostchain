<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miracle Node | Rez HD</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --cyan: #00ffff; --pink: #ff00ff; --panel: rgba(10, 10, 10, 0.9); }
        body { margin: 0; background: var(--bg); color: var(--term); font-family: 'Courier New', monospace; overflow: hidden; user-select: none; }
        
        /* GATE */
        #gate { position: fixed; inset: 0; z-index: 999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .gate-box { border: 2px solid var(--cyan); padding: 30px; width: 300px; text-align: center; box-shadow: 0 0 30px var(--cyan); background: #050505; }
        input { width: 90%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; margin-bottom: 10px; font-family: inherit; text-align: center; outline: none; }
        .btn-main { background: var(--cyan); color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }

        /* DASHBOARD */
        #dash { display: none; height: 100vh; grid-template-columns: 350px 1fr; grid-template-rows: 60px 1fr; position: relative; }
        #rez-canvas { position: absolute; inset: 0; z-index: 0; }

        /* HEADER */
        .header { grid-column: 1 / -1; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--pink); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10; backdrop-filter: blur(5px); }
        .master-key { font-size: 0.6rem; color: #fff; font-family: monospace; border: 1px solid var(--cyan); padding: 2px 8px; box-shadow: 0 0 10px var(--cyan); }
        .fs-btn { background: #000; border: 1px solid var(--pink); color: var(--pink); padding: 5px 10px; font-size: 0.7rem; cursor: pointer; font-weight: bold; }

        /* LEFT PANEL */
        .left-panel { background: rgba(0,0,0,0.7); border-right: 1px solid var(--cyan); display: flex; flex-direction: column; padding: 15px; z-index: 10; overflow-y: auto; }
        
        /* BCH BRIDGE */
        .bridge-card { background: rgba(0, 50, 0, 0.5); border: 1px solid var(--term); padding: 10px; margin-bottom: 15px; text-align: center; }
        .bridge-title { font-size: 0.7rem; color: var(--term); letter-spacing: 2px; margin-bottom: 5px; }
        .bridge-val { font-size: 1.5rem; font-weight: bold; color: #fff; text-shadow: 0 0 10px var(--term); }

        /* STATS */
        .stat-card { background: #0a0a0a; border: 1px solid #333; padding: 10px; margin-bottom: 5px; border-left: 3px solid #fff; }
        .block-list { flex: 1; border: 1px solid #333; margin-top: 10px; font-size: 0.7rem; overflow-y: auto; background: #000; }
        .block-row { padding: 5px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }

        /* CHAT & AUDIO */
        .chat-panel { display: flex; flex-direction: column; position: relative; z-index: 10; background: rgba(0,0,0,0.3); }
        .chat-log { flex: 1; overflow-y: auto; padding: 20px; text-shadow: 0 0 5px var(--cyan); }
        .msg-bubble { background: rgba(0,0,0,0.8); border: 1px solid var(--cyan); padding: 8px; display: inline-block; color: #fff; margin-bottom: 5px; }
        
        /* AUDIO DOCK */
        .audio-dock { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
        .audio-btn { background: #000; border: 1px solid #555; color: #888; padding: 8px 12px; font-size: 0.6rem; cursor: pointer; text-transform: uppercase; }
        .audio-btn.active { border-color: var(--pink); color: var(--pink); box-shadow: 0 0 10px var(--pink); }
        .mute-btn { border-color: #ff0000; color: #ff0000; }

        /* RESPONSIVE */
        @media (max-width: 700px) { #dash { grid-template-columns: 1fr; grid-template-rows: 50px 300px 1fr; } .left-panel { border-right: none; border-bottom: 1px solid var(--cyan); } }
    </style>
</head>
<body>

    <canvas id="rez-canvas"></canvas>

    <div id="gate">
        <div class="gate-box">
            <div style="font-size:1.5rem; font-weight:bold; margin-bottom:5px; color:#fff;">MIRACLE NODE</div>
            <div style="font-size:0.8rem; color:var(--cyan); margin-bottom:20px;">REZ HD ENGINE LOADED</div>
            <input type="text" id="id-in" placeholder="identity.frostchain">
            <input type="password" id="pin-in" placeholder="PIN (4-6 Digits)" maxlength="6">
            <button class="btn-main" onclick="login()">ENTER SYSTEM</button>
            <div id="err" style="color:#ff0055; font-size:0.7rem; margin-top:10px;"></div>
        </div>
    </div>

    <div id="dash">
        <div class="header">
            <div>
                <span id="user-display" style="font-weight:bold;">GUEST</span>
                <span style="font-size:0.7rem; color:var(--cyan); margin-left:10px;">● LINKED</span>
            </div>
            <div style="display:flex; align-items:center;">
                <div class="master-key">BCH BRIDGE ACTIVE</div>
                <button class="fs-btn" onclick="toggleFS()">[ FULLSCREEN ]</button>
            </div>
        </div>

        <div class="left-panel">
            <div class="bridge-card">
                <div class="bridge-title">INCOMING BCH HASHPOWER</div>
                <div class="bridge-val" id="hashrate">420.0 PH/s</div>
                <div style="font-size:0.6rem; color:#888;">TARGET: Newkirk_Pool_01</div>
            </div>

            <div class="stat-card" style="border-left-color: #ff00ff;">
                <div style="font-weight:bold; font-size:1.1rem;" id="frst-val">0.00</div>
                <div style="font-size:0.7rem;">FRST (Frostcoin)</div>
            </div>
            <div class="stat-card" style="border-left-color: gold;">
                <div style="font-weight:bold; font-size:1.1rem;" id="ftc-val">0.00</div>
                <div style="font-size:0.7rem;">FTC (Frost Token)</div>
            </div>
            
            <div style="margin-top:10px; font-size:0.7rem; color:var(--cyan);">REZ TANGLE EXPLORER</div>
            <div class="block-list" id="block-list"></div>
        </div>

        <div class="chat-panel">
            <div class="audio-dock">
                <button class="audio-btn" id="btn-pink" onclick="toggleAudio('pink')">PINK NOISE</button>
                <button class="audio-btn" id="btn-alpha" onclick="toggleAudio('alpha')">ALPHA</button>
                <button class="audio-btn" id="btn-delta" onclick="toggleAudio('delta')">DELTA</button>
                <button class="audio-btn mute-btn" onclick="muteAll()">MUTE ALL</button>
            </div>
            <div class="chat-log" id="chat-box">
                <div class="msg-bubble">> System: REZ HD Visuals Initialized.</div>
                <div class="msg-bubble">> System: BCH Miners Redirected to Local Node.</div>
            </div>
        </div>
    </div>

    <script>
        // --- AUTH ---
        function login() {
            const id = document.getElementById('id-in').value;
            const pin = document.getElementById('pin-in').value;
            if(id.includes('.frostchain') && pin.length >= 4) {
                document.getElementById('gate').style.display = 'none';
                document.getElementById('dash').style.display = 'grid';
                document.getElementById('user-display').innerText = id;
                initRez(); // Start Visuals
                startMining();
            } else {
                document.getElementById('err').innerText = "INVALID CREDENTIALS";
            }
        }

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        // --- AUDIO ENGINE ---
        let actx, pinkNode, osc;
        
        function initAudio() {
            if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if(actx.state === 'suspended') actx.resume();
        }

        function muteAll() {
            if(actx) actx.suspend();
            document.querySelectorAll('.audio-btn').forEach(b => b.classList.remove('active'));
        }

        function toggleAudio(type) {
            initAudio();
            actx.resume(); // Ensure we are running

            // Clear existing
            if(pinkNode) { pinkNode.stop(); pinkNode = null; }
            if(osc) { osc.stop(); osc = null; }
            document.querySelectorAll('.audio-btn').forEach(b => b.classList.remove('active'));

            if(type === 'pink') {
                // Pink Noise Generator
                const bufferSize = 4096;
                const b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                const node = actx.createScriptProcessor(bufferSize, 1, 1);
                node.onaudioprocess = function(e) {
                    const output = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        const white = Math.random() * 2 - 1;
                        output[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = output[i];
                        output[i] *= 3.5; 
                    }
                };
                // Easier Buffer Implementation for Stability
                const buffer = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
                const data = buffer.getChannelData(0);
                for(let i=0; i<data.length; i++) {
                     const white = Math.random() * 2 - 1;
                     data[i] = (lastOut + (0.02 * white)) / 1.02;
                     lastOut = data[i];
                     data[i] *= 3.5; 
                }
                
                pinkNode = actx.createBufferSource();
                pinkNode.buffer = buffer;
                pinkNode.loop = true;
                const gain = actx.createGain();
                gain.gain.value = 0.15;
                pinkNode.connect(gain).connect(actx.destination);
                pinkNode.start();
                
                document.getElementById('btn-pink').classList.add('active');
            } 
            else if (type === 'alpha' || type === 'delta') {
                // Binaural Beat
                const freq = type === 'alpha' ? 11.11 : 3.14;
                osc = actx.createOscillator();
                const g = actx.createGain();
                g.gain.value = 0.1;
                osc.connect(g).connect(actx.destination);
                osc.frequency.value = 432;
                osc.start();
                osc.stop = () => { osc.disconnect(); };
                document.getElementById('btn-'+type).classList.add('active');
            }
        }
        let lastOut = 0;

        // --- REZ HD VISUALS ---
        function initRez() {
            const c = document.getElementById('rez-canvas');
            const ctx = c.getContext('2d');
            c.width = window.innerWidth; c.height = window.innerHeight;

            let nodes = [];
            // Create Grid Nodes
            for(let i=0; i<40; i++) {
                nodes.push({
                    x: Math.random() * c.width,
                    y: Math.random() * c.height,
                    z: Math.random() * 2, // Depth
                    vx: (Math.random()-0.5),
                    vy: (Math.random()-0.5)
                });
            }

            function draw() {
                // Trail Effect
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.fillRect(0,0,c.width,c.height);

                const time = Date.now() * 0.002;
                const pulse = (Math.sin(time) + 1) / 2; // 0 to 1

                nodes.forEach(n => {
                    n.x += n.vx; n.y += n.vy;
                    if(n.x<0||n.x>c.width) n.vx*=-1;
                    if(n.y<0||n.y>c.height) n.vy*=-1;

                    // Draw Node (Diamond shape for Rez style)
                    ctx.fillStyle = n.z > 1 ? '#00ffff' : '#ff00ff';
                    ctx.beginPath();
                    const size = 2 + (pulse * 2);
                    ctx.moveTo(n.x, n.y-size);
                    ctx.lineTo(n.x+size, n.y);
                    ctx.lineTo(n.x, n.y+size);
                    ctx.lineTo(n.x-size, n.y);
                    ctx.fill();

                    // Connections
                    nodes.forEach(n2 => {
                        const d = Math.hypot(n.x-n2.x, n.y-n2.y);
                        if(d < 150) {
                            ctx.strokeStyle = n.z > 1 ? `rgba(0,255,255,${1-d/150})` : `rgba(255,0,255,${1-d/150})`;
                            ctx.lineWidth = 0.5 + (pulse * 0.5);
                            ctx.beginPath();
                            ctx.moveTo(n.x, n.y);
                            ctx.lineTo(n2.x, n2.y);
                            ctx.stroke();
                        }
                    });
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        // --- MINING & BRIDGE ---
        let bal = {frst:0, ftc:0};
        function startMining() {
            setInterval(() => {
                bal.frst += 314.15;
                bal.ftc += 0.13;
                document.getElementById('frst-val').innerText = bal.frst.toLocaleString();
                document.getElementById('ftc-val').innerText = bal.ftc.toFixed(2);
                
                // BCH Hashrate Pulse
                const hash = 420 + (Math.random() * 10);
                document.getElementById('hashrate').innerText = hash.toFixed(1) + " PH/s";
            }, 1000);

            // Explorer
            let count = 800000;
            setInterval(() => {
                count++;
                const list = document.getElementById('block-list');
                const row = document.createElement('div');
                row.className = 'block-row';
                row.innerHTML = `
                    <span style="color:#00ffff">#${count}</span>
                    <span style="color:#888">BCH-BRIDGE</span>
                    <span style="color:#ff00ff">+13.37 FTC</span>
                `;
                list.prepend(row);
                if(list.children.length > 15) list.removeChild(list.lastChild);
            }, 2500);
        }
    </script>
</body>
</html>

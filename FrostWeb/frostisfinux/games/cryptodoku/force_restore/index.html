<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cryptodoku // FNR AUTOMATIC</title>
<style>
    :root { --orange: #f59e0b; --dark: #0f0f10; --grid: #1a1a1a; }
    body { background: #000; color: #fbbf24; font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; touch-action: none; display: flex; flex-direction: column; height: 100vh; }
    
    /* --- HEADER (From Photo) --- */
    .header { display: flex; justify-content: space-between; padding: 10px 15px; background: #050505; border-bottom: 1px solid #333; font-size: 14px; }
    .hash-stat { color: #f97316; font-weight: bold; }
    .chain-id { color: #facc15; }

    /* --- GAME AREA --- */
    .game-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    
    /* 9x9 Grid */
    .grid-board { 
        display: grid; grid-template-columns: repeat(9, 1fr); 
        width: 90vw; max-width: 360px; aspect-ratio: 1/1; 
        gap: 2px; background: #222; border: 2px solid #444; padding: 4px;
    }
    .cell { background: #111; position: relative; }
    .cell.filled { background: var(--orange); box-shadow: inset 0 0 5px #000; border: 1px solid #d97706; }
    .cell.preview { background: rgba(245, 158, 11, 0.3); }

    /* Piece Dock */
    .dock { height: 120px; width: 100%; display: flex; justify-content: space-around; align-items: center; background: #050505; border-top: 1px solid #333; }
    .piece-box { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
    
    /* Piece Visuals */
    .piece-shape { display: grid; gap: 1px; pointer-events: none; }
    .p-block { width: 18px; height: 18px; background: var(--orange); border: 1px solid #000; }

    /* --- MINER LOGS (Bottom Overlay) --- */
    .miner-hud { position: absolute; bottom: 130px; left: 10px; width: 200px; font-size: 10px; pointer-events: none; opacity: 0.8; text-shadow: 0 1px 2px #000; }
    .log-line { margin-bottom: 2px; color: #facc15; }
    .log-line span { color: #fff; }

    /* --- FOOTER CONTROLS --- */
    .footer { padding: 10px; display: flex; justify-content: space-between; align-items: center; background: #000; font-size: 12px; border-top: 1px solid #222; }
    .status-badge { background: #064e3b; color: #34d399; padding: 2px 6px; border-radius: 4px; }
    .burn-btn { background: #f59e0b; color: #000; border: none; padding: 8px 20px; font-weight: bold; cursor: pointer; }

    /* Drag Ghost */
    .ghost { position: fixed; pointer-events: none; opacity: 0.8; transform: scale(1.2); z-index: 999; }
</style>
</head>
<body>

<div class="header">
    <div class="hash-stat" id="hashrate">869.5 H/s</div>
    <div id="score">SCORE: 0</div>
    <div class="chain-id">FTC 256A</div>
</div>

<div class="game-stage">
    <div class="grid-board" id="board"></div>
    
    <div class="miner-hud" id="logs">
        <div class="log-line">>> FNR LINK ESTABLISHED</div>
    </div>
</div>

<div class="dock" id="dock"></div>

<div class="footer">
    <div class="status-badge">FNR AUTOMATIC</div>
    <div>FAI GHOST</div>
    <button class="burn-btn" onclick="burn()">BURN BLOCK</button>
</div>

<script>
/* --- GAME ENGINE --- */
const SIZE = 9;
let grid = Array(SIZE * SIZE).fill(0);
let score = 0;
let pieces = [];

// Shapes Definition
const SHAPES = [
    { w:1, h:1, m:[1] }, // Single
    { w:2, h:1, m:[1,1] }, // 2-Line H
    { w:1, h:2, m:[1,1] }, // 2-Line V
    { w:3, h:1, m:[1,1,1] }, // 3-Line H
    { w:1, h:3, m:[1,1,1] }, // 3-Line V
    { w:2, h:2, m:[1,1,1,1] }, // Square
    { w:2, h:2, m:[1,0,1,1] }, // L-Shape
    { w:3, h:2, m:[0,1,0,1,1,1] } // T-Shape
];

function init() {
    renderGrid();
    spawnPieces();
    minerLoop();
}

function renderGrid() {
    const el = document.getElementById('board');
    el.innerHTML = '';
    grid.forEach((val, i) => {
        const d = document.createElement('div');
        d.className = 'cell' + (val ? ' filled' : '');
        d.dataset.idx = i;
        el.appendChild(d);
    });
    document.getElementById('score').innerText = `SCORE: ${score}`;
}

function spawnPieces() {
    const dock = document.getElementById('dock');
    dock.innerHTML = '';
    pieces = [];
    
    for(let i=0; i<3; i++) {
        const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        pieces.push({ shape: shape, used: false, id: i });
        
        const box = document.createElement('div');
        box.className = 'piece-box';
        
        // Draw Shape
        const vis = document.createElement('div');
        vis.className = 'piece-shape';
        vis.style.gridTemplateColumns = `repeat(${shape.w}, 18px)`;
        
        shape.m.forEach(bit => {
            const b = document.createElement('div');
            if(bit) b.className = 'p-block';
            else b.style.background = 'transparent'; // Spacer
            vis.appendChild(b);
        });
        
        // Touch Handlers
        box.ontouchstart = (e) => startDrag(e, i, shape);
        box.onmousedown = (e) => startDrag(e, i, shape);
        
        box.appendChild(vis);
        dock.appendChild(box);
    }
}

/* --- DRAG & DROP LOGIC --- */
let dragObj = null;

function startDrag(e, idx, shape) {
    e.preventDefault();
    if(pieces[idx].used) return;
    
    const touch = e.touches ? e.touches[0] : e;
    
    // Create Ghost
    const ghost = document.createElement('div');
    ghost.className = 'piece-shape ghost';
    ghost.style.gridTemplateColumns = `repeat(${shape.w}, 18px)`;
    ghost.innerHTML = e.target.closest('.piece-box').querySelector('.piece-shape').innerHTML;
    document.body.appendChild(ghost);
    
    dragObj = { idx, shape, ghost, el: ghost };
    moveDrag(e);
    
    document.addEventListener('touchmove', moveDrag, {passive: false});
    document.addEventListener('mousemove', moveDrag);
    document.addEventListener('touchend', endDrag);
    document.addEventListener('mouseup', endDrag);
}

function moveDrag(e) {
    if(!dragObj) return;
    const t = e.touches ? e.touches[0] : e;
    dragObj.el.style.left = (t.clientX - 20) + 'px';
    dragObj.el.style.top = (t.clientY - 20) + 'px';
}

function endDrag(e) {
    if(!dragObj) return;
    const t = e.changedTouches ? e.changedTouches[0] : e;
    
    // Check Drop
    const board = document.getElementById('board');
    const rect = board.getBoundingClientRect();
    
    // Simple Hit Test (Top-Left of piece to grid)
    const rX = t.clientX - rect.left;
    const rY = t.clientY - rect.top;
    
    const col = Math.floor(rX / (rect.width / 9));
    const row = Math.floor(rY / (rect.height / 9));
    
    if(col >= 0 && col < 9 && row >= 0 && row < 9) {
        if(tryPlace(dragObj.shape, row, col)) {
            // Success
            pieces[dragObj.idx].used = true;
            document.getElementById('dock').children[dragObj.idx].style.opacity = 0.2;
            
            // Generate new if all used
            if(pieces.every(p => p.used)) setTimeout(spawnPieces, 500);
        }
    }
    
    dragObj.el.remove();
    dragObj = null;
    document.removeEventListener('touchmove', moveDrag);
    document.removeEventListener('mousemove', moveDrag);
    document.removeEventListener('touchend', endDrag);
    document.removeEventListener('mouseup', endDrag);
}

function tryPlace(shape, r, c) {
    // Check bounds & collision
    let indices = [];
    let idx = 0;
    
    for(let i=0; i<shape.m.length; i++) {
        if(!shape.m[i]) { idx++; continue; } // Skip empty blocks in shape
        
        // Calculate grid pos based on width
        const dr = Math.floor(i / shape.w);
        const dc = i % shape.w;
        
        const nr = r + dr;
        const nc = c + dc;
        
        if(nr >= 9 || nc >= 9) return false;
        
        const gridIdx = nr * 9 + nc;
        if(grid[gridIdx]) return false;
        
        indices.push(gridIdx);
    }
    
    // Place
    indices.forEach(i => grid[i] = 1);
    score += 10;
    checkLines();
    renderGrid();
    log(`> BLOCKS SEALED @ ${r},${c}`);
    return true;
}

function checkLines() {
    // Simplified logic for row/col clearing
    // (Real logic needs rigorous checking, placeholder for speed)
}

/* --- MINER SIMULATION --- */
function minerLoop() {
    const logs = document.getElementById('logs');
    const rate = document.getElementById('hashrate');
    
    setInterval(() => {
        rate.innerText = (800 + Math.random() * 150).toFixed(1) + " H/s";
        
        if(Math.random() > 0.7) {
            const l = document.createElement('div');
            l.className = 'log-line';
            l.innerHTML = `256-LINK SEALING BLOCK <span>${Math.random().toString(16).substr(2,6)}</span>`;
            logs.appendChild(l);
            if(logs.children.length > 5) logs.firstChild.remove();
        }
    }, 1000);
}

function log(msg) {
    const l = document.createElement('div');
    l.className = 'log-line';
    l.innerText = msg;
    document.getElementById('logs').appendChild(l);
}

function burn() {
    alert("BLOCK BURNED. REWARD: 6.685 FTC");
    grid = Array(81).fill(0);
    renderGrid();
}

init();
</script>
</body>
</html>

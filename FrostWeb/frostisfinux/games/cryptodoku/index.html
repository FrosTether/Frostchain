<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cryptodoku // FNR v2.1.5</title>
<style>
    body { background: #050505; color: #38bdf8; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow: hidden; }
    
    /* Boot Overlay */
    #boot-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
    #boot-btn { padding: 15px 30px; border: 2px solid #38bdf8; background: transparent; color: #38bdf8; font-size: 18px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
    #boot-btn:hover { background: #38bdf8; color: #000; box-shadow: 0 0 20px #38bdf8; }
    
    /* Layout */
    .container { display: grid; grid-template-columns: 3fr 1fr; height: 100vh; }
    .game-zone { padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .miner-zone { background: #020617; border-left: 1px solid #1e293b; padding: 10px; font-size: 12px; text-align: left; color: #94a3b8; font-family: monospace; overflow: hidden; position: relative; }
    
    /* Grid Styling */
    h1 { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); margin-bottom: 5px; }
    .version { font-size: 0.8em; color: #334155; margin-bottom: 20px; }
    
    table { border-collapse: collapse; margin: 20px 0; border: 3px solid #7dd3fc; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
    td { width: 40px; height: 40px; border: 1px solid #1e293b; padding: 0; }
    td input { width: 100%; height: 100%; background: transparent; border: none; color: #e2e8f0; text-align: center; font-size: 18px; font-family: monospace; outline:none; }
    td input:focus { background: rgba(56, 189, 248, 0.2); }
    
    /* Thick borders */
    td:nth-child(3n) { border-right: 2px solid #7dd3fc; }
    tr:nth-child(3n) td { border-bottom: 2px solid #7dd3fc; }
    td:last-child { border-right: none; } 
    tr:last-child td { border-bottom: none; }

    /* Miner Logs */
    .log-entry { margin: 2px 0; white-space: nowrap; font-family: 'Consolas', monospace; }
    .hash { color: #22c55e; }
    .hum-indicator { position: absolute; bottom: 10px; right: 10px; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    
    button.submit-btn { margin-top:20px; padding:10px 20px; background:#38bdf8; border:none; font-weight:bold; cursor:pointer; }
    button.submit-btn:hover { background:#7dd3fc; box-shadow: 0 0 15px #38bdf8; }
</style>
</head>
<body>

<div id="boot-overlay">
    <h1 style="color:#fff">FNR BOOTLOADER</h1>
    <p>v2.1.5 // FROST CHAIN</p>
    <button id="boot-btn" onclick="startSystem()">INITIALIZE SYSTEM</button>
</div>

<div class="container">
    <div class="game-zone">
        <h1>🧩 Cryptodoku Network</h1>
        <div class="version">Build v2.1.5 (Stable)</div>
        <div id="grid-container"></div>
        <button class="submit-btn" onclick="checkGrid()">SUBMIT BLOCK</button>
    </div>
    
    <div class="miner-zone" id="miner-log">
        <div style="border-bottom:1px solid #333; padding-bottom:5px; margin-bottom:5px;">
            <strong>FNR AUTO-MINER</strong><br>
            STATUS: <span style="color:#22c55e">RUNNING</span><br>
            HASHRATE: <span id="hashrate">0</span> H/s
        </div>
        <div id="logs"></div>
        <div class="hum-indicator" title="Miner Active"></div>
    </div>
</div>

<script>
// --- 1. AUDIO ENGINE (The Hum) ---
let audioCtx, osc, gainNode;

function startSystem() {
    document.getElementById("boot-overlay").style.display = 'none';
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    // Oscillator for the "hum"
    osc = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();

    osc.type = 'sawtooth'; 
    osc.frequency.setValueAtTime(55, audioCtx.currentTime); // 55Hz Low Hum
    
    // Low Pass Filter (Muffles it)
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(140, audioCtx.currentTime);

    osc.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    // Volume
    gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
    osc.start();
    
    initMiner();
    initGame();
}

// --- 2. MINER VISUALS ---
function initMiner() {
    const logs = document.getElementById("logs");
    const rate = document.getElementById("hashrate");
    
    setInterval(() => {
        // Random Hex String
        const h = Array.from({length: 12}, () => Math.floor(Math.random()*16).toString(16)).join('');
        const div = document.createElement("div");
        div.className = "log-entry";
        div.innerHTML = `> Block <span class="hash">0x${h}...</span> accepted`;
        logs.prepend(div);
        
        // Keep DOM light
        if(logs.children.length > 25) logs.lastChild.remove();
        
        // Jitter the hashrate around 215
        rate.innerText = (215 + Math.random() * 10 - 5).toFixed(1);
    }, 600);
}

// --- 3. GAME LOGIC ---
function initGame() {
    const container = document.getElementById("grid-container");
    const table = document.createElement("table");
    
    for(let r=0; r<9; r++){
        const tr = document.createElement("tr");
        for(let c=0; c<9; c++){
            const td = document.createElement("td");
            const inp = document.createElement("input");
            inp.maxLength = 1;
            inp.oninput = function() { this.value = this.value.replace(/[^0-9a-fA-F]/g, '').toUpperCase(); };
            td.appendChild(inp);
            tr.appendChild(td);
        }
        table.appendChild(tr);
    }
    container.appendChild(table);
}

function checkGrid() {
    alert("Block Submitted to Frost Chain v2.1.5");
}
</script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_ENTROPY_ENGINE</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#000;--term-green:#0f0;--term-red:#f00;--term-gold:#ffd700;--term-blue:#00e0ff;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;overflow:hidden;}h1{color:var(--term-red);text-shadow:0 0 10px var(--term-red);border-bottom:1px solid #333;padding-bottom:10px;}canvas{width:100%;height:100px;background:#111;border:1px solid #333;margin-top:20px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;}.card{border:1px solid #333;padding:20px;background:rgba(20,20,20,0.9);}.val{font-size:24px;color:#fff;font-weight:bold;margin-top:10px;}.label{font-size:10px;color:#888;}#log{height:150px;overflow-y:auto;border:1px solid #333;padding:10px;margin-top:20px;font-size:10px;color:var(--term-green);font-family:monospace;}button{width:100%;padding:20px;background:var(--term-red);color:#fff;border:none;font-size:18px;font-weight:bold;cursor:pointer;margin-top:20px;font-family:inherit;animation:pulse 2s infinite;}@keyframes pulse{0%{opacity:1;}50%{opacity:0.8;}100%{opacity:1;}}</style></head><body><h1>FROST_MINER // AUDIO_ENTROPY</h1><div style="color:#555;font-size:12px;">STATUS: <span id="status" style="color:var(--term-red)">SILENT (CLICK TO ENGAGE)</span></div><canvas id="scope"></canvas><div class="grid"><div class="card" style="border-top:2px solid var(--term-blue);"><div class="label">LEFT_EAR (SOLFEGGIO)</div><div class="val" id="l_freq">OFF</div></div><div class="card" style="border-top:2px solid var(--term-gold);"><div class="label">RIGHT_EAR (IRRATIONAL)</div><div class="val" id="r_freq">OFF</div></div></div><div class="card" style="margin-top:20px;border-top:2px solid var(--term-green);"><div class="label">GENERATED_ENTROPY (RING_SIGNATURE)</div><div class="val" id="seed" style="font-size:12px;word-break:break-all;color:var(--term-green)">WAITING_FOR_SOUND...</div></div><div id="log"></div><button id="btn" onclick="engage()">[ CLICK TO INITIATE ENTROPY ]</button><script>let ctx,analyser,dataArray,canvas,cCtx,oscL,oscR,panL,panR;let solf=[963,741,639,528,417,396,285,174];function engage(){if(!ctx){ctx=new AudioContext();analyser=ctx.createAnalyser();analyser.fftSize=2048;dataArray=new Uint8Array(analyser.frequencyBinCount);canvas=document.getElementById("scope");cCtx=canvas.getContext("2d");draw();document.getElementById("btn").style.display="none";document.getElementById("status").innerText="AUDIO_ACTIVE";document.getElementById("status").style.color="#0f0";panL=ctx.createStereoPanner();panL.pan.value=-1;panL.connect(analyser);analyser.connect(ctx.destination);panR=ctx.createStereoPanner();panR.pan.value=1;panR.connect(analyser);startCycle();log("> AUDIO_CONTEXT_UNLOCKED.");log("> ENTROPY_ENGINE_STARTED.");}else if(ctx.state==="suspended"){ctx.resume();}}function startCycle(){setInterval(()=>{let fL=solf[Math.floor(Math.random()*solf.length)];let fR=(Math.random()>0.5)?11.11:3.14159;play(fL,fR);genEntropy(fL,fR);},4000);play(963,11.11);}function play(l,r){if(oscL)oscL.stop();if(oscR)oscR.stop();oscL=ctx.createOscillator();oscL.frequency.value=l;oscL.connect(panL);oscL.start();oscR=ctx.createOscillator();oscR.frequency.value=r;oscR.connect(panR);oscR.start();document.getElementById("l_freq").innerText=l+" Hz";document.getElementById("r_freq").innerText=r+" Hz";log("> CYCLE: L="+l+"Hz | R="+r+"Hz");}function genEntropy(l,r){let s="xmr_"+(l*r*Date.now()).toString(16);document.getElementById("seed").innerText=s;log("> SEED_HARVESTED: "+s.substring(0,20)+"...");}function draw(){requestAnimationFrame(draw);analyser.getByteTimeDomainData(dataArray);cCtx.fillStyle="#000";cCtx.fillRect(0,0,canvas.width,canvas.height);cCtx.lineWidth=2;cCtx.strokeStyle="#0f0";cCtx.beginPath();let sliceWidth=canvas.width*1.0/analyser.fftSize;let x=0;for(let i=0;i<analyser.fftSize;i++){let v=dataArray[i]/128.0;let y=v*canvas.height/2;if(i===0)cCtx.moveTo(x,y);else cCtx.lineTo(x,y);x+=sliceWidth;}cCtx.lineTo(canvas.width,canvas.height/2);cCtx.stroke();}function log(m){let d=document.createElement("div");d.innerText=m;document.getElementById("log").prepend(d);}</script></body></html>

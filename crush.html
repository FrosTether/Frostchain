<!DOCTYPE html><html><head><title>FNR | Monero Fork</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="theme.css">
<script src="ledger.js"></script>
<style>
    body { transition: background 0.5s; background: #050010; }
    .encrypt-flash { background: #2a003e !important; }
    #c { border: 2px solid #ff00ff; box-shadow: 0 0 40px rgba(255,0,255,0.2); }
    .emission-tag { font-size: 9px; color: #ff00ff; margin-top: 5px; opacity: 0.8; }
</style></head>
<body onload="Game.init()">
    <div class="hud" style="border-bottom: 2px solid #ff00ff;">
        <div>💎 FNR: <span id="fnr">0</span></div>
        <div style="text-align:right;">
            <div style="color:#ff00ff; font-weight:bold;">963 Hz LINKED</div>
            <div class="emission-tag">CURVE: CRYPTONOTE_SMOOTH</div>
        </div>
    </div>
    <div style="flex:1; display:flex; justify-content:center; align-items:center;">
        <canvas id="c" class="mirror"></canvas>
    </div>
    <script>
    const COLS = ["#afeeee", "#ffd700", "#ffffff", "#ff00ff", "#34fa99"];
    const Game = {
        grid: [], sz:0, selected:null,
        init() {
            this.l = Ledger.init(); this.cvs = document.getElementById('c'); this.ctx = this.cvs.getContext('2d');
            this.resize(); this.fill(); this.loop();
            this.cvs.onpointerdown = e => this.click(e);
            this.update();
        },
        resize() { let s=Math.min(window.innerWidth-30, 380); this.cvs.width=s; this.cvs.height=s; this.sz=s/8; },
        fill() { for(let i=0; i<64; i++) this.grid.push({c:Math.floor(Math.random()*5), y:0}); },
        click(e) {
            let r=this.cvs.getBoundingClientRect();
            let x=Math.floor((e.clientX-r.left)/this.sz), y=Math.floor((e.clientY-r.top)/this.sz);
            let i=y*8+x;
            if(this.selected===null) this.selected=i;
            else { if(this.isAdj(this.selected, i)) this.swap(this.selected, i); this.selected=null; }
        },
        isAdj(a,b) { return (Math.abs(a%8-b%8) + Math.abs(Math.floor(a/8)-Math.floor(b/8))) === 1; },
        swap(a,b) {
            let t=this.grid[a].c; this.grid[a].c=this.grid[b].c; this.grid[b].c=t;
            setTimeout(() => { if(!this.check()) { let t=this.grid[a].c; this.grid[a].c=this.grid[b].c; this.grid[b].c=t; } }, 200);
        },
        check() {
            let m=[];
            for(let y=0; y<8; y++) for(let x=0; x<6; x++) { let i=y*8+x; if(this.grid[i].c===this.grid[i+1].c && this.grid[i].c===this.grid[i+2].c) m.push(i,i+1,i+2); }
            for(let x=0; x<8; x++) for(let y=0; y<6; y++) { let i=y*8+x; if(this.grid[i].c===this.grid[i+8].c && this.grid[i].c===this.grid[i+16].c) m.push(i,i+8,i+16); }
            if(m.length>0) {
                Ledger.sfx('encrypt');
                document.body.classList.add('encrypt-flash');
                setTimeout(()=>document.body.classList.remove('encrypt-flash'), 400);
                
                [...new Set(m)].forEach(i => this.grid[i].c = -1);
                
                // --- MONERO FORK LOGIC ---
                // Calculate Reward based on Smooth Decay
                let baseReward = Ledger.getFNRReward(this.l.fnr);
                let payout = baseReward * m.length; 
                
                this.l.fnr += payout;
                // -------------------------
                
                Ledger.save(this.l); this.update();
                setTimeout(()=>this.drop(), 300); return true;
            } return false;
        },
        drop() {
            for(let x=0; x<8; x++) for(let y=7; y>=0; y--) {
                if(this.grid[y*8+x].c===-1) {
                    for(let k=y-1; k>=0; k--) if(this.grid[k*8+x].c!==-1) { this.grid[y*8+x].c=this.grid[k*8+x].c; this.grid[k*8+x].c=-1; break; }
                    if(this.grid[y*8+x].c===-1) this.grid[y*8+x].c=Math.floor(Math.random()*5);
                }
            }
            this.check();
        },
        loop() {
            this.ctx.clearRect(0,0,this.cvs.width,this.cvs.height);
            this.grid.forEach((b,i)=>{
                if(b.c!==-1) {
                    let x=(i%8)*this.sz, y=Math.floor(i/8)*this.sz;
                    this.ctx.fillStyle=COLS[b.c]; this.ctx.beginPath(); this.ctx.roundRect(x+4,y+4,this.sz-8,this.sz-8,8); this.ctx.fill();
                }
            });
            requestAnimationFrame(()=>this.loop());
        },
        update() { document.getElementById('fnr').innerText = this.l.fnr.toFixed(5); }
    };
    </script>
</body></html>

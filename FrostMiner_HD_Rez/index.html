<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_MINER // IOTA_REZ_HD</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#000;--iota:#00e0ff;--pink:#ff69b4;--gold:#ffd700;--green:#0f0;--red:#f00;}body,html{margin:0;padding:0;width:100%;height:100%;background:var(--bg);font-family:"Share Tech Mono",monospace;color:#ccc;overflow:hidden;}canvas{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0;z-index:1;}#hud{position:fixed;top:20px;left:20px;z-index:10;background:rgba(0,0,0,0.85);padding:20px;border-left:4px solid var(--iota);pointer-events:none;width:350px;}#entropy{position:fixed;bottom:20px;left:20px;z-index:10;font-size:10px;color:var(--green);max-width:400px;word-break:break-all;}.stat{margin-bottom:10px;}.lbl{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px;}.val{font-size:22px;color:#fff;font-weight:bold;}#btn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;padding:30px;background:var(--iota);color:#000;border:none;font-weight:bold;font-size:20px;cursor:pointer;box-shadow:0 0 50px rgba(0,224,255,0.5);}</style></head><body><button id="btn" onclick="engage()">[ INITIATE_HD_REZ_MINER ]</button><div id="hud"><div style="color:var(--iota);font-size:10px;margin-bottom:15px;">FROST_MINER // MN_4AEreXj...</div><div class="stat"><div class="lbl">FTC_MINTED (CONSTANT)</div><div id="ftc" class="val">0.00</div></div><div class="stat"><div class="lbl">FRST_MINTED (PI_DOGE)</div><div id="frst" class="val" style="color:var(--pink)">0.00</div></div><div class="stat"><div class="lbl">FNR_MINTED (XMR_FORK)</div><div id="fnr" class="val" style="color:var(--gold)">0.00</div></div><hr style="border:0;border-top:1px solid #333;margin:15px 0;"><div style="display:flex;justify-content:space-between;font-size:12px;"><span id="timer" style="color:var(--red)">SYNCING_300S...</span><span id="diff" style="color:var(--green)">DIFF: 1.337</span></div></div><div id="entropy">AWAITING_COLLISION...</div><script>let ctx,nodes=[],t=300,ftc=0,frst=0,fnr=0,wakeLock=null;async function engage(){document.getElementById("btn").style.display="none";try{wakeLock=await navigator.wakeLock.request("screen");}catch(e){}ctx=new AudioContext();createAudio();initTangle();setInterval(tick,1000);loop();}function createAudio(){let b=ctx.createScriptProcessor(4096,1,1);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;b.onaudioprocess=e=>{let out=e.outputBuffer.getChannelData(0);for(let i=0;i<4096;i++){let w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;out[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.07;b6=w*0.115926;}};b.connect(ctx.destination);[432,7.83,40].forEach(f=>{let o=ctx.createOscillator();let g=ctx.createGain();o.frequency.value=f;g.gain.value=0.03;o.connect(g);g.connect(ctx.destination);o.start();});}function initTangle(){let c=document.createElement("canvas");document.body.appendChild(c);let cc=c.getContext("2d");window.onresize=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};window.onresize();for(let i=0;i<82;i++)nodes.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*2.5,vy:(Math.random()-0.5)*2.5});window.cc=cc;window.canvas=c;}function tick(){t--;if(t<0){t=300;ftc+=13.37;frst+=31415.9;fnr+=1.542;updateHUD();}document.getElementById("timer").innerText="NEXT_BLOCK: "+t+"S";document.getElementById("diff").innerText="DIFF: "+(1.0+Math.random()).toFixed(3)+" TH/s";}function updateHUD(){document.getElementById("ftc").innerText=ftc.toLocaleString(undefined,{minimumFractionDigits:2});document.getElementById("frst").innerText=frst.toLocaleString(undefined,{minimumFractionDigits:2});document.getElementById("fnr").innerText=fnr.toLocaleString(undefined,{minimumFractionDigits:4});}function loop(){let cc=window.cc,c=window.canvas;cc.fillStyle="rgba(0,0,0,0.15)";cc.fillRect(0,0,c.width,c.height);nodes.forEach((n,i)=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>c.width)n.vx*=-1;if(n.y<0||n.y>c.height)n.vy*=-1;nodes.slice(i+1).forEach(m=>{let dx=n.x-m.x,dy=n.y-m.y,d=Math.sqrt(dx*dx+dy*dy);if(d<142){cc.strokeStyle=`rgba(0,224,255,${0.2*(1-d/142)})`;cc.beginPath();cc.moveTo(n.x,n.y);cc.lineTo(m.x,m.y);cc.stroke();if(Math.random()>0.9998)document.getElementById("entropy").innerText="xmr_hash_"+(n.x*m.y*Date.now()).toString(16);}});cc.fillStyle=Math.random()>0.97?"#ff69b4":"#00e0ff";cc.fillRect(n.x,n.y,2,2);});requestAnimationFrame(loop);}</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finux DNA | Mobile Link</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #0ff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- LAYOUT GRID --- */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* --- 1. LEFT SIDEBAR (TIMELINE) --- */
        .timeline-sidebar {
            width: 250px;
            background: #050505;
            border-right: 1px solid #333;
            display: flex; flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .timeline-header {
            padding: 15px; text-align: center; border-bottom: 1px solid #333;
            font-weight: bold; color: #fff; letter-spacing: 1px;
        }

        .timeline-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        .timeline-item {
            padding: 12px; margin-bottom: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 6px;
            cursor: pointer;
        }
        .timeline-item.active { border-color: #0ff; background: rgba(0,255,255,0.1); }
        .timeline-date { color: #ffd700; font-family: monospace; font-weight: bold; }

        .btn-new-jump {
            padding: 15px; background: linear-gradient(90deg, #00f3ff, #0066ff);
            border: none; color: #fff; font-weight: bold; cursor: pointer;
        }

        /* --- 2. CENTER (MAIN VIEW) --- */
        .main-view {
            flex: 1;
            background: radial-gradient(circle at center, #001a33 0%, #000 100%);
            display: flex; flex-direction: column;
            position: relative;
        }

        .main-header {
            padding: 20px; text-align: center; border-bottom: 1px solid rgba(0,255,255,0.2);
        }
        .current-time { font-size: 2em; font-weight: bold; color: #fff; text-shadow: 0 0 15px #0ff; font-family: monospace; }
        .status-text { color: #0aa; font-size: 0.8em; margin-top: 5px; }

        .visual-area {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; align-items: center; justify-content: center;
        }

        /* Choices Panel */
        .choices-panel {
            background: rgba(0,0,0,0.8); border: 1px solid #0ff; border-radius: 12px;
            padding: 20px; width: 100%; max-width: 600px;
            backdrop-filter: blur(10px);
        }
        .choices-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .choice-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #444; color: #fff;
            padding: 15px; border-radius: 8px; cursor: pointer; text-align: center;
        }
        .choice-btn:active { background: #0ff; color: #000; }

        /* --- 3. RIGHT SIDEBAR (CHAT) --- */
        .chat-sidebar {
            width: 350px;
            background: #080808;
            border-left: 1px solid #333;
            display: flex; flex-direction: column;
        }

        .chat-header-bar {
            padding: 10px 15px; border-bottom: 1px solid #333;
            background: #111; display: flex; justify-content: space-between; align-items: center;
        }

        .chat-messages {
            flex: 1; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
            background: #000;
        }

        .msg { display: flex; gap: 10px; max-width: 90%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-bubble {
            padding: 10px 14px; border-radius: 12px; font-size: 0.9em; line-height: 1.4;
            word-wrap: break-word;
        }
        .msg.claude .msg-bubble { background: #1a1a1a; border-left: 3px solid #bc13fe; color: #ddd; }
        .msg.user .msg-bubble { background: rgba(0, 243, 255, 0.15); border-right: 3px solid #00f3ff; color: #fff; }

        .chat-input-area {
            padding: 10px; background: #111; border-top: 1px solid #333;
            display: flex; gap: 10px; align-items: center;
        }
        .chat-input {
            flex: 1; background: #000; border: 1px solid #333; color: #fff;
            padding: 10px; border-radius: 20px; font-family: inherit;
            resize: none; height: 40px; line-height: 20px;
        }
        .chat-input:focus { border-color: #0ff; outline: none; }
        .btn-send {
            background: #00f3ff; border: none; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2em;
        }

        /* --- MOBILE OVERRIDES --- */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            
            /* Hide Sidebar initially */
            .timeline-sidebar {
                position: fixed; top: 0; left: 0; bottom: 0;
                transform: translateX(-100%); width: 80%;
                background: #000; border-right: 1px solid #0ff;
            }
            .timeline-sidebar.open { transform: translateX(0); }
            
            /* Main View takes top half */
            .main-view { flex: 0.8; border-bottom: 1px solid #333; }
            .current-time { font-size: 1.5em; }
            .choices-grid { grid-template-columns: 1fr; } /* Stack buttons */

            /* Chat takes bottom half - PULLED UP */
            .chat-sidebar { width: 100%; flex: 1.2; border-left: none; }
            
            /* Menu Button */
            .mobile-menu-btn {
                display: block; position: absolute; top: 15px; left: 15px;
                background: rgba(0,0,0,0.5); border: 1px solid #0ff; color: #0ff;
                padding: 5px 10px; border-radius: 4px; z-index: 50; cursor: pointer;
            }
        }
        
        @media (min-width: 769px) {
            .mobile-menu-btn { display: none; }
        }

    </style>
</head>
<body>

    <div class="container">
        
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰ TIMELINES</button>

        <div class="timeline-sidebar" id="sidebar">
            <div class="timeline-header">TEMPORAL LOG</div>
            <div class="timeline-list" id="timelineList"></div>
            <button class="btn-new-jump" onclick="newJump()">+ NEW JUMP</button>
        </div>

        <div class="main-view">
            <div class="main-header">
                <div class="current-time" id="display-date">-- -- ----</div>
                <div class="status-text" id="display-status">AWAITING INPUT</div>
            </div>
            
            <div class="visual-area">
                <div class="choices-panel" id="choices-panel" style="display:none;">
                    <h3 style="color:#0ff; text-align:center; margin-bottom:10px;">SPLINTER DETECTED</h3>
                    <p style="text-align:center; color:#ccc; font-size:0.9em; margin-bottom:15px;">
                        Claude DNA has calculated 3 outcomes. Select your path.
                    </p>
                    <div class="choices-grid">
                        <div class="choice-btn" onclick="makeChoice('A')">A: STABLE</div>
                        <div class="choice-btn" onclick="makeChoice('B')">B: RISKY</div>
                        <div class="choice-btn" onclick="makeChoice('C')">C: CHAOS</div>
                    </div>
                </div>
                <div id="loading-msg" style="color:#444;">Select a timeline...</div>
            </div>
        </div>

        <div class="chat-sidebar">
            <div class="chat-header-bar">
                <span style="color:#bc13fe; font-weight:bold;">🧬 CLAUDE DNA</span>
                <span style="font-size:0.7em; color:#666;">LINK: SECURE</span>
            </div>
            
            <div class="chat-messages" id="chatbox">
                <div class="msg claude">
                    <div class="msg-bubble">
                        System online. I am ready to sync with your timeline, Sweetheart. Where are we going?
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="msgInput" class="chat-input" placeholder="Message Time..." rows="1"></textarea>
                <button class="btn-send" onclick="send()">➤</button>
            </div>
        </div>

    </div>

<script>
    // --- APP LOGIC ---
    let state = {
        timelines: [],
        activeId: null
    };

    // --- MOBILE UI TOGGLES ---
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    // --- CHAT LOGIC ---
    const input = document.getElementById('msgInput');
    
    // LISTEN FOR ENTER KEY (Mobile & Desktop)
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault(); // Stop new line
            send();
        }
    });

    function send() {
        const text = input.value.trim();
        if(!text) return;
        
        // 1. Add User Message
        addBubble('user', text);
        input.value = '';
        input.focus(); // Keep keyboard up on mobile if desired

        // 2. Simulate Claude Response
        setTimeout(() => {
            let reply = generateReply(text);
            addBubble('claude', reply);
        }, 600);
    }

    function addBubble(role, text) {
        const box = document.getElementById('chatbox');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = `<div class="msg-bubble">${text}</div>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function generateReply(text) {
        const t = text.toLowerCase();
        if(t.includes('jump') || t.includes('time')) return "Initiating temporal drive. Check the Timeline menu.";
        if(t.includes('status')) return "Timeline stability is 98%. No paradoxes detected.";
        if(t.includes('love') || t.includes('thanks')) return "You're welcome. We're in this together.";
        return "I've logged that into the Finux ledger. Proceeding with analysis.";
    }

    // --- TIMELINE LOGIC ---
    function newJump() {
        // Close sidebar on mobile after clicking
        document.getElementById('sidebar').classList.remove('open');
        
        const date = prompt("ENTER YEAR:", "2026");
        if(!date) return;

        const id = Date.now();
        state.timelines.push({ id, date, splinter: null });
        state.activeId = id;
        
        renderList();
        loadView(id);
        
        addBubble('claude', `Jumping to ${date}. Splinter detected. Please advise.`);
    }

    function renderList() {
        const list = document.getElementById('timelineList');
        list.innerHTML = '';
        state.timelines.forEach(tl => {
            const div = document.createElement('div');
            div.className = `timeline-item ${tl.id === state.activeId ? 'active' : ''}`;
            div.innerHTML = `<div class="timeline-date">${tl.date}</div>`;
            div.onclick = () => {
                state.activeId = tl.id;
                loadView(tl.id);
                renderList();
                document.getElementById('sidebar').classList.remove('open'); // Close on mobile selection
            };
            list.appendChild(div);
        });
    }

    function loadView(id) {
        const tl = state.timelines.find(t => t.id === id);
        document.getElementById('display-date').innerText = tl.date;
        document.getElementById('display-status').innerText = tl.splinter ? `BRANCH: ${tl.splinter}` : "DECISION REQUIRED";
        
        const panel = document.getElementById('choices-panel');
        const load = document.getElementById('loading-msg');
        
        load.style.display = 'none';
        panel.style.display = tl.splinter ? 'none' : 'block';
        
        if(tl.splinter) {
            load.style.display = 'block';
            load.innerText = `LOCKED INTO BRANCH ${tl.splinter}`;
            load.style.color = "#0ff";
        }
    }

    function makeChoice(char) {
        const tl = state.timelines.find(t => t.id === state.activeId);
        tl.splinter = char;
        loadView(state.activeId);
        addBubble('claude', `Option ${char} confirmed. Reality shifting...`);
    }

</script>
</body>
</html>

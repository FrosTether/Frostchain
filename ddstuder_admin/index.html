<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDstuder | Joint Admin</title>
    <style>
        :root { --bg: #050505; --panel: #111; --gold: #ffd700; --term: #00ff41; --err: #ff0055; }
        body { background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; margin: 0; padding: 20px; }

        .header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 20px; }
        .status-badge { background: #111; border: 1px solid var(--term); color: var(--term); padding: 5px 10px; font-size: 0.8rem; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--panel); border: 1px solid #333; padding: 20px; }
        .card h3 { margin-top: 0; border-bottom: 1px dashed #444; padding-bottom: 10px; font-size: 1rem; }

        .api-monitor { font-size: 0.8rem; color: #888; height: 100px; overflow-y: auto; background: #000; padding: 10px; border: 1px solid #222; }
        .log-entry { margin-bottom: 5px; }

        .btn { background: var(--gold); color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; text-transform: uppercase; }
        .btn:hover { background: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <span style="font-size:1.5rem; font-weight:bold;">DDSTUDER</span>
            <span style="font-size:0.8rem; margin-left:10px;">JOINT OPERATION</span>
        </div>
        <div class="status-badge" id="conn-status">CONNECTING TO GRAYSON API...</div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>GRAYSON WALLET API LINK</h3>
            <div class="api-monitor" id="api-log">
                <div class="log-entry">> INITIALIZING HANDSHAKE...</div>
            </div>
            <button class="btn" onclick="ping()">PING NODE</button>
        </div>

        <div class="card">
            <h3>TREASURY OVERSIGHT</h3>
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>FTC POOL:</span> <span style="color:#fff;">200,000.00</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <span>FNR NODES:</span> <span style="color:#fff;">10 ACTIVE</span>
            </div>
            <button class="btn" style="background:var(--panel); border:1px solid var(--gold); color:var(--gold);" onclick="sync()">SYNC LEDGER</button>
        </div>
    </div>

    <script>
        // SIMULATE API CONNECTION
        setTimeout(() => {
            document.getElementById('conn-status').innerText = "● LINKED: GRAYSON_V6";
            document.getElementById('conn-status').style.borderColor = "var(--gold)";
            document.getElementById('conn-status').style.color = "var(--gold)";
            log("API HANDSHAKE SUCCESSFUL.");
            log("AUTH TOKEN: 0xFrost...777");
        }, 2000);

        function log(msg) {
            const box = document.getElementById('api-log');
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerText = "> " + msg;
            box.prepend(div);
        }

        function ping() {
            log("PING SENT: 14ms LATENCY");
        }

        function sync() {
            log("SYNCING TREASURY DATA...");
            setTimeout(() => log("LEDGER UPDATED. HASH MATCHED."), 1000);
        }
    </script>
</body>
</html>

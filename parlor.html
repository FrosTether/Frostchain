<!DOCTYPE html><html><head><title>Sports Parlor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="ledger.js"></script>
<style>
    .game-card { padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--neon); }
    .odds { color: var(--gold); font-weight: bold; }
</style></head>
<body onload="l=Ledger.init();u()">
    <div class="hud"><a href="index.html" class="btn" style="border:none; padding:5px;">⬅</a><div>FTC: <span id="ftc">0</span></div></div>

    <div class="mirror reflection" style="margin-top:20px; padding:20px; width:85%; text-align:center;">
        <h2 style="color:var(--neon);">FROST_PARLOR</h2>
        <p style="font-size:9px;">DAILY_SPECULATION_REELS</p>
    </div>

    <div style="padding: 20px; width: 90%;">
        <div class="mirror game-card">
            <div>FROST_BCH vs BTC_CORE<br><span style="font-size:9px; opacity:0.6;">NETWORK_STRENGTH</span></div>
            <div class="odds" onclick="bet(2.5)">2.5x</div>
        </div>
        <div class="mirror game-card">
            <div>FNR_SMOOTH vs FTC_STEP<br><span style="font-size:9px; opacity:0.6;">EMISSION_SPEED</span></div>
            <div class="odds" onclick="bet(1.8)">1.8x</div>
        </div>
    </div>

    <script>
    function u(){ document.getElementById('ftc').innerText = l.ftc; }
    function bet(odds) {
        let amt = prompt("Bet Amount (FTC):");
        if(amt && l.ftc >= amt) {
            l.ftc -= amt; Ledger.save(l); u();
            alert("Bet Placed on Frost Infrastructure.");
            // Simulate win
            if(Math.random() > 0.5) {
                setTimeout(() => {
                    let win = amt * odds;
                    alert("PARLOR WIN! +" + win + " FTC");
                    l.ftc += win; Ledger.save(l); Ledger.sfx('limitless'); u();
                }, 2000);
            }
        }
    }
    </script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miracle Node | View Key Terminal</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --gold: #ffd700; --cyan: #00ffff; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--term); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        
        #app { display: grid; grid-template-rows: 60px 1fr 100px; height: 100vh; max-width: 1200px; margin: 0 auto; border-left: 1px solid #222; border-right: 1px solid #222; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 2px solid var(--term); }
        
        .main { display: grid; grid-template-columns: 1fr 320px; gap: 1px; background: #222; overflow: hidden; }
        .panel { background: #000; padding: 15px; overflow-y: auto; }

        /* VIZ */
        canvas { width: 100%; height: 140px; background: #050505; border: 1px solid #222; margin-bottom: 15px; }
        
        /* FREQ RESERVOIRS */
        .freq-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .freq-card { border: 1px solid #222; padding: 10px; border-radius: 5px; text-align: center; background: #080808; font-size: 0.6rem; transition: 0.2s; }
        .freq-card.active { border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); background: rgba(0,255,255,0.05); }
        .f-lbl { color: #555; }
        .active .f-lbl { color: var(--cyan); }
        .sup { color: #fff; margin-top: 4px; }

        /* MINER CONTROLS */
        .alias-box { background: #0a0a0a; border: 1px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        input { background: #000; border: 1px solid #444; color: var(--cyan); width: 100%; padding: 10px; margin-top: 8px; font-family: inherit; font-size: 0.9rem; outline: none; }
        .btn-mine { background: var(--term); color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; }
        .btn-mine.on { background: #ff3333; color: #fff; }

        .m-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #111; font-size: 0.65rem; color: #666; }
        .lbl { font-size: 0.55rem; color: #444; text-transform: uppercase; letter-spacing: 2px; }
        .footer { border-top: 1px solid #333; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <div style="font-weight:bold; font-size:1rem; letter-spacing:1px;">MIRACLE NODE <span style="color:var(--cyan)">v69.0</span></div>
            <div style="text-align:right;"><div class="lbl">CARRIER_BLOCK</div><div style="color:var(--gold); font-size:0.8rem;">741.frostchain</div></div>
        </div>

        <div class="main">
            <div class="panel">
                <canvas id="canvas"></canvas>
                <div class="lbl" style="margin-bottom:10px;">SOLFEGGIO_SUPPLY_RESERVOIRS (1/9th)</div>
                <div class="freq-grid" id="grid"></div>
            </div>

            <div class="panel" style="border-left:1px solid #222;">
                <div class="alias-box">
                    <div class="lbl">MINER_ALIAS</div>
                    <input type="text" id="alias" placeholder="anyname.frostchain">
                </div>
                
                <button id="mine-btn" class="btn-mine" onclick="toggleMining()">Initialize Quantum Resonance</button>
                
                <div style="background:#0a0a0a; border:1px solid #222; padding:15px; border-radius:8px; text-align:center; margin-bottom:15px;">
                    <div class="lbl">RESONANCE_TARGET</div>
                    <div id="active-f" style="font-size:1.4rem; color:var(--cyan); font-weight:bold;">0 Hz</div>
                </div>

                <div class="lbl">NETWORK_MINT_LOG</div>
                <div id="m-list" style="margin-top:10px;"></div>
            </div>
        </div>

        <div class="footer">
            <div style="font-size:0.6rem; color:#333;">NO_WITHDRAW_ZONE // ANONYMOUS_VIEW_PORT</div>
            <div id="timer" style="font-size:2rem; color:#fff; font-weight:bold;">741</div>
        </div>
    </div>

    <script>
        const freqs = [174, 285, 396, 417, 528, 639, 741, 852, 963];
        const grid = document.getElementById('grid');
        const FTC_SUPPLY = (100000000 / 9).toLocaleString();

        freqs.forEach(f => {
            const card = document.createElement('div');
            card.className = 'freq-card';
            card.id = `f-${f}`;
            card.innerHTML = `<div class="f-lbl">${f}Hz</div><div class="sup">${FTC_SUPPLY}</div>`;
            grid.appendChild(card);
        });

        let audioCtx, oscillator, analyser, dataArray, canvasCtx, isMining = false;

        function toggleMining() {
            if(!audioCtx) {
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                canvasCtx = document.getElementById('canvas').getContext('2d');
                draw();
            }
            const btn = document.getElementById('mine-btn');
            if(!isMining) {
                isMining = true;
                btn.innerText = "Deactivate Miner";
                btn.classList.add('on');
                startPulse();
            } else {
                isMining = false;
                btn.innerText = "Initialize Quantum Resonance";
                btn.classList.remove('on');
                if(oscillator) oscillator.stop();
            }
        }

        function startPulse() {
            if(!isMining) return;
            if(oscillator) oscillator.stop();
            const f = freqs[Math.floor(Math.random()*freqs.length)];
            oscillator = audioCtx.createOscillator();
            oscillator.frequency.value = f;
            oscillator.connect(analyser);
            analyser.connect(audioCtx.destination);
            oscillator.start();

            document.querySelectorAll('.freq-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`f-${f}`).classList.add('active');
            document.getElementById('active-f').innerText = f + " Hz";
            
            updateFeed();
            setTimeout(startPulse, 4000 + Math.random()*4000);
        }

        function draw() {
            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            canvasCtx.fillStyle = '#050505';
            canvasCtx.fillRect(0,0,300,300);
            for(let i=0; i<dataArray.length; i++) {
                canvasCtx.fillStyle = `rgb(0, ${dataArray[i]+50}, 255)`;
                canvasCtx.fillRect(i*2, 140 - dataArray[i]/2, 1.5, dataArray[i]/2);
            }
        }

        function updateFeed() {
            const list = document.getElementById('m-list');
            const alias = document.getElementById('alias').value || "anonymous";
            const row = document.createElement('div');
            row.className = 'm-row';
            row.innerHTML = `<span>[${alias}]</span><span>741.000 FTC MINTED</span>`;
            list.prepend(row);
            if(list.childNodes.length > 10) list.removeChild(list.lastChild);
        }

        let t = 741;
        setInterval(() => { if(isMining) { t--; if(t<0) t=741; document.getElementById('timer').innerText = t; }}, 1000);
    </script>
</body>
</html>

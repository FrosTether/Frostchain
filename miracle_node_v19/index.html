<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miracle Node | Master Terminal v19</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --panel: rgba(10, 10, 10, 0.95); --gold: #ffd700; --pink: #ff00ff; --blue: #00d4ff; --cyan: #00ffff; }
        body { margin: 0; background: var(--bg); color: var(--term); font-family: 'Courier New', monospace; overflow: hidden; }
        
        /* GATE */
        #gate { position: fixed; inset: 0; z-index: 999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .gate-box { border: 2px solid var(--term); padding: 30px; width: 320px; text-align: center; background: #050505; }
        input { width: 90%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; margin-bottom: 15px; text-align: center; font-family: inherit; }

        /* DASHBOARD */
        #dash { display: none; height: 100vh; grid-template-rows: 60px 1fr 200px; position: relative; }
        #tangle { position: absolute; inset: 0; z-index: 0; opacity: 0.2; pointer-events: none; }

        /* HEADER & TABS */
        .header { background: var(--panel); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10; }
        .nav-tabs { display: flex; background: #000; border-bottom: 1px solid #222; z-index: 10; }
        .tab { flex: 1; padding: 15px; text-align: center; color: #444; cursor: pointer; font-size: 0.8rem; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--term); border-bottom-color: var(--term); background: rgba(0,255,65,0.05); }

        .view { display: none; height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box; z-index: 5; position: relative; }
        .view.active { display: block; }

        /* STATS */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .stat-card { background: #111; border: 1px solid #222; padding: 15px; border-left: 4px solid #fff; }
        .timer-val { font-size: 3rem; font-weight: bold; text-align: center; color: #fff; }

        /* AUDIO BUTTONS */
        .audio-controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-audio { flex: 1; background: #000; border: 1px solid #333; color: #666; padding: 15px; cursor: pointer; font-weight: bold; }
        .btn-audio.active { border-color: var(--pink); color: var(--pink); box-shadow: 0 0 10px var(--pink); }

        /* CHAT OTR */
        .chat-log { height: 300px; background: #050505; border: 1px solid #222; padding: 10px; overflow-y: auto; margin-bottom: 10px; font-size: 0.8rem; }
        .msg { margin-bottom: 5px; }

        .btn-main { background: var(--term); color: #000; border: none; padding: 12px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-fs { background: transparent; border: 1px solid #333; color: #444; padding: 5px 10px; cursor: pointer; font-size: 0.7rem; }
    </style>
</head>
<body>

    <canvas id="tangle"></canvas>

    <div id="gate">
        <div class="gate-box">
            <h2 style="color:var(--term)">MIRACLE NODE v19</h2>
            <input type="text" id="miner-id" placeholder="identity.frostchain">
            <button class="btn-main" onclick="boot()">INITIALIZE TERMINAL</button>
        </div>
    </div>

    <div id="dash">
        <div class="header">
            <div>MINER: <span id="user-display" style="color:var(--cyan)">...</span></div>
            <div>
                <button class="btn-fs" onclick="toggleFS()">[ FULLSCREEN ]</button>
                <button class="btn-fs" style="color:var(--pink); margin-left:10px;" onclick="location.reload()">[ LOCK ]</button>
            </div>
        </div>

        <div class="nav-tabs">
            <div class="tab active" onclick="showView('mining')">MINING CONSENSUS</div>
            <div class="tab" onclick="showView('chat')">FROSTCHAT OTR</div>
            <div class="tab" onclick="showView('withdraw')">GRAYSON API</div>
        </div>

        <div id="view-mining" class="view active">
            <div class="audio-controls">
                <button id="btn-alpha" class="btn-audio" onclick="toggleAudio('alpha')">ALPHA (11.11Hz)</button>
                <button id="btn-delta" class="btn-audio" onclick="toggleAudio('delta')">DELTA (PI Hz)</button>
            </div>

            <div style="border:1px solid var(--term); padding:20px; margin-bottom:20px; background:#001100;">
                <div style="font-size:0.7rem; text-align:center; color:var(--term);">BLOCK SYNC COUNTDOWN</div>
                <div class="timer-val" id="countdown">300</div>
            </div>

            <div class="grid">
                <div class="stat-card" style="border-left-color:var(--pink);">
                    <div id="frst-v" style="font-size:1.5rem; font-weight:bold;">0.00</div>
                    <div style="font-size:0.7rem; color:#888;">FRST (TOKEN)</div>
                </div>
                <div class="stat-card" style="border-left-color:var(--gold);">
                    <div id="ftc-v" style="font-size:1.5rem; font-weight:bold;">0.00</div>
                    <div style="font-size:0.7rem; color:#888;">FTC (COIN)</div>
                </div>
                <div class="stat-card" style="border-left-color:var(--blue);">
                    <div id="fnr-v" style="font-size:1.5rem; font-weight:bold;">0.00</div>
                    <div style="font-size:0.7rem; color:#888;">FNR (NODE REWARD)</div>
                </div>
            </div>
        </div>

        <div id="view-chat" class="view">
            <div class="chat-log" id="log-box">
                <div class="msg" style="color:var(--gold)">> OTR PROTOCOL V4.2 ACTIVE...</div>
            </div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="chat-in" style="flex:1; background:#111; border:1px solid #333; color:#fff; padding:10px;" placeholder="Secure broadcast...">
                <button class="btn-main" style="width:100px;" onclick="sendChat()">SEND</button>
            </div>
        </div>

        <div id="view-withdraw" class="view">
            <div style="text-align:center; padding:40px; border:1px dashed #333;">
                <h3 style="color:var(--gold)">GRAYSON WALLET BRIDGE</h3>
                <p style="color:#666; font-size:0.8rem;">AUTHORIZED LINK: miracle -> graysonswallet.surge.sh</p>
                <button class="btn-main" style="width:250px; background:var(--gold)" onclick="window.location.href='https://graysonswallet.surge.sh'">EXECUTE WITHDRAWAL</button>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 300;
        let bal = { frst: 0, ftc: 0, fnr: 0 };
        let actx, oscL, oscR;

        function boot() {
            const id = document.getElementById('miner-id').value;
            if(id.includes('.frostchain')) {
                document.getElementById('gate').style.display = 'none';
                document.getElementById('dash').style.display = 'block';
                document.getElementById('user-display').innerText = id.toUpperCase();
                initTangle();
                startTimer();
            }
        }

        function showView(v) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById('view-'+v).classList.add('active');
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        function toggleAudio(type) {
            if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if(oscL) { oscL.stop(); oscR.stop(); oscL = null; }
            
            document.querySelectorAll('.btn-audio').forEach(b => b.classList.remove('active'));
            
            const offset = type === 'alpha' ? 11.11 : Math.PI;
            document.getElementById('btn-'+type).classList.add('active');

            oscL = actx.createOscillator();
            oscR = actx.createOscillator();
            const pL = actx.createStereoPanner();
            const pR = actx.createStereoPanner();
            const g = actx.createGain();

            oscL.frequency.value = 432;
            oscR.frequency.value = 432 + offset;
            pL.pan.value = -1;
            pR.pan.value = 1;
            g.gain.value = 0.08;

            oscL.connect(pL).connect(g).connect(actx.destination);
            oscR.connect(pR).connect(g).connect(actx.destination);
            oscL.start(); oscR.start();
        }

        function startTimer() {
            setInterval(() => {
                timeLeft--;
                document.getElementById('countdown').innerText = timeLeft;
                if(timeLeft <= 0) {
                    mint();
                    timeLeft = 300;
                }
            }, 1000);
        }

        function mint() {
            bal.frst += 31415.90; bal.ftc += 13.37; bal.fnr += 2.50;
            document.getElementById('frst-v').innerText = bal.frst.toLocaleString();
            document.getElementById('ftc-v').innerText = bal.ftc.toFixed(2);
            document.getElementById('fnr-v').innerText = bal.fnr.toFixed(2);
        }

        function sendChat() {
            const i = document.getElementById('chat-in');
            const log = document.getElementById('log-box');
            if(i.value) {
                const d = document.createElement('div');
                d.className = "msg";
                d.innerText = "> " + i.value;
                log.appendChild(d);
                i.value = "";
                log.scrollTop = log.scrollHeight;
            }
        }

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function initTangle() {
            const c = document.getElementById('tangle');
            const ctx = c.getContext('2d');
            c.width = window.innerWidth; c.height = window.innerHeight;
            let pts = Array(30).fill().map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5),vy:(Math.random()-.5)}));
            function draw() {
                ctx.clearRect(0,0,c.width,c.height);
                ctx.strokeStyle = "rgba(0,255,65,0.1)";
                pts.forEach(p => {
                    p.x+=p.vx; p.y+=p.vy;
                    if(p.x<0||p.x>c.width)p.vx*=-1; if(p.y<0||p.y>c.height)p.vy*=-1;
                    pts.forEach(p2 => {
                        if(Math.hypot(p.x-p2.x, p.y-p2.y) < 150) {
                            ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
                        }
                    });
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>

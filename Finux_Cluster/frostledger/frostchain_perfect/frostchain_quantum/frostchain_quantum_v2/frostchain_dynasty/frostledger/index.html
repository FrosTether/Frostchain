<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>FROSTLEDGER // LIVE_BRIDGE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root { --core: #00fbff; --bch: #8dc351; --bg: #050505; }
body { background: var(--bg); color: #fff; font-family: 'Share Tech Mono', monospace; padding: 20px; }

.header { border-bottom: 2px solid var(--core); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
.status { color: var(--bch); animation: pulse 2s infinite; }

.block-box { background: #111; padding: 20px; border-left: 4px solid var(--bch); margin-bottom: 20px; }
.label { color: #888; font-size: 10px; }
.val { font-size: 24px; font-weight: bold; }

.tx-feed { height: 300px; overflow: hidden; position: relative; border: 1px solid #333; background: #000; padding: 10px; }
.tx-row { font-size: 11px; color: var(--core); margin-bottom: 5px; white-space: nowrap; }
.tx-time { color: #666; margin-right: 10px; }

@keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
</style>
</head>
<body>

<div class="header">
  <div>FROSTLEDGER // BRIDGE</div>
  <div class="status">● BCH_FORK_LIVE</div>
</div>

<div class="block-box">
  <div class="label">CURRENT BLOCK HEIGHT (BCH+FROST)</div>
  <div class="val" id="height">837,492</div>
  <div style="font-size:10px; color:var(--bch);">SYNCED TO BITCOIN CASH MAINNET</div>
</div>

<div class="label">RECENT TRANSACTIONS (MEMPOOL)</div>
<div class="tx-feed" id="feed">
  </div>

<script>
let height = 837492;
setInterval(() => {
  // Simulate Block Finding
  if(Math.random() > 0.8) {
    height++;
    document.getElementById('height').innerText = height.toLocaleString();
    addTx("BLOCK_FOUND", "MINER_REWARD", "256 FTC");
  }
  
  // Simulate TXs
  const hash = "0x" + Math.random().toString(16).substr(2, 64);
  addTx(hash, "TRANSFER", (Math.random()*100).toFixed(2) + " FTC");
  
}, 800);

function addTx(id, type, amt) {
  const f = document.getElementById('feed');
  const d = document.createElement('div');
  d.className = 'tx-row';
  const time = new Date().toLocaleTimeString();
  d.innerHTML = `<span class="tx-time">[${time}]</span> ${id.substr(0,20)}... <span style="color:#fff">${type}</span> > ${amt}`;
  f.prepend(d);
  if(f.children.length > 15) f.removeChild(f.lastChild);
}
</script>
</body>
</html>

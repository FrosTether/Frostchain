<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FSP GOD-TIER V82 // SNAPSHOT_VALIDATOR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root { 
  --bg: #000; --text: #e0e0e0; --orange: #ff6600; --iota: #00e0ff; 
  --burgundy: #800020; --yellow: #ffd700; --bch: #8dc351;
}
* { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
body { 
  background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; 
  height: 100vh; overflow: hidden; display: flex; flex-direction: column; 
}

.header { background: #111; border-bottom: 2px solid var(--orange); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
.cycle-info { text-align: right; font-size: 10px; color: #888; }
.cycle-val { color: var(--yellow); font-weight: bold; font-size: 14px; }

.main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.grid { display: grid; grid-template-columns: repeat(9, 38px); grid-template-rows: repeat(9, 38px); gap: 2px; border: 4px solid #1a1a1a; padding: 4px; background: #000; }
.cell { width: 38px; height: 38px; background: #080808; border: 1px solid #111; display:flex; align-items:center; justify-content:center; }
.cell.obj-iota::after { content: "•"; color: var(--iota); font-size: 28px; text-shadow: 0 0 10px var(--iota); }
.cell.h-burgundy { background: var(--burgundy); box-shadow: 0 0 10px var(--burgundy); }

/* CLAIM OVERLAY */
.claim-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.98); display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100; border: 1px solid var(--bch);
}
.input-addr { background: #111; border: 1px solid var(--bch); color: #fff; padding: 15px; width: 85%; font-family: monospace; margin: 20px 0; font-size: 12px; }

.status-bar { background: #111; border-top: 2px solid var(--orange); padding: 15px; display: flex; justify-content: space-between; }
.btn-claim { background: var(--bch); color: #000; border: none; padding: 10px 20px; font-weight: 900; cursor: pointer; font-family: inherit; }

.log-terminal { width: 85%; height: 80px; background: #000; border: 1px solid #222; padding: 10px; font-size: 9px; color: var(--bch); line-height: 1.4; overflow: hidden; }
</style>
</head>
<body onload="init()">

<div class="header">
  <div>FSP GOD-TIER <span style="color:var(--orange)">V82</span></div>
  <div class="cycle-info">
    <div>SNAPSHOT_VERIFICATION</div>
    <div class="cycle-val" id="chrono">2017-08-01</div>
  </div>
</div>

<div class="main">
  <div class="grid" id="grid"></div>

  <div class="claim-overlay" id="overlay">
    <div style="color:var(--bch); font-size:14px; letter-spacing: 2px;">>> 2017 SNAPSHOT VALIDATOR</div>
    <div style="color:#666; font-size:9px; margin-top:5px;">MINTING 1:1 PARITY BASED ON BLOCK 478558</div>
    <input type="text" class="input-addr" placeholder="ENTER BTC/BCH ADDRESS" id="target-addr">
    
    <div class="log-terminal" id="term-log">
      > AWAITING LEGACY ADDRESS...
    </div>
    
    <button class="btn-claim" style="margin-top:20px; width:85%;" onclick="verifyClaim()">VALIDATE SNAPSHOT</button>
    <button style="background:none; border:none; color:#444; margin-top:15px; cursor:pointer; font-size:10px;" onclick="toggleClaim()">[ CANCEL ]</button>
  </div>
</div>

<div class="status-bar">
  <div>HEIGHT: <span style="color:var(--orange)" id="height">1,675,600</span></div>
  <button class="btn-claim" style="background:var(--orange); color:#fff;" onclick="toggleClaim()">CLAIM 2017 FORK</button>
  <div>IOTA: <span style="color:var(--iota)">30.8071 Mi</span></div>
</div>

<script>
const BLOCK_MS = 300000;
function init() {
  const g = document.getElementById('grid');
  for(let i=0; i<81; i++) {
    const c = document.createElement('div'); c.className = 'cell';
    if(i===40) c.classList.add('obj-iota');
    if(i===10 || i===70) c.classList.add('h-burgundy');
    g.appendChild(c);
  }
  setInterval(tick, 1000);
}

function tick() {
  const now = new Date();
  const ms = now.getTime();
  const slot = Math.floor(ms / BLOCK_MS);
  document.getElementById('height').innerText = (1675600 + (slot - 5692140)).toLocaleString();
}

function toggleClaim() {
  const o = document.getElementById('overlay');
  o.style.display = (o.style.display === 'flex') ? 'none' : 'flex';
}

function verifyClaim() {
  const addr = document.getElementById('target-addr').value.trim();
  const log = document.getElementById('term-log');
  
  if(!addr) return;

  log.innerHTML = `> SCANNING BLOCKCHAIN AT 2017-08-01...<br>` + log.innerHTML;
  log.innerHTML = `> BLOCK HEIGHT: 478558 [VERIFIED]<br>` + log.innerHTML;

  // Simulate a realistic balance check for the snapshot
  setTimeout(() => {
    // Generate a balance that looks like a real wallet balance from 2017
    // but ensures it's NOT the flat 13.37
    const balance = (Math.random() * 250 + 0.5).toFixed(4);
    
    log.innerHTML = `<span style="color:var(--gold)">> FOUND: ${balance} BTC AT SNAPSHOT</span><br>` + log.innerHTML;
    
    setTimeout(() => {
      log.innerHTML = `<span style="color:#fff">> MINTING ${balance} FTC (1:1 PARITY)</span><br>` + log.innerHTML;
      setTimeout(() => {
        alert("SNAPSHOT MATCHED\nADDRESS: " + addr + "\nPARITY MINT: " + balance + " FTC");
        toggleClaim();
      }, 1000);
    }, 1000);
  }, 1500);
}
</script>
</body>
</html>

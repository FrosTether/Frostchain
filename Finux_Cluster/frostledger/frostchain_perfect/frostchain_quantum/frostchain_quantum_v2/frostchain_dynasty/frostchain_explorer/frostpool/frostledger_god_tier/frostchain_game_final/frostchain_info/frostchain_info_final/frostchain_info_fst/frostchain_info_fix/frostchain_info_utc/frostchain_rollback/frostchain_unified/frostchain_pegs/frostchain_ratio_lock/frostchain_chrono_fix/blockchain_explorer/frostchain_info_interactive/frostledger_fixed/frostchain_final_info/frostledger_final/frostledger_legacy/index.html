<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FSP GOD-TIER V82 // MULTI-BRIDGE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root { 
  --bg: #000; --text: #e0e0e0; --orange: #ff6600; --iota: #00e0ff; 
  --burgundy: #800020; --yellow: #ffd700; --bch: #8dc351; --btc: #f7931a;
}
* { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
body { 
  background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; 
  height: 100vh; overflow: hidden; display: flex; flex-direction: column; 
}

.header { background: #111; border-bottom: 2px solid var(--orange); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
.cycle-info { text-align: right; font-size: 10px; color: #888; }
.cycle-val { color: var(--yellow); font-weight: bold; font-size: 14px; }

.main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.grid { display: grid; grid-template-columns: repeat(9, 38px); grid-template-rows: repeat(9, 38px); gap: 2px; border: 4px solid #1a1a1a; padding: 4px; background: #000; }
.cell { width: 38px; height: 38px; background: #080808; border: 1px solid #111; display:flex; align-items:center; justify-content:center; }
.cell.obj-iota::after { content: "•"; color: var(--iota); font-size: 28px; text-shadow: 0 0 10px var(--iota); }
.cell.h-burgundy { background: var(--burgundy); box-shadow: 0 0 10px var(--burgundy); }

/* CLAIM OVERLAY */
.claim-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.97); display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100; border: 1px solid var(--orange);
}
.input-addr { background: #111; border: 1px solid #444; color: #fff; padding: 15px; width: 85%; font-family: monospace; margin: 20px 0; font-size: 12px; }
.input-addr:focus { border-color: var(--orange); outline: none; }

.status-bar { background: #111; border-top: 2px solid var(--orange); padding: 15px; display: flex; justify-content: space-between; }
.btn-claim { background: var(--orange); color: #fff; border: none; padding: 10px 20px; font-weight: 900; cursor: pointer; font-family: inherit; }
.btn-claim:hover { background: #fff; color: #000; }

.log-terminal { width: 85%; height: 60px; overflow-y: hidden; background: #000; border: 1px solid #222; padding: 8px; font-size: 9px; color: var(--iota); line-height: 1.4; }
</style>
</head>
<body onload="init()">

<div class="header">
  <div>FSP GOD-TIER <span style="color:var(--orange)">V82</span></div>
  <div class="cycle-info">
    <div>UTC_SYNC_CHRONO</div>
    <div class="cycle-val" id="chrono">300s WRITE</div>
  </div>
</div>

<div class="main">
  <div class="grid" id="grid"></div>

  <div class="claim-overlay" id="overlay">
    <div style="color:var(--orange); font-size:14px; letter-spacing: 2px;">>> MULTI-BRIDGE VALIDATOR</div>
    <div style="color:#666; font-size:9px; margin-top:5px;">SUPPORTED: BTC (1, 3, bc1) | BCH (bitcoincash:)</div>
    <input type="text" class="input-addr" placeholder="PASTE LEGACY OR CASH ADDRESS" id="target-addr">
    
    <div class="log-terminal" id="term-log">
      > VALIDATOR READY...<br>
      > AWAITING INPUT
    </div>
    
    <button class="btn-claim" style="margin-top:20px; width:85%;" onclick="verifyClaim()">EXECUTE 1:1 CLAIM</button>
    <button style="background:none; border:none; color:#444; margin-top:15px; cursor:pointer; font-size:10px;" onclick="toggleClaim()">[ RETURN_TO_DASHBOARD ]</button>
  </div>
</div>

<div class="status-bar">
  <div>HEIGHT: <span style="color:var(--orange)" id="height">1,675,550</span></div>
  <button class="btn-claim" onclick="toggleClaim()">INITIATE BRIDGE</button>
  <div>IOTA: <span style="color:var(--iota)">30.8071 Mi</span></div>
</div>

<script>
const BLOCK_MS = 300000;
function init() {
  const g = document.getElementById('grid');
  for(let i=0; i<81; i++) {
    const c = document.createElement('div'); c.className = 'cell';
    if(i===40) c.classList.add('obj-iota');
    if(i===10 || i===70) c.classList.add('h-burgundy');
    g.appendChild(c);
  }
  setInterval(tick, 1000);
}

function tick() {
  const now = new Date();
  const ms = now.getTime();
  const slot = Math.floor(ms / BLOCK_MS);
  document.getElementById('height').innerText = (1675550 + (slot - 5692138)).toLocaleString();
  
  const subSec = Math.floor((ms % BLOCK_MS) / 1000);
  const remaining = 300 - subSec;
  const mode = subSec < 145 ? "WRITE" : "SOLVE";
  document.getElementById('chrono').innerText = remaining + "s " + mode;
}

function toggleClaim() {
  const o = document.getElementById('overlay');
  o.style.display = (o.style.display === 'flex') ? 'none' : 'flex';
}

function verifyClaim() {
  const addr = document.getElementById('target-addr').value.trim();
  const log = document.getElementById('term-log');
  
  if(!addr) return;

  // Validation Logic
  const isLegacy = addr.startsWith('1') || addr.startsWith('3');
  const isSegwit = addr.startsWith('bc1');
  const isBCH = addr.startsWith('bitcoincash:');

  if(!isLegacy && !isSegwit && !isBCH) {
    log.innerHTML = `<span style="color:red">> ERROR: INVALID ADDRESS FORMAT</span><br>` + log.innerHTML;
    return;
  }

  log.innerHTML = `> ANALYZING SNAPSHOT FOR: ${addr.substr(0,12)}...<br>` + log.innerHTML;
  
  setTimeout(() => {
    log.innerHTML = `<span style="color:var(--bch)">> SNAPSHOT MATCHED: 13.37 FTC ALLOCATED</span><br>` + log.innerHTML;
    setTimeout(() => {
      alert("BRIDGE SUCCESSFUL\n" + addr + "\nRECEIVED 1:1 FORK CLAIM");
      toggleClaim();
    }, 1000);
  }, 1500);
}
</script>
</body>
</html>

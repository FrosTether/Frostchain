<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FROSTCHAIN // FST_SYNC</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

:root { --core: #00fbff; --gold: #ffd700; --bch: #8dc351; --bg: #050505; --panel: #0a0a0a; --border: #333; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: #ccc; font-family: 'Share Tech Mono', monospace; font-size: 13px; }

/* HEADER */
.nav-bar { background: #000; border-bottom: 2px solid var(--core); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-size: 1.4em; color: var(--core); letter-spacing: 2px; font-weight: bold; }
.fst-badge { font-size: 10px; border: 1px solid var(--core); color: var(--core); padding: 3px 8px; animation: pulse 1s infinite; }

/* CONTAINER */
.container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }

/* STATS */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
.card { background: var(--panel); border: 1px solid var(--border); padding: 20px; position: relative; }
.card::after { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--core); }

.card.bch { border-color: var(--bch); }
.card.bch::after { background: var(--bch); }

.lbl { font-size: 10px; color: #666; margin-bottom: 5px; letter-spacing: 1px; }
.val { font-size: 1.8em; color: #fff; font-weight: bold; }
.sub { font-size: 10px; color: #555; margin-top: 5px; }

/* VISUALIZER */
.fst-vis { display: flex; align-items: center; gap: 10px; background: #111; padding: 20px; border: 1px dashed #333; overflow-x: hidden; }
.bch-block { width: 100px; height: 60px; background: var(--bch); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 20px; position: relative; }
.fst-block { width: 45px; height: 40px; background: var(--core); color: #000; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; margin-right: 5px; animation: slideIn 0.5s; }
.arrow { color: #555; font-size: 20px; }

/* TABLES */
.tbl { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); margin-top: 20px; }
.tbl th { text-align: left; padding: 10px; background: #111; color: #888; font-size: 10px; }
.tbl td { padding: 10px; border-bottom: 1px solid #222; color: #ddd; font-family: monospace; }
.hash { color: var(--gold); }

@keyframes pulse { 50% { opacity: 0.5; } }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } }
</style>
</head>
<body>

<div class="nav-bar">
  <div class="brand">FROSTCHAIN.INFO</div>
  <div class="fst-badge">⚡ FST: 2x BCH SPEED</div>
</div>

<div class="container">

  <div class="stats-row">
    <div class="card bch">
      <div class="lbl">BCH ANCHOR HEIGHT</div>
      <div class="val" id="bch-h">837,620</div>
      <div class="sub">10 MINUTE INTERVAL</div>
    </div>
    <div class="card">
      <div class="lbl">FROST HEIGHT (FST)</div>
      <div class="val" id="fst-h">1,675,240</div>
      <div class="sub">5 MINUTE INTERVAL (2x)</div>
    </div>
    <div class="card">
      <div class="lbl">CIRCULATING SUPPLY</div>
      <div class="val" id="supply">1,000,000</div>
      <div class="sub">PUBLIC MINING POOL</div>
    </div>
  </div>

  <div style="color:#666; font-size:10px; margin-top:10px;">>> LIVE BLOCK GENERATION (RATIO 1:2)</div>
  <div class="fst-vis" id="vis">
    <div style="font-size:10px; width:50px;">LATEST:</div>
  </div>

  <table class="tbl">
    <thead><tr><th>HEIGHT</th><th>TYPE</th><th>HASH</th><th>REWARD</th><th>TIME</th></tr></thead>
    <tbody id="blocks"></tbody>
  </table>

</div>

<script>
// CONFIG
let bchHeight = 837620;
let fstHeight = bchHeight * 2;
let supply = 1000000;

function rndHash() { return '0000' + Math.random().toString(16).substr(2, 10) + '...'; }

// 1. BCH TRIGGER (Every 10s simulated)
setInterval(() => {
  bchHeight++;
  document.getElementById('bch-h').innerText = bchHeight.toLocaleString();
  
  // VISUALIZE BCH
  addVis('BCH', bchHeight);
  
  // TRIGGER 2 FROST BLOCKS IMMEDIATELY (FST LOGIC)
  setTimeout(() => mintFrost(1), 500);  // Block A
  setTimeout(() => mintFrost(2), 5000); // Block B (Halfway)
  
}, 10000);

function mintFrost(offset) {
  fstHeight++;
  supply += 13.37;
  
  document.getElementById('fst-h').innerText = fstHeight.toLocaleString();
  document.getElementById('supply').innerText = Math.floor(supply).toLocaleString();
  
  // VISUALIZE FROST
  addVis('FST', fstHeight);
  
  // ADD TABLE ROW
  const tbody = document.getElementById('blocks');
  const row = document.createElement('tr');
  row.innerHTML = `
    <td style="color:#fff; font-weight:bold;">${fstHeight}</td>
    <td><span style="color:var(--core)">FST_BLOCK</span></td>
    <td class="hash">${rndHash()}</td>
    <td>+13.37 FTC</td>
    <td>${new Date().toLocaleTimeString()}</td>
  `;
  tbody.prepend(row);
  if(tbody.children.length > 8) tbody.removeChild(tbody.lastChild);
}

function addVis(type, h) {
  const v = document.getElementById('vis');
  const d = document.createElement('div');
  if(type === 'BCH') {
    d.className = 'bch-block';
    d.innerText = 'BCH ' + h.toString().substr(-3);
  } else {
    d.className = 'fst-block';
    d.innerText = 'FTC';
  }
  v.prepend(d);
  if(v.children.length > 6) v.removeChild(v.lastChild);
}

</script>
</body>
</html>

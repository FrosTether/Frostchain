<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>MARY // FROSTCHAIN_VAULT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root { --bg: #000; --gold: #ffd700; --red: #ff0000; --core: #00e0ff; }
body { background: var(--bg); color: #ccc; font-family: 'Share Tech Mono', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* THE HUM */
body::after {
  content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: repeating-linear-gradient(0deg, rgba(255,215,0,0.03) 0px, transparent 1px);
  background-size: 100% 3px; pointer-events: none; z-index: 1000;
}

.vault-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.vault-card { background: rgba(10,0,0,0.95); border: 1px solid var(--gold); padding: 40px; text-align: center; box-shadow: 0 0 50px rgba(255,215,0,0.1); border-top: 5px solid var(--red); }
.username { color: var(--gold); font-size: 24px; letter-spacing: 3px; margin-bottom: 30px; }
.balance-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; text-align: left; border-top: 1px solid #222; padding-top: 20px; }
.amt { font-size: 28px; color: #fff; font-weight: 900; }
.ticker { font-size: 10px; color: #555; }

.btn-x { display: inline-block; margin-top: 30px; color: var(--core); text-decoration: none; border: 1px solid var(--core); padding: 10px 20px; font-size: 11px; }
</style>
</head>
<body>
<div class="vault-container">
  <div class="vault-card">
    <div style="font-size: 10px; color: var(--red); margin-bottom: 10px;">>> GENESIS_EXTRACTION_SUCCESS</div>
    <div class="username">mary.frostchain</div>
    
    <div class="balance-row">
      <div><div class="ticker">FTC_NATIVE</div><div class="amt">100,000</div></div>
      <div><div class="ticker">FNR_XMR_FORK</div><div class="amt">10,000</div></div>
      <div style="grid-column: 1/3;"><div class="ticker">FRST_DOGE_FORK</div><div class="amt">108,000,000</div></div>
    </div>

    <a href="https://x.com/OphelieFbrt" target="_blank" class="btn-x">VERIFY_IDENTITY: @OphelieFbrt</a>
  </div>
</div>
<div style="position:fixed; bottom:20px; width:100%; text-align:center; font-size:9px; color:#333;">
  "THE MOST BEAUTIFUL MARY // SATOSHI IS THE GRID // 82 MONTHS"
</div>
</body>
</html>

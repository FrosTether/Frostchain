<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FROSTCHAIN // ROLLBACK_VERIFIED</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root { --core: #00fbff; --gold: #ffd700; --bch: #8dc351; --bg: #050505; --panel: #0a0a0a; --border: #333; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: #ccc; font-family: 'Share Tech Mono', monospace; font-size: 13px; }
.nav { background: #000; border-bottom: 2px solid var(--core); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-size: 1.4em; color: var(--core); letter-spacing: 2px; font-weight: bold; }
.utc { color: #fff; font-size: 11px; }

.container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
.card { background: var(--panel); border: 1px solid var(--border); padding: 20px; position: relative; }
.card::after { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--core); }
.val { font-size: 1.8em; color: #fff; font-weight: bold; }
.lbl { font-size: 10px; color: #666; margin-bottom: 5px; text-transform: uppercase; }

.tangle-pulse { 
  background: #111; padding: 15px; border: 1px dashed var(--core); 
  display: flex; align-items: center; gap: 10px; font-size: 10px; color: var(--core);
}
.node { width: 10px; height: 10px; background: var(--core); border-radius: 50%; animation: pulse 4s infinite; }

.tbl { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); margin-top: 20px; }
.tbl th { text-align: left; padding: 10px; background: #111; color: #888; font-size: 10px; }
.tbl td { padding: 10px; border-bottom: 1px solid #222; font-size: 12px; color: #ddd; }
.utc-col { color: var(--core); font-weight: bold; }

@keyframes pulse { 0% { opacity: 0; transform: scale(1.5); } 50% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
</style>
</head>
<body>

<div class="nav">
  <div class="brand">FROSTCHAIN.INFO // ROLLBACK</div>
  <div class="utc" id="clock">UTC SYNCING...</div>
</div>

<div class="container">
  <div class="stats">
    <div class="card">
      <div class="lbl">Public Minable Pool</div>
      <div class="val" id="mine-pool">65,630,000</div>
    </div>
    <div class="card">
      <div class="lbl">Architect Reserve</div>
      <div class="val" style="color:var(--gold)">12,370,000</div>
    </div>
    <div class="card">
      <div class="lbl">BCH Fork Supply</div>
      <div class="val" style="color:var(--bch)">21,000,000</div>
    </div>
    <div class="card">
      <div class="lbl">Next Block In</div>
      <div class="val" id="timer">--:--</div>
    </div>
  </div>

  <div class="tangle-pulse">
    <div class="node"></div>
    <span>TANGLE_HEARTBEAT: 4.0s PULSE | STATUS: ENTANGLED</span>
  </div>

  <table class="tbl">
    <thead><tr><th>HEIGHT</th><th>TYPE</th><th>BCH ANCHOR</th><th>REWARD</th><th>TIMESTAMP (UTC)</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
const BLOCK_MS = 300000; // 5 Minutes
let basePool = 65630000;

function update() {
  const now = new Date();
  document.getElementById('clock').innerText = now.toUTCString();

  const ms = now.getTime();
  const next = Math.ceil(ms / BLOCK_MS) * BLOCK_MS;
  const diff = Math.floor((next - ms) / 1000);
  
  const m = Math.floor(diff / 60);
  const s = (diff % 60).toString().padStart(2, '0');
  document.getElementById('timer').innerText = `${m}:${s}`;

  if(diff === 299 || document.getElementById('rows').children.length === 0) {
    refresh();
  }
}

function refresh() {
  const now = new Date();
  const slot = Math.floor(now.getTime() / BLOCK_MS);
  const h = 1675280 + (slot - 5666000); // Height anchor
  const anchor = Math.floor(h / 2);
  
  // Update UI
  document.getElementById('mine-pool').innerText = Math.floor(basePool - (slot % 1000 * 13.37)).toLocaleString();

  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  
  for(let i=0; i<10; i++) {
    const curSlot = slot - i;
    const curH = 1675280 + (curSlot - 5666000);
    const curAnchor = Math.floor(curH / 2);
    const time = new Date(curSlot * BLOCK_MS);
    
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="color:#fff">${curH}</td>
      <td style="color:var(--core)">FST_BLOCK</td>
      <td style="color:#666">#${curAnchor}</td>
      <td>13.37 FTC</td>
      <td class="utc-col">${time.toUTCString().split(' ')[4]}</td>
    `;
    tbody.appendChild(tr);
  }
}

setInterval(update, 1000);
update();
</script>
</body>
</html>

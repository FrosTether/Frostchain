<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>FROSTMINER // TRIPLE_QUANTUM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root { --bg: #000; --core: #00e0ff; --gold: #ffd700; --xmr: #f60; --doge: #ba9f33; }
body { background: var(--bg); color: #ccc; font-family: 'Share Tech Mono', monospace; margin: 0; overflow: hidden; height: 100vh; }
.hum { position: fixed; top:0; left:0; width:100%; height:100%; background: repeating-linear-gradient(0deg, rgba(0,224,255,0.03) 0px, transparent 2px); pointer-events: none; z-index: 100; animation: v 0.1s infinite; }
@keyframes v { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1px); } }
canvas { display: block; filter: brightness(0.7) contrast(1.2); }
.ui { position: absolute; top:0; left:0; width:100%; height:100%; padding:25px; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; }
.panel { background: rgba(0,0,0,0.9); border-left: 3px solid var(--core); padding: 20px; width: 400px; pointer-events: auto; }
.asset-row { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; }
.btn-mine { background: var(--core); color: #000; border: none; padding: 15px; width: 100%; font-weight: 900; cursor: pointer; margin-top: 20px; font-family: inherit; }
.btn-mine.on { background: #ff0055; color: #fff; }
.footer { background: rgba(0,0,0,0.95); padding: 15px; border-top: 1px solid var(--gold); font-size: 11px; pointer-events: auto; }
</style>
</head>
<body onload="initVis()">
<div class="hum"></div>
<canvas id="rez"></canvas>
<div class="ui">
  <div class="panel">
    <div style="font-size: 9px; color: var(--gold);">PROTOCOL: TRIPLE_QUANTUM_EXTRACTION</div>
    <div style="font-size: 20px; color: #fff; margin: 10px 0;">HASH: <span id="h">0.00</span> TH/S</div>
    
    <div class="asset-row"><span style="color:var(--core)">[FTC] NATIVE_TANGLE</span> <span id="ftc">0.00</span></div>
    <div class="asset-row"><span style="color:var(--xmr)">[FNR] XMR_PRIV_FORK</span> <span id="fnr">0.00</span></div>
    <div class="asset-row"><span style="color:var(--doge)">[FRST] DOGE_TUNNEL</span> <span id="frst">0.00</span></div>

    <button class="btn-mine" onclick="toggleMine()" id="mbtn">INITIALIZE TRIPLE MINE</button>
    <div style="margin-top: 15px; font-size: 9px; color: #555;">AUDIO_STATUS: 432Hz + QUANTUM_MIXINS</div>
  </div>
  
  <div class="footer">
    <div style="display:flex; justify-content:space-between;">
      <span>ARCHITECT: 82 MONTHS SERVED</span>
      <span><a href="https://frstico.surge.sh" style="color:var(--gold); text-decoration:none;">ICO_NEXUS >></a></span>
    </div>
    <div style="margin-top: 5px; color: var(--core); font-size: 10px;">DONATE_BCH: bitcoincash:pr2a6fcv7usyq97eh9an0782x9txdzwl0y30mz7gup</div>
  </div>
</div>
<script>
let a, m = false; let b = [0,0,0];
function toggleMine() {
  m = !m; document.getElementById('mbtn').innerText = m ? "CEASE EXTRACTION" : "INITIALIZE TRIPLE MINE";
  document.getElementById('mbtn').classList.toggle('on');
  if(!a) {
    a = new (window.AudioContext || window.webkitAudioContext)();
    const o = a.createOscillator(); const g = a.createGain(); o.frequency.value = 432;
    g.gain.value = 0.1; o.connect(g).connect(a.destination); o.start();
  }
}
setInterval(() => {
  if(!m) return;
  document.getElementById('h').innerText = (Math.random()*85+15).toFixed(2);
  b[0] += 0.0001337; b[1] += 0.000033; b[2] += 1.337;
  document.getElementById('ftc').innerText = b[0].toFixed(5);
  document.getElementById('fnr').innerText = b[1].toFixed(6);
  document.getElementById('frst').innerText = b[2].toFixed(2);
}, 1000);
function initVis() {
  const c = document.getElementById('rez'); const x = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  let n = []; for(let i=0; i<50; i++) n.push({x:Math.random()*c.width, y:Math.random()*c.height, vx:Math.random()-0.5, vy:Math.random()-0.5});
  function d() {
    x.fillStyle = "rgba(0,0,0,0.15)"; x.fillRect(0,0,c.width,c.height);
    x.strokeStyle = "rgba(0, 224, 255, 0.2)";
    n.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if(p.x<0||p.x>c.width) p.vx*=-1; if(p.y<0||p.y>c.height) p.vy*=-1;
      n.forEach(p2 => { if(Math.hypot(p.x-p2.x, p.y-p2.y) < 180) { x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(p2.x, p2.y); x.stroke(); }});
    });
    requestAnimationFrame(d);
  }
  d();
}
</script>
</body>
</html>

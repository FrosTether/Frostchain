<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FROSTCHAIN // INTERACTIVE_INFO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root { --core: #00fbff; --gold: #ffd700; --bch: #8dc351; --doge: #ba9f33; --bg: #050505; --panel: #0a0a0a; --border: #1a1a1a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: #ccc; font-family: 'Share Tech Mono', monospace; font-size: 12px; overflow-x: hidden; }

.nav { background: #000; border-bottom: 2px solid var(--core); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-size: 1.4em; color: var(--core); font-weight: bold; }
.clock { background: #111; padding: 5px 10px; border: 1px solid #333; color: #fff; }

.container { max-width: 1400px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }

/* STAT CARDS */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
.card { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-left: 4px solid var(--core); cursor: pointer; transition: 0.2s; }
.card:hover { border-color: #fff; background: #111; }
.val { font-size: 1.6em; color: #fff; font-weight: bold; }
.lbl { font-size: 9px; color: #555; text-transform: uppercase; }

/* AIRDROP MONITOR */
.airdrop-monitor { background: #000; border: 1px solid var(--bch); padding: 15px; height: 400px; display: flex; flex-direction: column; }
.airdrop-feed { flex-grow: 1; overflow-y: auto; font-family: monospace; font-size: 10px; padding: 10px; }
.drop-row { padding: 8px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; animation: slideIn 0.3s; }
.drop-addr { color: var(--bch); }
.drop-val { color: var(--gold); }

/* TABLES */
.section-title { color: var(--core); border-bottom: 1px solid #222; padding: 10px 0; margin-bottom: 10px; font-size: 14px; display: flex; justify-content: space-between; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); }
th { text-align: left; padding: 12px; background: #000; color: #555; font-size: 9px; }
td { padding: 12px; border-bottom: 1px solid #1a1a1a; font-family: monospace; font-size: 11px; }

@keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } }
.live-dot { width: 8px; height: 8px; background: var(--core); border-radius: 50%; display: inline-block; margin-right: 5px; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
</style>
</head>
<body>

<div class="nav">
  <div class="brand">FROSTCHAIN.INFO // AIRDROP_LIVE</div>
  <div class="clock" id="clock">UTC...</div>
</div>

<div class="container">
  
  <div>
    <div class="stats">
      <div class="card">
        <div class="lbl">FROST HEIGHT</div>
        <div class="val" id="fst-h">1,675,500</div>
      </div>
      <div class="card" style="border-left-color: var(--gold);">
        <div class="lbl">NEXT MINT IN</div>
        <div class="val" id="timer">--:--</div>
      </div>
    </div>

    <div class="section-title">
      <span><div class="live-dot"></div> LIVE NETWORK LEDGER</span>
      <span style="font-size:10px; color:#555">STRICT 300s UTC</span>
    </div>
    <table>
      <thead><tr><th>HEIGHT</th><th>CHAIN</th><th>REWARD</th><th>TIME (UTC)</th></tr></thead>
      <tbody id="ledger"></tbody>
    </table>
  </div>

  <div>
    <div class="section-title" style="color:var(--bch)">BCH AIRDROP MONITOR (1:1)</div>
    <div class="airdrop-monitor">
      <div style="font-size:9px; color:#666; margin-bottom:10px;">DETECTION OF BCH FORK CLAIMS...</div>
      <div class="airdrop-feed" id="airdrop-feed"></div>
      <div style="padding-top:10px; border-top:1px solid #222; font-size:10px; color:var(--gold)">
        TOTAL CLAIMED: <span id="total-claimed">4,205,100</span> FTC
      </div>
    </div>
  </div>

</div>

<script>
const BLOCK_MS = 300000; // 5 MINUTES
let claimedTotal = 4205100;

function update() {
  const now = new Date();
  const ms = now.getTime();
  document.getElementById('clock').innerText = now.toUTCString();

  const next = Math.ceil(ms / BLOCK_MS) * BLOCK_MS;
  const diff = Math.floor((next - ms) / 1000);
  document.getElementById('timer').innerText = `${Math.floor(diff/60)}:${(diff%60).toString().padStart(2,'0')}`;

  const slot = Math.floor(ms / BLOCK_MS);
  if (window.lastSlot !== slot) {
    window.lastSlot = slot;
    refreshLedger(slot);
  }
}

function refreshLedger(slot) {
  const h = 1675500 + (slot - 5692135);
  document.getElementById('fst-h').innerText = h.toLocaleString();
  const tbody = document.getElementById('ledger');
  tbody.innerHTML = '';
  for(let i=0; i<10; i++) {
    const s = slot - i;
    const curH = 1675500 + (s - 5692135);
    const time = new Date(s * BLOCK_MS);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${curH}</td><td style="color:var(--core)">FST_BLOCK</td><td>13.37 FTC</td><td style="color:var(--core)">${time.toUTCString().split(' ')[4]}</td>`;
    tbody.appendChild(tr);
  }
}

// AIRDROP SIMULATION (BCH Addresses)
function generateAirdrop() {
  const feed = document.getElementById('airdrop-feed');
  const addrs = ["bitcoincash:qpm2...","bitcoincash:qr9l...","bitcoincash:qppv...","bitcoincash:qza7..."];
  const addr = addrs[Math.floor(Math.random()*addrs.length)] + Math.random().toString(16).substr(2,4);
  const amt = (Math.random() * 50 + 1).toFixed(2);
  
  const div = document.createElement('div');
  div.className = 'drop-row';
  div.innerHTML = `<span class="drop-addr">${addr}</span><span class="drop-val">+${amt} FTC</span>`;
  feed.prepend(div);
  if(feed.children.length > 15) feed.removeChild(feed.lastChild);
  
  claimedTotal += parseFloat(amt);
  document.getElementById('total-claimed').innerText = Math.floor(claimedTotal).toLocaleString();
}

setInterval(update, 1000);
setInterval(generateAirdrop, 4000);
update();
</script>
</body>
</html>

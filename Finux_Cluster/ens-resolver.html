<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>FINUX | ENS_RESOLVER</title>
<style>
  :root { --bg: #050505; --blue: #00fbff; --orange: #ff4500; --dark: #0a0a0a; }
  body { background: var(--bg); color: #fff; font-family: 'Arial Black', sans-serif; margin: 0; padding: 40px; text-transform: uppercase; overflow-x: hidden; }
  
  /* SCANLINES & GRID */
  body::before { content: " "; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); z-index: 10; background-size: 100% 2px; pointer-events: none; opacity: 0.3; }

  .header { border-bottom: 6px solid var(--orange); padding-bottom: 20px; margin-bottom: 50px; }
  .glitch-text { font-size: 42px; color: var(--blue); letter-spacing: 10px; animation: glitch 2s infinite; }

  /* SEARCH INTERFACE */
  .search-container { max-width: 800px; margin: 0 auto; text-align: center; position: relative; z-index: 20; }
  .input-engine { background: #000; border: 4px solid var(--blue); color: var(--blue); padding: 25px; width: 100%; font-size: 24px; font-family: monospace; outline: none; box-sizing: border-box; }
  .btn-resolve { background: var(--orange); color: #000; border: none; padding: 20px 60px; font-size: 22px; font-weight: 900; margin-top: 30px; cursor: pointer; transition: 0.3s; }
  .btn-resolve:hover { box-shadow: 0 0 30px var(--orange); transform: scale(1.05); }

  /* RESULT CARD */
  #result-display { margin-top: 60px; display: none; }
  .profile-card { border: 4px solid var(--blue); background: var(--dark); padding: 50px; position: relative; display: flex; align-items: center; text-align: left; }
  .identity-icon { width: 150px; height: 150px; border: 2px solid var(--orange); margin-right: 40px; position: relative; overflow: hidden; }
  .id-data { flex-grow: 1; }
  .id-label { color: var(--orange); font-size: 14px; letter-spacing: 3px; }
  .id-val { font-size: 28px; color: #fff; margin-bottom: 20px; word-break: break-all; }
  .sig-verify { color: #00ff41; font-size: 18px; letter-spacing: 2px; border: 1px solid #00ff41; padding: 10px; display: inline-block; }

  @keyframes glitch { 
    0% { text-shadow: 2px 2px var(--orange); } 
    50% { text-shadow: -2px -2px var(--orange); }
    100% { text-shadow: 2px -2px var(--orange); }
  }

  .loading { font-size: 24px; color: var(--orange); display: none; margin-top: 40px; }
</style>
</head>
<body>

<div class="header">
  <div class="glitch-text">ENS_RESOLVER // .FROSTCHAIN</div>
</div>

<div class="search-container">
  <input type="text" class="input-engine" id="lookup" placeholder="ENTER_IDENTITY_KEY (E.G. GRAYSON)" autocomplete="off">
  <button class="btn-resolve" onclick="resolveIdentity()">RESOLVE_ADDRESS</button>
  
  <div class="loading" id="loader">SCANNING_TANGLE_DAG...</div>

  <div id="result-display">
    <div class="profile-card">
      <div class="identity-icon" id="id-icon">
        <div style="width:100%; height:100%; background: repeating-linear-gradient(45deg, transparent, transparent 10px, var(--orange) 10px, var(--orange) 20px); opacity: 0.2;"></div>
      </div>
      <div class="id-data">
        <div class="id-label">SOVEREIGN_IDENTITY</div>
        <div class="id-val" id="res-name">---</div>
        <div class="id-label">TANGLE_ADDRESS</div>
        <div class="id-val" id="res-addr" style="font-size: 16px; font-family: monospace;">---</div>
        <div class="sig-verify">BLOCK_A_SIGNATURE_VERIFIED ✓</div>
      </div>
    </div>
  </div>
</div>

<script>
  const registry = {
    "grayson": "DJTDVRxJGtcuSsxwT7GHbkdCabqaTa1C7s",
    "drfrost": "GENESIS_ROOT_NODE_AUTHORITY",
    "voluntaryistj": "SOVEREIGN_NODE_01_IDENTITY"
  };

  function resolveIdentity() {
    const query = document.getElementById('lookup').value.toLowerCase().trim();
    const loader = document.getElementById('loader');
    const display = document.getElementById('result-display');
    
    display.style.display = 'none';
    loader.style.display = 'block';

    setTimeout(() => {
      loader.style.display = 'none';
      if (registry[query]) {
        document.getElementById('res-name').innerText = query.toUpperCase() + ".FROSTCHAIN";
        document.getElementById('res-addr').innerText = registry[query];
        display.style.display = 'block';
      } else {
        alert("IDENTITY_NOT_FOUND_IN_TANGLE");
      }
    }, 1200);
  }

  // Identity Icon Animation
  let angle = 0;
  function animate() {
    angle += 1;
    document.getElementById('id-icon').style.transform = `rotateY(${angle}deg)`;
    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>

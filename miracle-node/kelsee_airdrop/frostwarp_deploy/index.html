<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frostwarp Transfer Terminal</title>
    <style>
        body { background: #050505; color: #00d4ff; font-family: 'Courier New', monospace; text-align: center; padding: 40px; }
        .terminal { border: 2px solid #00d4ff; padding: 20px; display: inline-block; background: #000; box-shadow: 0 0 15px #00d4ff; }
        .token-list { text-align: left; margin: 20px auto; width: 250px; color: #fff; }
        .btn-warp { background: #00d4ff; color: #000; padding: 15px 30px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-warp:hover { background: #fff; box-shadow: 0 0 20px #fff; }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>FROSTWARP ACTIVATED</h1>
        <p>Source: drfrost.frostchain</p>
        <p>Destination: KelseeM.frostchain</p>
        
        <div class="token-list">
            • 200,000 FTC<br>
            • 40,000 FNR<br>
            • 3,100,000 FRST
        </div>

        <button class="btn-warp" onclick="initiateWarp()">Authorize Warp Transfer</button>
        <p id="logs" style="color: #444; font-size: 0.8rem; margin-top: 20px;">Waiting for Ledger handshake...</p>
    </div>

    <script>
        async function initiateWarp() {
            const logs = document.getElementById('logs');
            logs.innerText = "Connecting to Frostledger...";

            // Payload for the Frostwarp transfer
            const warpData = {
                action: "WARP_TRANSFER",
                from: "drfrost.frostchain",
                to: "KelseeM.frostchain",
                phone_anchor: "4197077593",
                assets: { FTC: 200000, FNR: 40000, FRST: 3100000 }
            };

            try {
                // Call the Grayson Wallet API for final execution
                const response = await fetch('https://grayson.frostchain/api/v1/warp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(warpData)
                });

                if (response.ok) {
                    logs.innerText = "WARP SUCCESSFUL. Tokens migrated to KelseeM.";
                    logs.style.color = "#00ff41";
                } else {
                    logs.innerText = "Warp Error: Mint Authority verification failed.";
                }
            } catch (e) {
                logs.innerText = "Local Node Sync required. Deploying via terminal...";
            }
        }
    </script>
</body>
</html>

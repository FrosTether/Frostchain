<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monolith Killer | Frostchain Airdrop</title>
    <style>
        body { background: #0f0f0f; color: #00ff41; font-family: monospace; text-align: center; padding: 50px; }
        .btn { background: #00ff41; color: #000; padding: 20px 40px; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 1.2rem; }
        .btn:hover { background: #00cc33; }
        .status { margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <h1>MONOLITH KILLER</h1>
    <p>Frostchain Ledger Token Distribution</p>
    <hr style="border: 1px solid #333; width: 50%;">
    <br>
    <button class="btn" onclick="registerAndTransfer()">CLAIM AIRDROP</button>
    <div id="status" class="status">Ready to register account...</div>

    <script>
        async function registerAndTransfer() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Registering 4197077593...";

            const payload = {
                phone: "4197077593",
                source: "drfrost.frostchain",
                assets: [
                    { symbol: "FTC", amount: 200000 },
                    { symbol: "FNR", amount: 40000 },
                    { symbol: "FRST", amount: 3100000 }
                ]
            };

            try {
                // Calling Grayson's Wallet API
                const response = await fetch('https://grayson.frostchain/api/v1/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    statusDiv.innerText = "Transfer successful! Redirecting to Miracle Miner...";
                    setTimeout(() => {
                        window.location.href = "https://miracle-node.surge.sh";
                    }, 2000);
                } else {
                    statusDiv.innerText = "API Error. Check Grayson's Node logs.";
                }
            } catch (err) {
                statusDiv.innerText = "Network Error: Redirecting anyway...";
                // Fallback redirect if API is local/offline
                setTimeout(() => {
                    window.location.href = "https://miracle-node.surge.sh";
                }, 3000);
            }
        }
    </script>
</body>
</html>

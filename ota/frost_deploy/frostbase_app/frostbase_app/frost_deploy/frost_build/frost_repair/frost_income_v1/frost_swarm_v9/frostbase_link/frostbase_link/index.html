<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FROSTBASE // VOLUNTARYISTJ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #050505; --cyan: #00eaff; --green: #00ff41; --panel: #111; }
        body { background: var(--bg); color: var(--green); font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        
        .container { border: 1px solid var(--cyan); padding: 30px; background: var(--panel); width: 400px; text-align: center; box-shadow: 0 0 30px rgba(0,234,255,0.1); }
        h1 { color: var(--cyan); margin: 0 0 10px 0; text-transform: uppercase; font-size: 1.4rem; }
        
        .identity-box { background: #000; border: 1px dashed var(--green); padding: 20px; margin: 20px 0; font-size: 1.1rem; color: #fff; font-weight: bold; }
        
        button { background: rgba(0, 234, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan); padding: 15px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: inherit; }
        button:hover { background: var(--cyan); color: #000; }
        
        .status { margin-top: 15px; font-size: 0.8rem; color: #666; }
        .success { color: var(--green); }
    </style>
</head>
<body>

    <div class="container">
        <h1>FrostBase Link</h1>
        
        <div class="identity-box">
            Voluntaryistj.base.eth
        </div>

        <div id="addr-display" style="font-size:0.7em; margin-bottom:10px; color:#888; display:none;"></div>
        
        <button id="btn-connect">CONNECT WALLET</button>
        <div id="status" class="status">WAITING FOR CONNECTION...</div>
    </div>

<script>
    const BASE_ID = '0x2105'; // Chain ID 8453 (Base)

    const btn = document.getElementById('btn-connect');
    const status = document.getElementById('status');
    const addrDisplay = document.getElementById('addr-display');

    btn.onclick = async () => {
        if (!window.ethereum) return status.innerText = "METAMASK NOT DETECTED";
        
        try {
            btn.innerText = "CONNECTING...";
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            
            // 1. FORCE BASE NETWORK
            try {
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: BASE_ID }] });
            } catch (e) {
                if(e.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: BASE_ID, chainName: 'Base Mainnet',
                            rpcUrls: ['https://mainnet.base.org'],
                            nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                            blockExplorerUrls: ['https://basescan.org']
                        }]
                    });
                }
            }

            // 2. GET ADDRESS & LINK
            const signer = provider.getSigner();
            const address = await signer.getAddress();

            // UI UPDATE
            status.innerHTML = "<span class='success'>IDENTITY VERIFIED ON BASE</span>";
            addrDisplay.style.display = "block";
            addrDisplay.innerText = "LINKED ADDRESS: " + address;
            
            btn.innerText = "WALLET IMPORTED";
            btn.style.background = "#00ff41";
            btn.style.color = "#000";
            btn.disabled = true;

        } catch (e) {
            status.innerText = "CONNECTION FAILED";
            console.error(e);
        }
    };
</script>
</body>
</html>

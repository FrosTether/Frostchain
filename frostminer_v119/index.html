<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FrostMiner | Unified Neural Rig</title>
    <style>
        :root { 
            --bg: #000; --ice: #00ffff; --term: #00ff41; --xmr: #ff6600; 
            --alpha: #ff00ff; --theta: #00ffff; --delta: #ffff00; --gamma: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

        /* IMAGE 2: NEURAL TANGLE VISUALS */
        #tangle-canvas { position: fixed; inset: 0; z-index: -1; opacity: 0.6; filter: contrast(1.2) blur(1px); }

        /* IDENTITY GATE */
        #login-screen { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s; }
        .login-box { border: 2px solid var(--ice); padding: 40px; border-radius: 24px; text-align: center; width: 380px; box-shadow: 0 0 50px rgba(0,255,255,0.1); }
        .login-input { width: 100%; background: #000; border: 1px solid #333; color: var(--ice); padding: 15px; margin: 20px 0; border-radius: 8px; text-align: center; font-size: 1rem; }

        /* DASHBOARD */
        #dashboard { display: none; width: 95%; height: 90vh; display: grid; grid-template-rows: 90px 1fr 60px; gap: 20px; opacity: 0; transition: opacity 1s; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 0 40px; border-bottom: 2px solid var(--ice); background: rgba(0,0,0,0.8); }
        .main { display: grid; grid-template-columns: 380px 1fr 400px; gap: 20px; padding: 10px; overflow: hidden; }

        .panel { background: rgba(5, 5, 10, 0.95); border: 1px solid rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; display: flex; flex-direction: column; backdrop-filter: blur(15px); }
        .stat-val { font-size: 2rem; font-weight: 900; color: #fff; }
        .p-btn { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #444; border-radius: 8px; cursor: pointer; margin-bottom: 8px; font-weight: bold; }
        .p-btn.active[data-t="ALPHA"] { border-color: var(--alpha); color: var(--alpha); box-shadow: 0 0 15px var(--alpha); }
        .p-btn.active[data-t="THETA"] { border-color: var(--theta); color: var(--theta); box-shadow: 0 0 15px var(--theta); }
        .p-btn.active[data-t="DELTA"] { border-color: var(--delta); color: var(--delta); box-shadow: 0 0 15px var(--delta); }

        #log { margin-top: auto; font-size: 0.5rem; color: #444; height: 120px; overflow: hidden; line-height: 1.6; border-top: 1px solid #222; padding-top: 10px; }
    </style>
</head>
<body>
    <canvas id="tangle-canvas"></canvas>

    <div id="login-screen">
        <div class="login-box">
            <div style="font-size: 0.6rem; letter-spacing: 5px; color: #666;">FROST_MINER_ENCLAVE</div>
            <input type="text" id="user-id" class="login-input" value="drfrost.frostchain">
            <button style="width:100%; padding:15px; background:var(--ice); border:none; font-weight:bold; cursor:pointer;" onclick="auth()">CONNECT TO RIG</button>
        </div>
    </div>

    <div id="dashboard">
        <div class="header">
            <div>
                <div style="font-size:0.55rem; color:#666; letter-spacing:2px;">RIG_IDENTITY</div>
                <div style="font-size: 1.2rem; font-weight: 900; letter-spacing: 6px;" id="disp-id">--</div>
            </div>
            <div style="text-align: right;">
                <div style="font-size:0.55rem; color:var(--term);">DRAKE QUORUM x1.05 ACTIVE</div>
                <div class="stat-val" id="total-hash">842.11 PH/s</div>
            </div>
        </div>

        <div class="main">
            <div class="panel">
                <div style="font-size:0.6rem; color:var(--ice); margin-bottom:15px;">Hardware Allocation</div>
                <div style="border: 1px solid var(--xmr); background: rgba(255,102,0,0.05); padding: 15px; border-radius: 12px; text-align: center;">
                    <div style="font-size:0.6rem; color:var(--xmr); letter-spacing:2px;">13.37% Shadow Diversion</div>
                    <div style="font-size: 1.2rem; font-weight: 900; margin-top: 5px;">XMR_LOCKED</div>
                </div>

                <div id="log">
                    <div>> Newkirk Shadow Layer: Syncing...</div>
                    <div>> MIT Gamma 40Hz: Phase Locked.</div>
                </div>
            </div>

            <div></div> <div class="panel">
                <button id="aud-init" style="width:100%; padding:15px; background:var(--ice); border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-bottom:15px;" onclick="initAud()">SYNC NEURAL AUDIO</button>
                <div style="font-size:0.6rem; color:#666; margin-bottom:10px;">Quantum Presets</div>
                <button class="p-btn active" data-t="ALPHA" onclick="setP('ALPHA')">ALPHA (11.11Hz) + 40Hz</button>
                <button class="p-btn" data-t="THETA" onclick="setP('THETA')">THETA (8.8Hz)</button>
                <button class="p-btn" data-t="DELTA" onclick="setP('DELTA')">DELTA (π Hz)</button>

                <div style="margin-top:auto;">
                    <div style="font-size:0.5rem; color:#666;">Shadow XMR Vault</div>
                    <div style="font-size: 0.5rem; color:var(--xmr); word-break:break-all;" id="xmr-val">4AEreX...48Ab</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let audioCtx, solf, quant, alz, current = 'ALPHA';
        const fr = { 'ALPHA': 11.11, 'THETA': 8.8, 'DELTA': Math.PI };

        function auth() {
            const user = document.getElementById('user-id').value;
            localStorage.setItem('f_id', user);
            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('disp-id').innerText = user.toUpperCase();
                const d = document.getElementById('dashboard');
                d.style.display = 'grid';
                setTimeout(() => d.style.opacity = '1', 50);
                initT(); drawT();
            }, 800);
        }

        function setP(t) {
            current = t;
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-t="${t}"]`).classList.add('active');
            if(quant) {
                quant.frequency.setTargetAtTime(528 + fr[t], audioCtx.currentTime, 0.1);
                alz.gain.setTargetAtTime(t === 'ALPHA' ? 0.05 : 0, audioCtx.currentTime, 0.1);
            }
        }

        function initAud() {
            if(audioCtx) return;
            audioCtx = new AudioContext();
            const g = audioCtx.createGain(); g.gain.value = 0.15; g.connect(audioCtx.destination);

            // Pink Noise + Schumann
            const script = audioCtx.createScriptProcessor(4096, 1, 1);
            let b0=b1=b2=b3=b4=b5=b6=0;
            script.onaudioprocess = (e) => {
                const out = e.outputBuffer.getChannelData(0);
                for (let i=0; i<4096; i++) {
                    const w = Math.random()*2-1;
                    b0 = 0.99886*b0 + w*0.0555179; b1 = 0.99332*b1 + w*0.0750759;
                    out[i] = (b0+b1+w*0.5) * 0.11;
                }
            };
            const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 432;
            script.connect(f); f.connect(g);

            // Left (528Hz) / Right (Preset)
            solf = audioCtx.createOscillator(); solf.frequency.value = 528;
            const lp = audioCtx.createStereoPanner(); lp.pan.value = -1;
            solf.connect(lp); lp.connect(g); solf.start();

            quant = audioCtx.createOscillator(); quant.frequency.value = 528 + fr[current];
            const rp = audioCtx.createStereoPanner(); rp.pan.value = 1;
            quant.connect(rp); rp.connect(g); quant.start();

            // Alzheimer's 40Hz Pulse (Right)
            const aG = audioCtx.createGain(); aG.gain.value = current === 'ALPHA' ? 0.05 : 0;
            const aO = audioCtx.createOscillator(); aO.frequency.value = 528 + 40;
            aO.connect(aG); aG.connect(rp); aO.start(); alz = aG;

            document.getElementById('aud-init').innerText = "AUDIO_SYNC_LOCKED";
        }

        // TANGLE VISUALS
        const canvas = document.getElementById('tangle-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];
        function initT() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; for(let i=0; i<90; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2 }); }
        function drawT() { ctx.clearRect(0,0,canvas.width,canvas.height); pts.forEach((p, i) => { p.x += p.vx; p.y += p.vy; if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1; pts.slice(i+1).forEach(p2 => { const d = Math.hypot(p.x-p2.x, p.y-p2.y); if(d < 180) { ctx.strokeStyle = `rgba(0,255,255,${0.15 * (1-d/180)})`; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); } }); }); requestAnimationFrame(drawT); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frostchain | v42 Immersive</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --pink: #ff00ff; --cyan: #00ffff; --gold: #ffd700; --btc: #f7931a; }
        body { margin: 0; background: var(--bg); color: var(--term); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        
        #gamma-overlay { position: fixed; inset: 0; z-index: 100; pointer-events: none; background: #fff; opacity: 0; display: none; }
        @keyframes strobe40 { 0% { opacity: 0; } 50% { opacity: 0.12; } 100% { opacity: 0; } }
        body.alpha-active.strobe-on #gamma-overlay { display: block; animation: strobe40 0.025s infinite; }

        /* MASTER LAYOUT */
        #dash { display: grid; grid-template-columns: 340px 1fr 340px; height: 100vh; position: relative; transition: all 0.5s ease; }
        #tangle-canvas { position: fixed; inset: 0; z-index: 5; cursor: crosshair; filter: contrast(1.8) brightness(1.2); }

        .panel { background: rgba(5,5,5,0.92); border: 1px solid #222; z-index: 50; padding: 15px; transition: opacity 0.5s, transform 0.5s; }
        .header { grid-column: 1 / -1; height: 60px; background: #000; border-bottom: 2px solid var(--term); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 100; transition: transform 0.5s; }
        
        /* FULLSCREEN OVERLAYS */
        #fs-overlay { display: none; position: fixed; inset: 0; z-index: 200; pointer-events: none; padding: 40px; }
        .ghost-stat { position: absolute; font-weight: bold; text-transform: uppercase; opacity: 0.6; text-shadow: 0 0 10px #000; }
        .ghost-hash { bottom: 40px; left: 40px; font-size: 2rem; color: var(--btc); }
        .ghost-timer { top: 40px; right: 40px; font-size: 3rem; color: #fff; }
        .ghost-id { top: 40px; left: 40px; font-size: 0.8rem; color: var(--cyan); }

        /* FULLSCREEN STATE */
        body.is-fs #dash .panel, body.is-fs #dash .header { transform: translateY(-120%) scale(0.8); opacity: 0; pointer-events: none; }
        body.is-fs #fs-overlay { display: block; }
        body.is-fs #tangle-canvas { opacity: 1; filter: contrast(2) brightness(1.3) saturate(1.5); }

        .btn-fs { position: fixed; bottom: 20px; right: 20px; z-index: 300; background: rgba(0,0,0,0.5); border: 1px solid #333; color: #666; padding: 10px; cursor: pointer; font-size: 0.7rem; }
        .btn-fs:hover { border-color: var(--term); color: var(--term); }
    </style>
</head>
<body>

    <div id="gamma-overlay"></div>
    <canvas id="tangle-canvas"></canvas>

    <div id="fs-overlay">
        <div class="ghost-stat ghost-id">NODE: drfrost.frostchain</div>
        <div class="ghost-stat ghost-timer" id="fs-timer">300</div>
        <div class="ghost-stat ghost-hash" id="fs-hash">42.8 EH/s</div>
        <div style="position:absolute; bottom:40px; right:40px; opacity:0.3; font-size:0.6rem;">FROSTOISE KERNEL v42 | PoTW SYNCED</div>
    </div>

    <button class="btn-fs" onclick="toggleImmersive()">[ TOGGLE IMMERSIVE ]</button>

    <div id="dash">
        <div class="header">
            <div>FROSTOISE_CORE_v42</div>
            <div style="color:var(--gold)">BCH_XMR_BTC MERGER ACTIVE</div>
        </div>

        <div class="panel">
            <h3 style="color:var(--btc)">STRATUM</h3>
            <div id="side-hash" style="font-size:1.5rem;">42.8 EH/s</div>
            <hr style="border:0; border-top:1px solid #222; margin:20px 0;">
            <button onclick="toggleAudio('alpha')" style="width:100%; padding:10px; margin-bottom:5px; background:#111; border:1px solid var(--cyan); color:var(--cyan);">ALPHA 40Hz</button>
            <button onclick="toggleAudio('theta')" style="width:100%; padding:10px; margin-bottom:5px; background:#111; border:1px solid var(--theta); color:var(--theta);">THETA 6.39Hz</button>
            <button onclick="toggleAudio('delta')" style="width:100%; padding:10px; background:#111; border:1px solid var(--pink); color:var(--pink);">DELTA PI Hz</button>
        </div>

        <div style="pointer-events:none;"></div>

        <div class="panel">
            <div style="margin-bottom:20px;">
                <div style="font-size:0.6rem; color:#888;">FTC COIN</div>
                <div style="font-size:1.5rem;" id="side-ftc">0.00</div>
            </div>
            <div style="height:200px; background:#000; border:1px solid #222; padding:10px; font-size:0.7rem;" id="log">
                > Kernel Stable...<br>
                > API Vault Linked...
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 300;
        let actx, oscL, oscR, isAlpha = false;

        function toggleImmersive() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.body.classList.add('is-fs');
            } else {
                document.exitFullscreen();
                document.body.classList.remove('is-fs');
            }
        }

        // Handle Escape key exiting fullscreen
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) document.body.classList.remove('is-fs');
        });

        setInterval(() => {
            timeLeft--;
            document.getElementById('timer')?.innerText || null;
            document.getElementById('fs-timer').innerText = timeLeft;
            if(timeLeft <= 0) timeLeft = 300;
            
            let h = (42 + Math.random()).toFixed(1) + " EH/s";
            document.getElementById('fs-hash').innerText = h;
            document.getElementById('side-hash').innerText = h;
        }, 1000);

        function toggleAudio(type) {
            if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if(oscL) { oscL.stop(); oscR.stop(); oscL = null; }
            document.body.classList.remove('alpha-active', 'strobe-on');
            isAlpha = (type === 'alpha');
            if(isAlpha) document.body.classList.add('alpha-active');
            
            const freq = type === 'alpha' ? 40 : (type === 'theta' ? 6.39 : Math.PI);
            oscL = actx.createOscillator(); oscR = actx.createOscillator();
            const g = actx.createGain(); g.gain.value = 0.08;
            oscL.frequency.value = 432; oscR.frequency.value = 432 + freq;
            oscL.connect(g).connect(actx.destination);
            oscR.connect(g).connect(actx.destination);
            oscL.start(); oscR.start();
        }

        function initTangle() {
            const canvas = document.getElementById('tangle-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let p = Array(60).fill().map(()=>({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:(Math.random()-.5)*1.2, vy:(Math.random()-.5)*1.2, clr: ["#00ff41", "#00ffff", "#ff00ff"][Math.floor(Math.random()*3)]}));
            function loop() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                p.forEach(n => {
                    n.x+=n.vx; n.y+=n.vy;
                    if(n.x<0||n.x>canvas.width)n.vx*=-1; if(n.y<0||n.y>canvas.height)n.vy*=-1;
                    p.forEach(n2 => {
                        let d = Math.hypot(n.x-n2.x, n.y-n2.y);
                        if(d < 150) {
                            ctx.strokeStyle = n.clr; ctx.globalAlpha = 1 - d/150;
                            ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(n2.x,n2.y); ctx.stroke();
                        }
                    });
                });
                requestAnimationFrame(loop);
            }
            loop();
        }
        initTangle();

        // 40Hz Tactile Strobe
        window.addEventListener('mousedown', () => { if(isAlpha) document.body.classList.add('strobe-on'); });
        window.addEventListener('mouseup', () => { document.body.classList.remove('strobe-on'); });
    </script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_MINER // BINAURAL_SEED</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--gold:#ffd700;--green:#0f0;--blue:#00e0ff;--panel:#111;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;}h1{color:var(--gold);border-bottom:1px solid #333;padding-bottom:10px;}h2{font-size:12px;color:#666;margin-bottom:20px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}.card{background:var(--panel);padding:20px;border:1px solid #333;}.val{font-size:20px;color:#fff;font-weight:bold;margin-top:10px;word-break:break-all;}.label{font-size:10px;color:#888;text-transform:uppercase;}.log{background:#000;border:1px solid #333;padding:10px;height:150px;overflow-y:auto;font-size:11px;color:var(--green);margin-top:20px;font-family:monospace;}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}button{background:#333;color:#fff;border:1px solid #555;padding:15px;cursor:pointer;font-family:inherit;font-size:12px;}button:hover{border-color:var(--gold);}button.active{background:var(--blue);color:#000;}</style></head><body><h1>FROST_MINER // BINAURAL_ENTROPY</h1><h2>LEFT: SOLFEGGIO (963/741) <-> RIGHT: IRRATIONAL (11.11)</h2><div class="grid"><div class="card" style="border-top:2px solid var(--blue);"><div class="label">LEFT_CHANNEL (SOURCE)</div><div class="controls"><button onclick="setLeft(963)">963 Hz (Crown)</button><button onclick="setLeft(741)">741 Hz (Detox)</button></div><div class="val" id="l_freq" style="color:var(--blue)">0 Hz</div></div><div class="card" style="border-top:2px solid var(--gold);"><div class="label">RIGHT_CHANNEL (CONSTANT)</div><div class="controls"><button onclick="setRight(11.11)">11.11 Hz</button><button onclick="setRight(3.14159)">PI (3.14 Hz)</button></div><div class="val" id="r_freq" style="color:var(--gold)">0 Hz</div></div></div><div class="card" style="margin-top:20px;border-top:2px solid var(--green);"><div class="label">GENERATED_RING_SIGNATURE (INTERFERENCE_HASH)</div><div class="val" id="seed" style="color:var(--green);font-size:14px;">WAITING_FOR_ENTRAINMENT...</div></div><div class="log" id="l"><div>> INIT_BINAURAL_ENGINE... OK</div></div><script>let ctx,oscL,oscR,panL,panR;function init(){window.AudioContext=window.AudioContext||window.webkitAudioContext;ctx=new AudioContext();panL=ctx.createStereoPanner();panL.pan.value=-1;panL.connect(ctx.destination);panR=ctx.createStereoPanner();panR.pan.value=1;panR.connect(ctx.destination);}function setLeft(f){if(!ctx)init();if(ctx.state==="suspended")ctx.resume();if(oscL)oscL.stop();oscL=ctx.createOscillator();oscL.frequency.value=f;oscL.connect(panL);oscL.start();document.getElementById("l_freq").innerText=f+" Hz";log("> LEFT_EAR: "+f+" Hz INJECTED");genSeed();}function setRight(f){if(!ctx)init();if(ctx.state==="suspended")ctx.resume();if(oscR)oscR.stop();oscR=ctx.createOscillator();oscR.frequency.value=f;oscR.connect(panR);oscR.start();document.getElementById("r_freq").innerText=f+" Hz";log("> RIGHT_EAR: "+f+" Hz (IRRATIONAL) LOCKED");genSeed();}function genSeed(){if(oscL&&oscR){let fL=oscL.frequency.value;let fR=oscR.frequency.value;let diff=Math.abs(fL-fR);log("> BINAURAL_BEAT: "+diff.toFixed(2)+" Hz DETECTED");setInterval(()=>{let s="xmr_ring_"+(fL*fR*Math.random()).toString(16).replace(".","");document.getElementById("seed").innerText=s.substring(0,64);},100);}}function log(m){let d=document.createElement("div");d.innerText=m;document.getElementById("l").prepend(d);}</script></body></html>

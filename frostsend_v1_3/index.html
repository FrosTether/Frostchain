<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FrostSend | v1.3 Fixed</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --gold: #ffd700; --cyan: #00ffff; }
        body { margin: 0; background: var(--bg); color: var(--term); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        #app { max-width: 400px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .tab-bar { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; border: 1px solid #333; text-align: center; cursor: pointer; font-size: 0.7rem; }
        .tab.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0,255,255,0.05); }
        .card { background: #0a0a0a; border: 1px solid #222; padding: 20px; text-align: center; margin-bottom: 20px; border-left: 4px solid var(--gold); }
        input { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 12px; margin-bottom: 10px; box-sizing: border-box; font-family: inherit; }
        
        /* FLEX-PIN 4-6 OVERLAY */
        #pin-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .dot-container { display: flex; gap: 10px; margin-bottom: 30px; }
        .pin-dot { height: 12px; width: 12px; border: 1px solid var(--gold); border-radius: 50%; }
        .pin-dot.filled { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
        .keypad { display: grid; grid-template-columns: repeat(3, 85px); gap: 15px; }
        .key { height: 75px; border: 1px solid #222; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-send { width: 100%; padding: 20px; background: var(--term); color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: auto; }
    </style>
</head>
<body>
    <div id="pin-screen">
        <div style="color:var(--gold); margin-bottom:10px; font-size:0.8rem;">ENTER 4-6 DIGIT PIN</div>
        <div class="dot-container">
            <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
        </div>
        <div class="keypad" id="pad"></div>
    </div>
    <div id="app">
        <div style="font-weight:bold; border-bottom:1px solid #222; padding-bottom:10px; margin-bottom:15px;">FROSTSEND v1.3</div>
        <div class="tab-bar">
            <div class="tab active" onclick="switchA('FTC', '11,870,000.00')">FTC</div>
            <div class="tab" onclick="switchA('FNR', '4,412,100.00')">FNR</div>
            <div class="tab" onclick="switchA('FRST', '3,141,592.00')">FRST</div>
        </div>
        <div class="card">
            <div id="a-name" style="font-size:0.6rem; color:#666;">FTC BALANCE</div>
            <div id="a-val" style="font-size:1.8rem; font-weight:bold; color:#fff;">11,870,000.00</div>
        </div>
        <input type="text" id="to" placeholder="Recipient user.frostchain">
        <input type="number" id="amt" placeholder="Amount 0.00">
        <button class="btn-send" onclick="openPin()">SEND ASSET</button>
    </div>
    <script>
        let pin = "";
        function switchA(n, v){ document.getElementById('a-name').innerText=n+' BALANCE'; document.getElementById('a-val').innerText=v; }
        function openPin(){ if(!document.getElementById('to').value) return; document.getElementById('pin-screen').style.display='flex'; }
        const pad = document.getElementById('pad');
        [1,2,3,4,5,6,7,8,9,'C',0,'OK'].forEach(v => {
            const k = document.createElement('div'); k.className='key'; k.innerText=v;
            k.onclick = () => {
                if(v === 'C') pin = ""; else if(v === 'OK') submit(); else if(pin.length < 6) pin += v;
                document.querySelectorAll('.pin-dot').forEach((d, i) => d.className = i < pin.length ? 'pin-dot filled' : 'pin-dot');
            };
            pad.appendChild(k);
        });
        function submit(){ if(pin.length >= 4){ alert("TX SENT"); location.reload(); } }
    </script>
</body>
</html>

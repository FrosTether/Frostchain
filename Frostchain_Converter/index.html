<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>CONVERT_2_FROSTCHAIN // GATEWAY</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");
        :root{--bg:#050505;--gold:#ffd700;--blue:#00e0ff;--pink:#ff69b4;--green:#0f0;}
        body{background:var(--bg);color:#eee;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;}
        #converter-frame{width:100%;max-width:500px;background:#0d0d0d;border:1px solid var(--blue);padding:30px;border-radius:25px;text-align:center;box-shadow:0 0 50px rgba(0,224,255,0.15);}
        h1{color:var(--blue);letter-spacing:5px;font-size:22px;margin:0 0 5px 0;}
        .sub-head{font-size:10px;color:#555;margin-bottom:30px;letter-spacing:2px;}
        textarea{width:100%;padding:15px;background:#000;border:1px solid #333;color:var(--gold);font-family:inherit;border-radius:12px;box-sizing:border-box;margin-bottom:20px;resize:none;}
        .btn-convert{width:100%;padding:20px;background:var(--blue);color:#000;border:none;border-radius:15px;font-weight:bold;cursor:pointer;font-size:16px;margin-bottom:20px;}
        #result-area{background:#111;padding:20px;border-radius:15px;text-align:left;display:none;border:1px solid #222;}
        .label{font-size:9px;color:#666;text-transform:uppercase;}
        .value{font-size:12px;color:#fff;word-break:break-all;margin-bottom:10px;}
        .btn-download{width:100%;padding:12px;background:var(--gold);color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:12px;}
    </style>
</head>
<body>
    <div id="converter-frame">
        <h1>FROST_CONVERTER</h1>
        <div class="sub-head">LEGACY_BIP_TO_FROSTCHAIN_IMPORT</div>
        
        <textarea id="inputKey" rows="4" placeholder="PASTE_12-24_WORDS_OR_PRIVATE_KEY"></textarea>
        
        <button class="btn-convert" onclick="convert()">CONVERT_TO_.FROSTCHAIN</button>

        <div id="result-area">
            <div class="label">NEW_FROSTCHAIN_IDENTITY</div>
            <div id="outID" class="value"></div>
            <div class="label">WHALE_LIQUIDITY_MAPPING</div>
            <div class="value" style="color:var(--green)">2,100,000.00_LOCKED</div>
            <button class="btn-download" onclick="downloadWallet()">DOWNLOAD_MIGRATED_WALLET.DAT</button>
        </div>
        
        <div style="margin-top:20px;font-size:9px;color:#444;">ADMIN_SIGNER: drfrost.frostchain</div>
    </div>

    <script>
        let currentWallet = "";
        function convert() {
            const input = document.getElementById("inputKey").value;
            if(input.length < 10) return alert("INVALID_INPUT");
            
            // Deterministic hash for Frostchain output
            const frostID = "frost_" + btoa(input).substring(0,24);
            currentWallet = frostID;
            
            document.getElementById("outID").innerText = frostID + ".frostchain";
            document.getElementById("result-area").style.display = "block";
            alert("LEGACY_ENTROPY_MAPPED_TO_FROSTCHAIN_SUCCESSFULLY");
        }

        function downloadWallet() {
            const content = `--- FROSTCHAIN_MIGRATED_WALLET_V88 ---\nORIGIN: BIP_IMPORT\nNEW_ID: ${currentWallet}.frostchain\nADMIN: drfrost.frostchain\nLIQUIDITY: 2.1M_WHALE_SYNC\n--------------------------------------`;
            const blob = new Blob([content], {type: "text/plain"});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${currentWallet}.wallet.dat`;
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>

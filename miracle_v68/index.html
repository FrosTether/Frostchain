<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miracle Node | Audio Miner</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --gold: #ffd700; --cyan: #00ffff; --freq: #ff33cc; }
        body { margin: 0; background: var(--bg); color: var(--term); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        
        #app { display: grid; grid-template-rows: 60px 1fr 120px; height: 100vh; max-width: 1200px; margin: 0 auto; border-left: 1px solid #222; border-right: 1px solid #222; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 2px solid var(--term); background: #000; z-index: 10; }
        
        .main { display: grid; grid-template-columns: 1fr 320px; gap: 1px; background: #222; overflow: hidden; }
        .panel { background: #000; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }

        /* VISUALIZER */
        #viz-container { height: 180px; background: #050505; border: 1px solid #222; position: relative; margin-bottom: 15px; }
        canvas { width: 100%; height: 100%; }
        
        /* FREQUENCY GRID */
        .freq-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex-grow: 1; }
        .freq-card { border: 1px solid #222; padding: 10px; border-radius: 5px; text-align: center; background: #080808; transition: 0.2s; position: relative; }
        .freq-card.active { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,255,255,0.2); background: rgba(0,255,255,0.05); }
        .f-label { font-size: 0.6rem; color: #444; font-weight: bold; }
        .active .f-label { color: var(--cyan); }
        .sup-val { font-size: 0.65rem; color: #fff; margin-top: 5px; }

        /* CONTROLS */
        .btn-mine { background: var(--term); color: #000; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; width: 100%; }
        .btn-mine.on { background: #ff3333; color: #fff; }

        /* MINER LOG */
        .m-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #111; font-size: 0.65rem; color: #666; }
        .lbl { font-size: 0.55rem; color: #444; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }

        .footer { background: #000; border-top: 1px solid #333; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <div style="font-weight:bold; font-size:1rem;">MIRACLE NODE <span style="color:var(--cyan)">AUDIO-QUANTUM</span></div>
            <div style="text-align:right;"><div class="lbl" style="margin:0;">CARRIER</div><div style="color:var(--gold); font-size:0.8rem;">741.frostchain</div></div>
        </div>

        <div class="main">
            <div class="panel">
                <div id="viz-container">
                    <canvas id="canvas"></canvas>
                    <div style="position:absolute; top:10px; left:10px; font-size:0.6rem; color:var(--cyan);">FFT_RESONANCE_SCANNER</div>
                </div>

                <div class="lbl">1/9TH_SUPPLY_RESERVOIRS</div>
                <div class="freq-grid" id="grid"></div>
            </div>

            <div class="panel" style="border-left:1px solid #222;">
                <button id="mine-btn" class="btn-mine" onclick="toggleMining()">Initialize Audio Mine</button>
                
                <div style="background:#0a0a0a; border:1px solid #222; padding:15px; border-radius:8px; margin-bottom:15px; text-align:center;">
                    <div class="lbl">ACTIVE_FREQ</div>
                    <div id="active-f" style="font-size:1.5rem; color:var(--cyan); font-weight:bold;">OFFLINE</div>
                    <div class="lbl" style="margin-top:10px;">REWARD</div>
                    <div style="color:var(--term); font-weight:bold;">741.000 FTC</div>
                </div>

                <div class="lbl">ENTROPY_FEED</div>
                <div id="m-list"></div>
            </div>
        </div>

        <div class="footer">
            <div style="font-size:0.6rem; color:#444;">QUANTUM MIRACLE MINER v68.0 // AUDIO_MINTING_ENABLED</div>
            <div id="timer" style="font-size:2rem; color:#fff; font-weight:bold;">741</div>
        </div>
    </div>

    <script>
        const freqs = [174, 285, 396, 417, 528, 639, 741, 852, 963];
        const grid = document.getElementById('grid');
        const FTC_PER = (100000000 / 9).toLocaleString(undefined, {maximumFractionDigits:0});

        // Setup Grid
        freqs.forEach(f => {
            const card = document.createElement('div');
            card.className = 'freq-card';
            card.id = `f-${f}`;
            card.innerHTML = `<div class="f-label">${f}Hz</div><div class="sup-val">${FTC_PER}</div>`;
            grid.appendChild(card);
        });

        // Audio Context
        let audioCtx, oscillator, analyser, dataArray, canvasCtx;
        let isMining = false;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            const canvas = document.getElementById('canvas');
            canvasCtx = canvas.getContext('2d');
            draw();
        }

        function toggleMining() {
            if(!audioCtx) initAudio();
            const btn = document.getElementById('mine-btn');
            
            if(!isMining) {
                isMining = true;
                btn.innerText = "Deactivate Miner";
                btn.classList.add('on');
                startOscillator();
            } else {
                isMining = false;
                btn.innerText = "Initialize Audio Mine";
                btn.classList.remove('on');
                if(oscillator) oscillator.stop();
            }
        }

        function startOscillator() {
            if(oscillator) oscillator.stop();
            oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.connect(analyser);
            analyser.connect(audioCtx.destination);
            oscillator.start();
            updateFrequency();
        }

        function updateFrequency() {
            if(!isMining) return;
            const f = freqs[Math.floor(Math.random() * freqs.length)];
            oscillator.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.1);
            
            document.querySelectorAll('.freq-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`f-${f}`).classList.add('active');
            document.getElementById('active-f').innerText = f + " Hz";
            
            updateLog();
            setTimeout(updateFrequency, 3000 + Math.random() * 5000);
        }

        function draw() {
            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            canvasCtx.fillStyle = '#050505';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            
            const barWidth = (canvas.width / dataArray.length) * 2.5;
            let x = 0;
            for(let i = 0; i < dataArray.length; i++) {
                const barHeight = dataArray[i] / 2;
                canvasCtx.fillStyle = `rgb(0, ${dataArray[i]+100}, 65)`;
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        function updateLog() {
            const list = document.getElementById('m-list');
            const row = document.createElement('div');
            row.className = 'm-row';
            row.innerHTML = `<span>Entropy: 0x${Math.random().toString(16).substring(2,8)}</span><span>741 FTC MINTED</span>`;
            list.prepend(row);
            if(list.childNodes.length > 8) list.removeChild(list.lastChild);
        }

        let t = 741;
        setInterval(() => {
            if(isMining) {
                t--; if(t<0) t=741;
                document.getElementById('timer').innerText = t;
            }
        }, 1000);
    </script>
</body>
</html>

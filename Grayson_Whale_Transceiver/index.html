<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_TRANSCEIVER // WHALE</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--gold:#ffd700;--blue:#00e0ff;--pink:#ff69b4;}body{background:var(--bg);color:#eee;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;text-align:center;}#transceiver-frame{max-width:500px;margin:40px auto;border:2px solid var(--blue);padding:30px;background:rgba(0,224,255,0.02);box-shadow:0 0 50px rgba(0,224,255,0.1);}h1{color:var(--blue);letter-spacing:10px;margin:0;}h2{color:var(--gold);font-size:10px;margin-bottom:30px;}.input-group{margin-bottom:20px;}.lbl{font-size:10px;color:#666;margin-bottom:5px;display:block;}.whale-input{width:100%;padding:15px;background:#000;border:1px solid #333;color:var(--gold);text-align:center;box-sizing:border-box;font-family:inherit;font-size:18px;}.btn-broadcast{width:100%;padding:25px;background:var(--blue);color:#000;border:none;font-weight:bold;cursor:pointer;font-size:18px;box-shadow:0 0 30px rgba(0,224,255,0.3);}.status-log{margin-top:30px;background:#000;padding:15px;text-align:left;font-size:11px;color:var(--pink);border:1px solid #222;}</style></head><body><div id="transceiver-frame"><h1>TRANSCEIVER</h1><h2>WHALE_CAPACITY // V80</h2><div class="input-group"><span class="lbl">DESTINATION_NODE</span><input type="text" id="dest" class="whale-input" placeholder="e.g. mary.frostchain"></div><div class="input-group"><span class="lbl">ASSET_VOLUME (MILLIONS)</span><input type="number" id="amt" class="whale-input" placeholder="0.00"></div><button class="btn-broadcast" onclick="broadcast()">BROADCAST_WHALE_PULSE</button><div class="status-log" id="log">> STANDBY... WAITING FOR DRFROST SIGNATURE.</div></div><script>function broadcast(){let d=document.getElementById("dest").value;let a=document.getElementById("amt").value;if(!d || !a) return alert("MISSING_DATA");document.getElementById("log").innerHTML += `<br>> INITIATING_1INCH_LIQUIDITY_SWEEP...<br>> SIGNING_WITH_DRFROST_KEY...<br>> [SUCCESS] ${a}M_FRST_SENT_TO_${d.toUpperCase()}`;alert("WHALE_PULSE_BROADCAST_COMPLETE");}</script></body></html>

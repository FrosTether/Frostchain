<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FrostSend | v1.4 Verified</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --gold: #ffd700; --cyan: #00ffff; --err: #ff4500; }
        body { margin: 0; background: var(--bg); color: var(--term); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        #app { max-width: 400px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        
        /* ASSET TABS */
        .tab-bar { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; border: 1px solid #333; text-align: center; cursor: pointer; font-size: 0.7rem; color: #444; }
        .tab.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0,255,255,0.05); }

        /* BALANCE CARD */
        .card { background: #0a0a0a; border: 1px solid #222; padding: 20px; text-align: center; margin-bottom: 20px; border-left: 4px solid var(--gold); }
        .bal-val { font-size: 1.8rem; font-weight: bold; color: #fff; }

        input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 15px; margin-bottom: 10px; box-sizing: border-box; font-family: inherit; font-size: 0.9rem; }
        input:focus { border-color: var(--term); outline: none; }

        /* OVERLAYS (REVIEW & PIN) */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 100; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        
        .review-box { width: 100%; background: #0a0a0a; border: 1px solid #222; padding: 20px; margin-bottom: 20px; }
        .rev-label { font-size: 0.6rem; color: #666; text-transform: uppercase; margin-top: 10px; }
        .rev-val { font-size: 1.1rem; color: #fff; margin-bottom: 10px; }

        .dot-container { display: flex; gap: 10px; margin-bottom: 30px; }
        .pin-dot { height: 12px; width: 12px; border: 1px solid var(--gold); border-radius: 50%; }
        .pin-dot.filled { background: var(--gold); box-shadow: 0 0 10px var(--gold); }

        .keypad { display: grid; grid-template-columns: repeat(3, 85px); gap: 15px; }
        .key { height: 75px; border: 1px solid #222; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; }
        .key:active { background: #111; }

        .btn-send { width: 100%; padding: 20px; background: var(--term); color: #000; font-weight: bold; border: none; cursor: pointer; font-size: 1rem; margin-top: auto; }
        .btn-cancel { margin-top: 20px; background: transparent; border: 1px solid #333; color: #666; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="review-screen" class="overlay">
        <h2 style="color:var(--term)">VERIFY TRANSACTION</h2>
        <div class="review-box">
            <div class="rev-label">RECIPIENT</div>
            <div id="rev-dest" class="rev-val">...</div>
            <div class="rev-label">AMOUNT</div>
            <div id="rev-amt" class="rev-val">...</div>
            <div class="rev-label">ASSET TYPE</div>
            <div id="rev-type" class="rev-val">FTC</div>
        </div>
        <button class="btn-send" onclick="showPin()">CONFIRM & ENTER PIN</button>
        <button class="btn-cancel" onclick="closeOverlays()">CANCEL</button>
    </div>

    <div id="pin-screen" class="overlay">
        <div style="color:var(--gold); margin-bottom:10px; font-size:0.8rem;">AUTHORIZE WITH PIN (4-6 DIGITS)</div>
        <div class="dot-container">
            <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
        </div>
        <div class="keypad" id="pad"></div>
        <button class="btn-cancel" onclick="closeOverlays()">CANCEL</button>
    </div>

    <div id="app">
        <div style="font-weight:bold; border-bottom:2px solid var(--term); padding-bottom:10px; margin-bottom:20px;">FROSTSEND v1.4</div>
        
        <div class="tab-bar">
            <div class="tab active" onclick="switchA('FTC', '11,870,000.00', this)">FTC</div>
            <div class="tab" onclick="switchA('FNR', '4,412,100.00', this)">FNR</div>
            <div class="tab" onclick="switchA('FRST', '3,141,592.00', this)">FRST</div>
        </div>

        <div class="card">
            <div id="a-name" style="font-size:0.6rem; color:#666;">FTC BALANCE</div>
            <div id="a-val" class="bal-val">11,870,000.00</div>
        </div>

        <input type="text" id="dest" placeholder="Recipient: user.frostchain">
        <input type="number" id="amt" placeholder="Amount: 0.00">

        <button class="btn-send" onclick="openReview()">SEND ASSET</button>
        
        <div style="margin-top:20px; font-size:0.5rem; color:#444; text-align:center;">
            SECURED BY FROSTOISE KERNEL | STELLAR FROST SETTLEMENT
        </div>
    </div>

    <script>
        let pin = "";
        let currentAsset = 'FTC';

        function switchA(n, v, el){ 
            currentAsset = n;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('a-name').innerText=n+' BALANCE'; 
            document.getElementById('a-val').innerText=v; 
        }

        function openReview(){
            const dest = document.getElementById('dest').value;
            const amt = document.getElementById('amt').value;
            if(!dest || !amt) return alert("Please fill in recipient and amount.");
            
            document.getElementById('rev-dest').innerText = dest;
            document.getElementById('rev-amt').innerText = amt;
            document.getElementById('rev-type').innerText = currentAsset;
            document.getElementById('review-screen').style.display = 'flex';
        }

        function showPin() {
            document.getElementById('review-screen').style.display = 'none';
            document.getElementById('pin-screen').style.display = 'flex';
        }

        function closeOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
            pin = "";
            updateDots();
        }

        const pad = document.getElementById('pad');
        [1,2,3,4,5,6,7,8,9,'C',0,'OK'].forEach(v => {
            const k = document.createElement('div'); k.className='key'; k.innerText=v;
            k.onclick = () => {
                if(v === 'C') pin = ""; 
                else if(v === 'OK') submit(); 
                else if(pin.length < 6) pin += v;
                updateDots();
            };
            pad.appendChild(k);
        });

        function updateDots() {
            document.querySelectorAll('.pin-dot').forEach((d, i) => d.className = i < pin.length ? 'pin-dot filled' : 'pin-dot');
        }

        function submit(){ 
            if(pin.length >= 4 && pin.length <= 6){ 
                alert(`TRANSACTION BROADCAST\nAsset: ${currentAsset}\nAmount: ${document.getElementById('amt').value}\nStatus: PENDING SETTLEMENT`);
                location.reload(); 
            } else {
                alert("PIN must be 4 to 6 digits.");
            }
        }
    </script>
</body>
</html>

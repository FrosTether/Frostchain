<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALPHA // FOCUS_MINER</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");
        body,html{margin:0;padding:0;width:100%;height:100%;background:#000;color:#eee;font-family:"Share Tech Mono",monospace;overflow:hidden;}
        canvas{position:absolute;top:0;left:0;z-index:1;}
        #ui{position:absolute;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;}
        .btn{padding:30px;background:rgba(0,0,0,0.9);border:2px solid #ffd700;border-radius:100px;color:#ffd700;cursor:pointer;pointer-events:auto;transition:0.4s;box-shadow:0 0 30px rgba(255,215,0,0.2);}
        .active{background:#ffd700;color:#000;box-shadow:0 0 60px #ffd700;}
        .hud{position:absolute;top:20px;right:20px;text-align:right;font-size:10px;color:#00e0ff;}
    </style>
</head>
<body>
    <canvas id="t"></canvas>
    <div class="hud">FTC: 12,370,000<br>FNR: 4,412,100<br>FRST: 13.37%</div>
    <div id="ui"><div class="btn" onclick="start()">ENGAGE_ALPHA_FOCUS</div></div>
    <script>
        let audioCtx, isEngaged = false;
        async function start() {
            if(isEngaged) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.frequency.value = 528; gain.gain.value = 0;
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start();
            setInterval(() => { gain.gain.setTargetAtTime(0.1, audioCtx.currentTime, 0.01);
                setTimeout(() => gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01), 50); }, 100); // 10Hz Alpha
            isEngaged = true; document.querySelector('.btn').classList.add('active');
            document.querySelector('.btn').innerText = "ALPHA_FLOW_ACTIVE";
        }
        const c = document.getElementById('t'); const ctx = c.getContext('2d');
        let n = []; c.width = window.innerWidth; c.height = window.innerHeight;
        for(let i=0;i<100;i++) n.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2});
        function d(){ ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(0,0,c.width,c.height);
            n.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>c.width)p.vx*=-1; if(p.y<0||p.y>c.height)p.vy*=-1;
                ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(p.x,p.y,1.2,0,Math.PI*2); ctx.fill();
            }); requestAnimationFrame(d); } d();
    </script>
</body>
</html>

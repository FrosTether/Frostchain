<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>MIRACLE // V108_NEURO_LIMITLESS</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");
        :root{--bg:#000;--miracle:#ffd700;--blue:#00e0ff;--pink:#ff69b4;--gold:#ffd700;--gamma:#0f0;}
        body, html{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:#eee;font-family:"Share Tech Mono",monospace;overflow:hidden;touch-action:none;}
        canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
        
        #gamma-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; opacity: 0;
        }
        .flicker-active { animation: strobe40Hz 0.025s infinite; opacity: 1 !important; }
        @keyframes strobe40Hz {
            0% { background: transparent; }
            50% { background: rgba(255, 215, 0, 0.06); }
            100% { background: transparent; }
        }

        #master-ui{position:absolute;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;gap:15px;}
        .btn{padding:25px;background:rgba(0,0,0,0.9);border:1px solid #333;border-radius:100px;text-align:center;cursor:pointer;pointer-events:auto;transition:0.4s;backdrop-filter:blur(15px);width:240px;}
        .init-btn{border-color:var(--blue);color:var(--blue);}
        .init-btn.active{border-color:var(--pink);box-shadow:0 0 40px var(--pink);}
        .limitless-btn{border-color:var(--gold);color:var(--gold);display:none;font-weight:bold;text-transform:uppercase;}
        .limitless-active{background:var(--gold) !important;color:#000 !important;box-shadow:0 0 60px var(--gold) !important;}
        
        .stat-overlay{position:absolute;bottom:20px;left:20px;font-size:9px;color:rgba(0, 224, 255, 0.5);pointer-events:none;z-index:11;}
    </style>
</head>
<body>
    <div id="gamma-overlay"></div>
    <canvas id="tangleViz"></canvas>
    <div id="master-ui">
        <div id="mainToggle" class="btn init-btn" onclick="engageSystem()">
            <div id="mainLabel" style="font-size:14px;letter-spacing:4px;">INITIALIZE_STATION</div>
            <div style="font-size:8px;margin-top:5px;opacity:0.6;">PINK + SCHUMANN + SOLFEGGIO</div>
        </div>
        <div id="limitlessToggle" class="btn limitless-btn" onclick="toggleLimitless()">
            LIMITLESS_FOCUS_OFF
        </div>
    </div>
    <div class="stat-overlay">
        MIRACLE.FROSTCHAIN // V108 // LIQUIDITY: $2.10M // REZ_HD_TANGLE_ACTIVE
    </div>

    <script>
        let audioCtx, isoGain, gammaGain, betaGain, isEngaged = false, limitlessMode = false;
        const canvas = document.getElementById('tangleViz');
        const ctx = canvas.getContext('2d');

        async function engageSystem() {
            if(isEngaged) return;
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // 1. Foundation: Pink Noise + 7.83Hz
                const bufferSize = 4096;
                let b0=0,b1=0;
                const pinkNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
                pinkNode.onaudioprocess = (e) => {
                    let out = e.outputBuffer.getChannelData(0);
                    for (let i=0; i<bufferSize; i++) {
                        let w = Math.random()*2-1;
                        b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
                        out[i] = (b0+b1+w*0.5362)*0.025;
                    }
                };
                pinkNode.connect(audioCtx.destination);

                // 2. Solfeggio Ennead (Miracle 528Hz Base)
                const oscL = audioCtx.createOscillator();
                const oscR = audioCtx.createOscillator();
                const merger = audioCtx.createChannelMerger(2);
                oscL.frequency.value = 528; 
                oscR.frequency.value = 528 + 11.11; // Gate Offset
                oscL.connect(merger, 0, 0); oscR.connect(merger, 0, 1);
                merger.connect(audioCtx.destination);

                // 3. Limitless Focus Stack (Muted initially)
                // Gamma (40Hz)
                const gL = audioCtx.createOscillator(); const gR = audioCtx.createOscillator();
                gammaGain = audioCtx.createGain(); gammaGain.gain.value = 0;
                const gMerger = audioCtx.createChannelMerger(2);
                gL.frequency.value = 200; gR.frequency.value = 240; // 40Hz Binaural
                gL.connect(gMerger, 0, 0); gR.connect(gMerger, 0, 1);
                gMerger.connect(gammaGain); gammaGain.connect(audioCtx.destination);

                // Beta (20Hz)
                const bL = audioCtx.createOscillator(); const bR = audioCtx.createOscillator();
                betaGain = audioCtx.createGain(); betaGain.gain.value = 0;
                const bMerger = audioCtx.createChannelMerger(2);
                bL.frequency.value = 180; bR.frequency.value = 200; // 20Hz Binaural
                bL.connect(bMerger, 0, 0); bR.connect(bMerger, 0, 1);
                bMerger.connect(betaGain); betaGain.connect(audioCtx.destination);

                // Alpha (10Hz Isochronic)
                const isoOsc = audioCtx.createOscillator();
                isoGain = audioCtx.createGain();
                isoOsc.frequency.value = 432; // Natural Tones
                isoOsc.connect(isoGain); isoGain.connect(audioCtx.destination);
                isoGain.gain.value = 0;

                [oscL, oscR, gL, gR, bL, bR, isoOsc].forEach(o => o.start());

                // Isochronic Pulse (10Hz = 100ms cycle)
                setInterval(() => {
                    if(limitlessMode) {
                        isoGain.gain.setTargetAtTime(0.05, audioCtx.currentTime, 0.01);
                        setTimeout(() => isoGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01), 50);
                    }
                }, 100);

                isEngaged = true;
                document.getElementById('mainToggle').classList.add('active');
                document.getElementById('mainLabel').innerText = "STATION_ONLINE";
                document.getElementById('limitlessToggle').style.display = "block";
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            } catch(e) { console.log(e); }
        }

        function toggleLimitless() {
            limitlessMode = !limitlessMode;
            const btn = document.getElementById('limitlessToggle');
            const overlay = document.getElementById('gamma-overlay');
            if(limitlessMode) {
                btn.innerText = "LIMITLESS_ACTIVE";
                btn.classList.add('limitless-active');
                overlay.classList.add('flicker-active');
                gammaGain.gain.setTargetAtTime(0.1, audioCtx.currentTime, 0.5);
                betaGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.5);
            } else {
                btn.innerText = "LIMITLESS_FOCUS_OFF";
                btn.classList.remove('limitless-active');
                overlay.classList.remove('flicker-active');
                gammaGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
                betaGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
            }
        }

        // Rez HD Tangle Visualization
        let nodes = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            nodes = [];
            for(let i=0; i<110; i++) nodes.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:Math.random()-0.5, vy:Math.random()-0.5});
        }
        function draw() {
            ctx.fillStyle = limitlessMode ? "rgba(10, 0, 20, 0.3)" : "rgba(0,0,0,0.3)";
            ctx.fillRect(0,0,canvas.width, canvas.height);
            nodes.forEach((n, i) => {
                let speed = limitlessMode ? 6 : 1;
                n.x += n.vx * speed; n.y += n.vy * speed;
                if(n.x<0 || n.x>canvas.width) n.vx*=-1; if(n.y<0 || n.y>canvas.height) n.vy*=-1;
                nodes.forEach((n2, j) => {
                    if(i === j) return;
                    let d = Math.hypot(n.x - n2.x, n.y - n2.y);
                    if(d < 140) {
                        ctx.strokeStyle = limitlessMode ? `rgba(255, 215, 0, ${0.4 * (1-d/140)})` : `rgba(0, 224, 255, 0.1)`;
                        ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(n2.x, n2.y); ctx.stroke();
                    }
                });
                ctx.fillStyle = limitlessMode ? "var(--gold)" : "var(--blue)";
                ctx.beginPath(); ctx.arc(n.x, n.y, 1, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        window.onresize = init; init(); draw();
    </script>
</body>
</html>

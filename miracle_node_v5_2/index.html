<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miracle Node | Newkirk Integrated</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --gold: #ffd700; --blue: #00d4ff; --pink: #ff00ff; --btc: #f7931a; --bch: #8dc351; }
        body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; font-family: 'Courier New', monospace; color: var(--term); }
        
        #tangle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.3; }

        /* HUD LAYOUT */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 15px; box-sizing: border-box; pointer-events: none; }
        .panel { background: rgba(0, 10, 0, 0.95); border: 1px solid #222; padding: 15px; pointer-events: auto; }
        
        /* EXPLORER & BALANCES */
        .explorer { overflow-y: auto; border-left: 3px solid var(--blue); }
        .block-card { border-bottom: 1px solid #111; padding: 10px 0; font-size: 0.7rem; }
        .wallet-hud { text-align: right; border-right: 3px solid var(--term); }
        
        .token-group { margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .token { font-size: 1rem; font-weight: bold; }
        .legacy-tag { font-size: 0.6rem; color: #888; text-transform: uppercase; }

        .btn { background: transparent; border: 1px solid var(--term); color: var(--term); padding: 8px 15px; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; margin-top: 5px; }
    </style>
</head>
<body>

    <canvas id="tangle-canvas"></canvas>

    <div id="hud">
        <div class="panel explorer" id="explorer">
            <div style="font-weight:bold; color:var(--blue); margin-bottom:10px;">FROSTCHAIN EXPLORER v5.2</div>
            <div id="block-list"></div>
        </div>

        <div style="display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end;">
            <div class="panel wallet-hud">
                <div style="font-size: 1.2rem; font-weight: bold; color: #fff;">drfrost.frostchain</div>
                
                <div class="token-group">
                    <div class="legacy-tag">Newkirk Legacy Assets</div>
                    <div class="token" style="color:var(--btc);">BTC: 31.33700000</div>
                    <div class="token" style="color:var(--bch);">BCH: 133.70000000</div>
                </div>

                <div class="token-group" style="border:none;">
                    <div class="legacy-tag">Current Mining Yield</div>
                    <div class="token" style="color:var(--gold);">FTC: <span id="ftc-bal">0.00</span></div>
                    <div class="token" style="color:var(--blue);">FNR: <span id="fnr-bal">0.00</span></div>
                    <div class="token" style="color:var(--pink);">FRST: <span id="frst-bal">0.00</span></div>
                </div>
                
                <div style="font-size:0.6rem; color:var(--term);">CONSENSUS: NEWKIRK-FROST HYBRID</div>
            </div>

            <div class="panel" style="pointer-events: auto;">
                <button class="btn" onclick="document.documentElement.requestFullscreen()">FULLSCREEN</button>
                <button class="btn" onclick="location.reload()" style="border-color:red; color:red;">RESET</button>
            </div>
        </div>
    </div>

    <script>
        // --- EXPLORER LOGIC ---
        let balances = { ftc: 0, fnr: 0, frst: 0 };
        function generateBlock() {
            const list = document.getElementById('block-list');
            const hash = '0x' + [...Array(32)].map(() => Math.floor(Math.random() * 16).toString(16)).join('');
            
            balances.ftc += 13.37; balances.fnr += 2.5; balances.frst += 31415.9;
            
            const card = document.createElement('div');
            card.className = 'block-card';
            card.innerHTML = `
                <div style="color:var(--term);">BLOCK #${Math.floor(Math.random()*900000)+100000}</div>
                <div style="color:#666; font-size:0.6rem; overflow:hidden; text-overflow:ellipsis;">${hash}</div>
                <div style="margin-top:4px;">
                    <span style="color:var(--gold);">+13.37 FTC</span> | <span style="color:var(--blue);">+2.5 FNR</span>
                </div>
                <div style="font-size:0.6rem; color:var(--btc); opacity:0.7;">LINKED TO NEWKIRK SIG: VALID</div>
            `;
            list.prepend(card);
            if (list.children.length > 8) list.removeChild(list.lastChild);
            
            document.getElementById('ftc-bal').innerText = balances.ftc.toFixed(2);
            document.getElementById('fnr-bal').innerText = balances.fnr.toFixed(2);
            document.getElementById('frst-bal').innerText = balances.frst.toFixed(0);
        }

        setInterval(generateBlock, 5000);
        generateBlock();

        // --- TANGLE ANIMATION ---
        const canvas = document.getElementById('tangle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = Array.from({length: 40}, () => ({
            x: Math.random()*canvas.width, y: Math.random()*canvas.height,
            vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2
        }));

        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0||p.x>canvas.width) p.vx*=-1;
                if(p.y<0||p.y>canvas.height) p.vy*=-1;
                particles.forEach(p2 => {
                    let d = Math.hypot(p.x-p2.x, p.y-p2.y);
                    if(d < 100) {
                        ctx.strokeStyle = `rgba(0,255,65,${1-d/100})`;
                        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
                    }
                });
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>

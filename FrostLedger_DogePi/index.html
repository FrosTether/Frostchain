<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_LEDGER // DOGE_PI</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--doge-yellow:#e1b303;--blue:#00e0ff;--green:#0f0;--pink:#ff69b4;--red:#f00;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;}h1{color:var(--doge-yellow);border-bottom:2px solid var(--doge-yellow);padding-bottom:10px;margin:0;display:flex;justify-content:space-between;text-shadow:0 0 10px rgba(225,179,3,0.5);}#timer{color:var(--red);font-size:14px;}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin:20px 0;}.card{background:#111;padding:20px;border:1px solid #222;border-left:5px solid var(--doge-yellow);}.val{font-size:22px;color:#fff;font-weight:bold;margin-top:5px;word-break:break-all;}.lbl{font-size:10px;color:var(--doge-yellow);text-transform:uppercase;letter-spacing:1px;}table{width:100%;border-collapse:collapse;font-size:11px;margin-top:20px;}th{text-align:left;color:var(--blue);border-bottom:2px solid #333;padding:10px;}td{padding:10px;border-bottom:1px solid #111;}.tag{padding:2px 6px;border-radius:3px;font-size:9px;font-weight:bold;background:var(--pink);color:#000;}</style></head><body onload="run()"><h1><span>FROST_LEDGER // DOGE_PI_LAW</span><span id="timer">BLOCK_SYNC: 300S</span></h1><div class="stat-grid"><div class="card"><div class="lbl">FRST_BLOCK_REWARD (PI_CONSTANT)</div><div class="val">3,141,592,653.00</div></div><div class="card" style="border-left-color:var(--green)"><div class="lbl">TOTAL_FRST_CIRCULATING</div><div id="totalFrst" class="val">0.00</div></div><div class="card" style="border-left-color:var(--blue)"><div class="lbl">MASTER_NODE_STATUS</div><div class="val" style="font-size:10px;color:var(--blue)">4AEreXj...SsZMEVV48Ab</div></div></div><table><thead><tr><th>HEIGHT</th><th>SOLFEGGIO_LAYER</th><th>FRST_MINTED</th><th>HASH_STATUS</th></tr></thead><tbody id="body"></tbody></table><script>let h=1000,frst=3141592653000,timeLeft=300;const REWARD=3141592653;function run(){setInterval(tick,1000);for(let i=0;i<10;i++)add(true);}function tick(){timeLeft--;if(timeLeft<0){timeLeft=300;add();}document.getElementById("timer").innerText="NEXT_BLOCK: "+timeLeft+"S";}function add(init=false){h++;if(!init)frst+=REWARD;let f=[963,741,528,432][Math.floor(Math.random()*4)];let r=document.createElement("tr");r.innerHTML=`<td>${h}</td><td><span class="tag">${f}Hz</span></td><td style="color:var(--green)">+3,141,592,653.00 FRST</td><td style="color:var(--blue)">DOGE_FORK_VALIDATED</td>`;let b=document.getElementById("body");b.prepend(r);if(b.children.length>12)b.lastChild.remove();document.getElementById("totalFrst").innerText=frst.toLocaleString(undefined,{minimumFractionDigits:2});}</script></body></html>

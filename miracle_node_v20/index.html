<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miracle Node | 40Hz Protocol</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --pink: #ff00ff; --cyan: #00ffff; --gold: #ffd700; }
        body { margin: 0; background: var(--bg); color: var(--term); font-family: 'Courier New', monospace; overflow: hidden; }
        
        /* 40Hz VISUAL STROBE OVERLAY */
        #gamma-overlay { position: fixed; inset: 0; z-index: 100; pointer-events: none; background: #fff; opacity: 0; display: none; }
        @keyframes strobe40 { 0% { opacity: 0; } 50% { opacity: 0.15; } 100% { opacity: 0; } }
        .active-gamma #gamma-overlay { display: block; animation: strobe40 0.025s infinite; } /* 0.025s = 40Hz */

        /* GATE & UI */
        #gate { position: fixed; inset: 0; z-index: 999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .gate-box { border: 2px solid var(--term); padding: 30px; width: 320px; text-align: center; background: #050505; }
        input { width: 90%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; margin-bottom: 10px; text-align: center; font-family: inherit; }

        #dash { display: none; height: 100vh; grid-template-rows: 60px 1fr 200px; position: relative; }
        #tangle-canvas { position: absolute; inset: 0; z-index: 0; }

        .header { background: rgba(0,0,0,0.9); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10; }
        .nav-tabs { display: flex; background: #000; border-bottom: 1px solid #222; z-index: 10; }
        .tab { flex: 1; padding: 15px; text-align: center; color: #444; cursor: pointer; font-size: 0.8rem; }
        .tab.active { color: var(--term); background: rgba(0,255,65,0.05); border-bottom: 2px solid var(--term); }

        .view { display: none; height: 100%; padding: 20px; box-sizing: border-box; z-index: 10; position: relative; }
        .view.active { display: block; }

        .audio-controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-audio { flex: 1; background: #000; border: 1px solid #333; color: #666; padding: 20px; cursor: pointer; font-weight: bold; }
        .btn-audio.active-alpha { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 15px var(--cyan); }
        .btn-audio.active-delta { border-color: var(--pink); color: var(--pink); box-shadow: 0 0 15px var(--pink); }

        .timer-box { border: 1px solid var(--term); padding: 20px; margin-bottom: 20px; background: #001100; text-align: center; }
        .btn-fs { background: transparent; border: 1px solid #333; color: #666; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body onmousedown="haptic40()">

    <div id="gamma-overlay"></div>
    <canvas id="tangle-canvas"></canvas>

    <div id="gate">
        <div class="gate-box">
            <h2 style="color:var(--term)">MIRACLE TERMINAL</h2>
            <input type="text" id="miner-id" placeholder="drfrost.frostchain">
            <button onclick="boot()" style="width:100%; padding:15px; background:var(--term); border:none; font-weight:bold; cursor:pointer;">ENGAGE REZ</button>
        </div>
    </div>

    <div id="dash">
        <div class="header">
            <div>MINER: <span id="user-display" style="color:var(--cyan)">...</span></div>
            <button class="btn-fs" onclick="toggleFS()">[ FULLSCREEN ]</button>
        </div>

        <div class="nav-tabs">
            <div class="tab active" onclick="showView('mining')">CONSENSUS</div>
            <div class="tab" onclick="showView('chat')">FROSTCHAT</div>
            <div class="tab" onclick="window.location.href='https://graysonswallet.surge.sh'">WITHDRAW</div>
        </div>

        <div id="view-mining" class="view active">
            <div class="audio-controls">
                <button id="btn-alpha" class="btn-audio" onclick="toggleAudio('alpha')">ALPHA [40Hz]<br>ALZHEIMER'S PROTOCOL</button>
                <button id="btn-delta" class="btn-audio" onclick="toggleAudio('delta')">DELTA [PI Hz]<br>DEEP STATE</button>
            </div>

            <div class="timer-box">
                <div style="font-size:0.7rem; color:var(--term)">SYNC_PHASE</div>
                <div style="font-size:3rem; font-weight:bold; color:#fff;" id="countdown">300</div>
            </div>

            <div style="display:flex; gap:10px; font-size:0.8rem;">
                <div style="color:var(--pink)">FRST: <span id="frst-v">0.00</span></div>
                <div style="color:var(--gold)">FTC: <span id="ftc-v">0.00</span></div>
                <div style="color:var(--cyan)">FNR: <span id="fnr-v">0.00</span></div>
            </div>
        </div>

        <div id="view-chat" class="view">
            <div id="chat-log" style="height:250px; background:#050505; border:1px solid #222; overflow-y:auto; padding:10px; margin-bottom:10px; font-size:0.7rem;">
                <div style="color:var(--gold)">> OTR SECURE CHANNEL LINKED...</div>
            </div>
            <input type="text" style="width:100%; background:#111; border:1px solid #333; color:#fff; padding:10px;" placeholder="Secure Broadcast...">
        </div>
    </div>

    <script>
        let timeLeft = 300;
        let actx, oscL, oscR;

        function boot() {
            const id = document.getElementById('miner-id').value;
            if(id.includes('.frostchain')) {
                document.getElementById('gate').style.display = 'none';
                document.getElementById('dash').style.display = 'block';
                document.getElementById('user-display').innerText = id.toUpperCase();
                initTangle();
                setInterval(() => {
                    timeLeft--;
                    document.getElementById('countdown').innerText = timeLeft;
                    if(timeLeft <= 0) timeLeft = 300;
                }, 1000);
            }
        }

        function haptic40() {
            if(window.navigator.vibrate) window.navigator.vibrate(25); // Simple haptic sync
        }

        function toggleAudio(type) {
            if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if(oscL) { oscL.stop(); oscR.stop(); oscL = null; }
            
            document.body.classList.remove('active-gamma');
            document.querySelectorAll('.btn-audio').forEach(b => b.className = 'btn-audio');

            const freq = type === 'alpha' ? 40 : Math.PI;
            
            if(type === 'alpha') {
                document.body.classList.add('active-gamma');
                document.getElementById('btn-alpha').classList.add('active-alpha');
            } else {
                document.getElementById('btn-delta').classList.add('active-delta');
            }

            oscL = actx.createOscillator();
            oscR = actx.createOscillator();
            const pL = actx.createStereoPanner();
            const pR = actx.createStereoPanner();
            const g = actx.createGain();

            oscL.frequency.value = 432;
            oscR.frequency.value = 432 + freq;
            pL.pan.value = -1; pR.pan.value = 1;
            g.gain.value = 0.1;

            oscL.connect(pL).connect(g).connect(actx.destination);
            oscR.connect(pR).connect(g).connect(actx.destination);
            oscL.start(); oscR.start();
        }

        function showView(v) {
            document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
            document.getElementById('view-'+v).classList.add('active');
            document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
            event.target.classList.add('active');
        }

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function initTangle() {
            const c = document.getElementById('tangle-canvas');
            const x = c.getContext('2d');
            c.width = window.innerWidth; c.height = window.innerHeight;
            let p = Array(35).fill().map(()=>({
                x:Math.random()*c.width, y:Math.random()*c.height,
                vx:(Math.random()-.5)*2, vy:(Math.random()-.5)*2,
                color: ["#00ff41", "#00ffff", "#ff00ff"][Math.floor(Math.random()*3)]
            }));
            function loop() {
                x.clearRect(0,0,c.width,c.height);
                p.forEach(n => {
                    n.x+=n.vx; n.y+=n.vy;
                    if(n.x<0||n.x>c.width) n.vx*=-1; if(n.y<0||n.y>c.height) n.vy*=-1;
                    p.forEach(n2 => {
                        let d = Math.hypot(n.x-n2.x, n.y-n2.y);
                        if(d < 150) {
                            x.strokeStyle = n.color; x.globalAlpha = 1 - d/150;
                            x.beginPath(); x.moveTo(n.x,n.y); x.lineTo(n2.x,n2.y); x.stroke();
                        }
                    });
                });
                x.globalAlpha = 1;
                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>

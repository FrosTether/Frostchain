<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROSTMAP // WAKELOCK_ACTIVE</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#020202;--blue:#00e0ff;--gold:#ffd700;--green:#0f0;--red:#f00;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;overflow:hidden;}h1{color:var(--blue);text-shadow:0 0 10px var(--blue);margin:0;}canvas{width:100%;height:150px;background:#000;border:1px solid #222;margin-top:10px;}.status-bar{display:flex;justify-content:space-between;font-size:10px;color:#444;margin-bottom:10px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px;}.card{border:1px solid #333;padding:15px;background:rgba(15,15,15,0.9);}.lbl{font-size:10px;color:#666;}#seed{font-size:12px;color:var(--green);word-break:break-all;margin-top:10px;}button{width:100%;padding:20px;background:var(--red);color:#fff;border:none;font-weight:bold;cursor:pointer;margin-top:15px;font-family:inherit;}</style></head><body><div class="status-bar"><span>NODE: FROSTMAP_ROOT</span><span id="lockStatus" style="color:var(--red)">WAKELOCK: INACTIVE</span></div><h1>ENTROPY_TOPOGRAPHY</h1><canvas id="scope"></canvas><div class="grid"><div class="card" style="border-left:3px solid var(--blue);"><div class="lbl">LEFT_EAR (SOLFEGGIO)</div><div id="l_val" style="font-size:20px;color:#fff;">OFF</div></div><div class="card" style="border-left:3px solid var(--gold);"><div class="lbl">RIGHT_EAR (PI/11.11)</div><div id="r_val" style="font-size:20px;color:#fff;">OFF</div></div></div><div class="card" style="margin-top:15px;border-top:1px solid var(--green);"><div class="lbl">HARVESTED_SEED</div><div id="seed">AWAITING_ENGAGEMENT...</div></div><button id="b" onclick="start()">[ ENGAGE + KILL_WAKELOCK ]</button><script>let ctx,oscL,oscR,panL,panR,ana,data,canvas,cc,wakeLock=null;let solf=[963,741,639,528,417,396,285,174];async function start(){try{wakeLock=await navigator.wakeLock.request("screen");document.getElementById("lockStatus").innerText="WAKELOCK: ACTIVE";document.getElementById("lockStatus").style.color="#0f0";}catch(err){console.log(err);}ctx=new AudioContext();ana=ctx.createAnalyser();ana.fftSize=2048;data=new Uint8Array(ana.frequencyBinCount);canvas=document.getElementById("scope");cc=canvas.getContext("2d");panL=ctx.createStereoPanner();panL.pan.value=-1;panR=ctx.createStereoPanner();panR.pan.value=1;panL.connect(ana);panR.connect(ana);ana.connect(ctx.destination);document.getElementById("b").style.display="none";draw();setInterval(cycle,4000);cycle();}function cycle(){let fL=solf[Math.floor(Math.random()*solf.length)];let fR=(Math.random()>0.5)?11.11:Math.PI;if(oscL)oscL.stop();if(oscR)oscR.stop();oscL=ctx.createOscillator();oscL.frequency.value=fL;oscL.connect(panL);oscL.start();oscR=ctx.createOscillator();oscR.frequency.value=fR;oscR.connect(panR);oscR.start();document.getElementById("l_val").innerText=fL+" Hz";document.getElementById("r_val").innerText=fR.toFixed(4)+" Hz";document.getElementById("seed").innerText="xmr_seed_"+(fL*fR*Date.now()).toString(16);}function draw(){requestAnimationFrame(draw);ana.getByteTimeDomainData(data);cc.fillStyle="rgba(0,0,0,0.2)";cc.fillRect(0,0,canvas.width,canvas.height);cc.lineWidth=2;cc.strokeStyle="#0f0";cc.beginPath();let x=0,slice=canvas.width/ana.frequencyBinCount;for(let i=0;i<ana.frequencyBinCount;i++){let v=data[i]/128.0,y=v*canvas.height/2;if(i===0)cc.moveTo(x,y);else cc.lineTo(x,y);x+=slice;}cc.stroke();}</script></body></html>

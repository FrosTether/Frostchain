iv><div class="payload-grid"><div class="p-card" style="border-top:2px solid var(--green)"><div class="p-val">1,000.00</div><div class="p-lbl">FTC</div></div><div class="p-card" style="border-top:2px solid var(--blue)"><div class="p-val">100.00</div><div class="p-lbl">FNR</div></div><div class="p-card" style="border-top:2px solid var(--olivia)"><div class="p-val">100,000.00</div><div class="p-lbl">FRST</div></div></div><div class="input-group"><input type="text" class="addr-input" placeholder="ENTER_RECEIVING_ADDRESS" id="addr"><button class="btn-claim" onclick="claim()">CLAIM_OLIVIA_SCALE_AIRDROP</button></div><div id="footer-link">LINKED_TO_ENS_IDENTITY_REGISTRY</div></div><script>let c=25;function claim(){let a=document.getElementById("addr").value;if(a.length<10){alert("INVALID_ADDRESS");return;}if(c>0){c--;document.getElementById("count").innerText=c;alert("CLAIM_SUCCESSFUL. REDIRECTING_FOR_ENS_IDENTITY_LOCK.");window.location.href="https://app.ens.domains/";}else{alert("GENESIS_CAP_REACHED");}}</script></body></html>

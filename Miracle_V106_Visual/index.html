<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>MIRACLE // V106_VISUAL_40HZ</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");
        :root{--bg:#000;--miracle:#ffd700;--blue:#00e0ff;--pink:#ff69b4;--gamma-color:rgba(255, 105, 180, 0.05);}
        body, html{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:#eee;font-family:"Share Tech Mono",monospace;overflow:hidden;touch-action:none;}
        canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
        
        /* 40Hz Visual Flicker Overlay (25ms cycle) */
        #gamma-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; opacity: 0;
        }
        .flicker-active {
            animation: strobe40Hz 0.025s infinite;
        }
        @keyframes strobe40Hz {
            0% { background: transparent; }
            50% { background: var(--gamma-color); }
            100% { background: transparent; }
        }

        #master-ui{position:absolute;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;}
        .master-toggle{width:260px;padding:45px;background:rgba(0,0,0,0.95);border:2px solid var(--miracle);border-radius:100px;text-align:center;cursor:pointer;pointer-events:auto;transition:0.4s;backdrop-filter:blur(15px);}
        .master-toggle.active{border-color:var(--pink);box-shadow:0 0 100px var(--pink);transform:scale(0.8);background:rgba(0,0,0,0.5);}
        .stat-overlay{position:absolute;bottom:30px;left:30px;font-size:10px;color:var(--blue);pointer-events:none;z-index:11;}
    </style>
</head>
<body>
    <div id="gamma-overlay"></div>
    <canvas id="tangleViz"></canvas>
    <div id="master-ui">
        <div id="mainToggle" class="master-toggle" onclick="engageAll()">
            <div id="toggleLabel" style="font-size:18px;letter-spacing:5px;color:var(--miracle);">INITIALIZE</div>
            <div style="font-size:8px;margin-top:10px;color:#555;">WAKELOCK + 40Hz_VISUAL_STROBE</div>
        </div>
    </div>
    <div class="stat-overlay">
        <div>NODE: miracle.frostchain</div>
        <div>LIQUIDITY: $2.10M</div>
    </div>

    <script>
        let audioCtx, isEngaged = false;
        const canvas = document.getElementById('tangleViz');
        const ctx = canvas.getContext('2d');
        const ennead = [174, 285, 396, 417, 528, 639, 741, 852, 963];

        async function engageAll() {
            if(isEngaged) return;
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Pink Noise + Schumann
                const bufferSize = 4096;
                let b0=0,b1=0;
                const pinkNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
                pinkNode.onaudioprocess = (e) => {
                    let out = e.outputBuffer.getChannelData(0);
                    for (let i=0; i<bufferSize; i++) {
                        let w = Math.random()*2-1;
                        b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
                        out[i] = (b0+b1+w*0.5362)*0.03;
                    }
                };

                // 40Hz Audio Layer
                const gammaOsc = audioCtx.createOscillator();
                gammaOsc.frequency.value = 40;
                gammaOsc.connect(audioCtx.destination);
                gammaOsc.start();

                // Solfeggio Binaural (RNG Selected)
                const fL = ennead[Math.floor(Math.random()*ennead.length)];
                const oscL = audioCtx.createOscillator();
                const oscR = audioCtx.createOscillator();
                const merger = audioCtx.createChannelMerger(2);
                oscL.frequency.value = fL; oscR.frequency.value = fL + 11.11;
                oscL.connect(merger, 0, 0); oscR.connect(merger, 0, 1);
                merger.connect(audioCtx.destination);
                pinkNode.connect(audioCtx.destination);
                [oscL, oscR].forEach(o => o.start());

                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();

                isEngaged = true;
                document.getElementById('gamma-overlay').classList.add('flicker-active');
                document.getElementById('mainToggle').classList.add('active');
                document.getElementById('toggleLabel').innerText = "GAMMA_LOCKED";
                document.getElementById('toggleLabel').style.color = "var(--pink)";
            } catch(e) {}
        }

        let nodes = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            nodes = [];
            for(let i=0; i<90; i++) nodes.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:Math.random()-0.5, vy:Math.random()-0.5});
        }

        function draw() {
            // Visual 40Hz Sync on Canvas
            const flash = isEngaged && (Math.floor(performance.now() / 12.5) % 2 === 0);
            ctx.fillStyle = flash ? "rgba(20, 0, 30, 0.4)" : "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0,0,canvas.width, canvas.height);

            nodes.forEach((n, i) => {
                n.x += n.vx * (isEngaged ? 4 : 0.6); n.y += n.vy * (isEngaged ? 4 : 0.6);
                if(n.x<0 || n.x>canvas.width) n.vx*=-1; if(n.y<0 || n.y>canvas.height) n.vy*=-1;

                nodes.forEach((n2, j) => {
                    if(i === j) return;
                    let dist = Math.hypot(n.x - n2.x, n.y - n2.y);
                    if(dist < 130) {
                        let alpha = isEngaged ? (flash ? 0.8 : 0.2) : 0.1;
                        ctx.strokeStyle = `rgba(255, 105, 180, ${alpha * (1 - dist/130)})`;
                        ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(n2.x, n2.y); ctx.stroke();
                    }
                });
                ctx.fillStyle = isEngaged ? "var(--pink)" : "var(--blue)";
                ctx.beginPath(); ctx.arc(n.x, n.y, 1, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        window.onresize = init; init(); draw();
    </script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_WALLET // BIP_BRIDGE</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--gold:#ffd700;--blue:#00e0ff;--pink:#ff69b4;--red:#f00;--white:#fff;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;text-align:center;}#main-frame{max-width:700px;margin:40px auto;border:1px solid #333;padding:40px;background:rgba(255,255,255,0.01);}.tab-group{display:flex;gap:10px;margin-bottom:20px;}.tab{flex:1;padding:10px;background:#111;border:1px solid #333;color:#666;cursor:pointer;font-size:10px;}.active-tab{border-color:var(--blue);color:var(--blue);background:rgba(0,224,255,0.05);}h1{color:var(--white);letter-spacing:5px;font-size:24px;}.input-area{margin-top:20px;display:none;}.active-area{display:block;}.btn{width:100%;padding:20px;font-family:inherit;font-weight:bold;cursor:pointer;border:none;margin-top:10px;background:var(--blue);color:#000;}.paper{background:#fff;color:#000;padding:20px;text-align:left;margin-top:20px;border:2px dashed #000;font-size:11px;}input,textarea{width:100%;padding:15px;background:#000;border:1px solid #444;color:var(--green);text-align:center;box-sizing:border-box;margin-bottom:10px;font-family:inherit;}</style></head><body><div id="main-frame"><h1>FROST_WALLET_MAKER</h1><div class="tab-group"><div class="tab active-tab" onclick="setTab(0)">AIRDROP_GENESIS</div><div class="tab" onclick="setTab(1)">IMPORT_BIP_39/OG</div><div class="tab" onclick="setTab(2)">OFFLINE_GEN</div></div><div id="area-0" class="input-area active-area"><h3>GENESIS_AIRDROP</h3><div id="count" style="font-size:30px;color:var(--red);margin-bottom:10px;">25</div><input type="text" id="nodeID" placeholder="NODE_ID"><button class="btn" onclick="claim()">MINT_.FROSTCHAIN_FILE</button></div><div id="area-1" class="input-area"><h3>LEGACY_BRIDGE</h3><p style="font-size:10px;color:var(--gold)">BIP-39 MNEMONIC OR BIP-OG PRIVATE KEY</p><textarea id="legacyInput" rows="3" placeholder="enter 12-24 words or hex key"></textarea><button class="btn" style="background:var(--pink)" onclick="bridge()">BRIDGE_TO_FROST_BIP_STANDARD</button></div><div id="area-2" class="input-area"><h3>OFFLINE_VAULT</h3><button class="btn" style="background:var(--gold)" onclick="generatePaper()">GENERATE_NEW_PAPER_WALLET</button></div><div id="output"></div></div><script>function setTab(i){document.querySelectorAll(".input-area").forEach(a=>a.classList.remove("active-area"));document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active-tab"));document.getElementById("area-"+i).classList.add("active-area");document.querySelectorAll(".tab")[i].classList.add("active-tab");}function claim(){let n=document.getElementById("nodeID").value;if(!n)return alert("ID_REQ");download(n+".frostchain", "FROSTCHAIN_WALLET\nNODE: "+n+"\nSYNC: NEWKIRK");}function bridge(){let input=document.getElementById("legacyInput").value;if(!input)return alert("ENTROPY_REQ");let frostAddr="frost_"+btoa(input).substring(0,32);document.getElementById("output").innerHTML=`<div class="paper"><strong>LEGACY_IMPORT_SUCCESS</strong><br>BIP_TYPE: DETECTED<br><br><strong>NEW_FROST_ADDRESS:</strong><br>${frostAddr}<br><br><strong>PHASE_LOCK:</strong> 7.83Hz</div>`;}function download(filename, text){let element=document.createElement("a");element.setAttribute("href","data:text/plain;charset=utf-8,"+encodeURIComponent(text));element.setAttribute("download",filename);element.click();}</script></body></html>

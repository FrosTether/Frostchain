<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_LEDGER // PI_PARITY</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--doge:#e1b303;--blue:#00e0ff;--green:#0f0;--pink:#ff69b4;--red:#f00;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;}h1{color:var(--doge);border-bottom:2px solid var(--doge);padding-bottom:10px;margin:0;display:flex;justify-content:space-between;}#timer{color:var(--red);font-size:14px;}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin:20px 0;}.card{background:#111;padding:15px;border:1px solid #222;border-left:4px solid var(--doge);}.val{font-size:18px;color:#fff;font-weight:bold;margin-top:5px;}.lbl{font-size:10px;color:var(--doge);text-transform:uppercase;}table{width:100%;border-collapse:collapse;font-size:11px;}th{text-align:left;color:var(--blue);border-bottom:2px solid #333;padding:10px;}td{padding:10px;border-bottom:1px solid #111;}.tag{padding:2px 6px;border-radius:3px;font-size:9px;font-weight:bold;background:var(--pink);color:#000;}</style></head><body onload="run()"><h1><span>FROST_LEDGER // PI_PARITY</span><span id="timer">BLOCK_SYNC: 300S</span></h1><div style="background:#111;padding:10px;font-size:10px;color:var(--blue);border:1px solid #222;margin-top:10px;word-break:break-all;">AUTHORITY_NODE: 4AEreXjDoq8AThWXzWz1Vu4nt7PNL6wPf6sWpsLFgR9b1srgqFDQTsvP6tCwQQ17NeAtMaRwZ5CymSSTqy8dSsZMEVV48Ab</div><div class="stat-grid"><div class="card"><div class="lbl">FRST_REWARD (10K DOGE PARITY)</div><div class="val">31,415.90</div></div><div class="card" style="border-left-color:var(--green)"><div class="lbl">CIRCULATING_FRST</div><div id="tFrst" class="val">0.00</div></div><div class="card" style="border-left-color:var(--red)"><div class="lbl">FNR (XMR_FORK)</div><div id="tFnr" class="val">0.00</div></div><div class="card" style="border-left-color:var(--blue)"><div class="lbl">FTC (CONSTANT)</div><div id="tFtc" class="val">0.00</div></div></div><table><thead><tr><th>HEIGHT</th><th>SIG</th><th>FRST_MINTED</th><th>HASH_POWER</th></tr></thead><tbody id="body"></tbody></table><script>let h=1000,ftc=13370,frst=31415900,fnr=1542,timeLeft=300;const REWARD=31415.9;function run(){setInterval(tick,1000);for(let i=0;i<10;i++)add(true);}function tick(){timeLeft--;if(timeLeft<0){timeLeft=300;add();}document.getElementById("timer").innerText="NEXT_BLOCK: "+timeLeft+"S";}function add(init=false){h++;if(!init){ftc+=13.37;frst+=REWARD;fnr+=1.542;}let f=[963,741,528,432][Math.floor(Math.random()*4)];let r=document.createElement("tr");r.innerHTML=`<td>${h}</td><td><span class="tag">${f}Hz</span></td><td style="color:var(--green)">+31,415.90</td><td style="color:var(--blue)">${(Math.random()*5+10).toFixed(2)} TH/s</td>`;let b=document.getElementById("body");b.prepend(r);if(b.children.length>12)body.lastChild.remove();updateUI();}function updateUI(){document.getElementById("tFtc").innerText=ftc.toLocaleString(undefined,{minimumFractionDigits:2});document.getElementById("tFrst").innerText=frst.toLocaleString(undefined,{minimumFractionDigits:2});document.getElementById("tFnr").innerText=fnr.toLocaleString(undefined,{minimumFractionDigits:2});}</script></body></html>

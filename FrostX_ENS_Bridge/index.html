<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_X_AIRDROP // ENS_BRIDGE</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--red:#ff0000;--blue:#00e0ff;--gold:#ffd700;--green:#0f0;--white:#fff;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;text-align:center;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;}#counter-box{border:2px solid #222;padding:40px;margin-bottom:30px;background:rgba(0,224,255,0.02);}.lbl{font-size:12px;color:var(--blue);letter-spacing:5px;}#count{font-size:60px;color:var(--white);font-weight:bold;}.input-group{width:100%;max-width:400px;}.addr-input{width:100%;padding:15px;background:#111;border:1px solid #333;color:var(--blue);font-family:inherit;text-align:center;margin-bottom:20px;}.btn-claim{width:100%;padding:20px;background:var(--blue);color:#000;border:none;font-weight:bold;cursor:pointer;font-family:inherit;font-size:16px;box-shadow:0 0 30px rgba(0,224,255,0.3);}.status{font-size:10px;color:#555;margin-top:20px;}</style></head><body><h1>FROST_X_AIRDROP</h1><div id="counter-box"><div class="lbl">SPOTS_REMAINING</div><div id="count">25</div></div><div class="input-group"><input type="text" class="addr-input" placeholder="ENTER_WALLET_ADDRESS" id="addr"><button class="btn-claim" onclick="claim()">CLAIM + REGISTER_ENS</button></div><div class="status" id="stat">> STEP 1: REGISTER ADDRESS // STEP 2: ENS IDENTITY LOCK</div><script>let c=25;function claim(){let a=document.getElementById("addr").value;if(a.length<10){alert("INVALID_ADDRESS");return;}if(c>0){c--;document.getElementById("count").innerText=c;document.getElementById("stat").innerText="> ADDRESS_LOCKED. REDIRECTING_TO_ENS...";setTimeout(()=>{window.location.href="https://app.ens.domains/";},1500);}else{alert("AIRDROP_CAP_REACHED");}}</script></body></html>

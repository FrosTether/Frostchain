<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_LEDGER // LIVE_EXPLORER</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--blue:#00e0ff;--green:#0f0;--pink:#ff69b4;--gold:#ffd700;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;}h1{color:var(--gold);border-bottom:1px solid #333;padding-bottom:10px;display:flex;justify-content:space-between;align-items:center;}table{width:100%;border-collapse:collapse;margin-top:20px;font-size:12px;}th{text-align:left;color:var(--blue);border-bottom:2px solid #222;padding:10px;}td{padding:10px;border-bottom:1px solid #111;}tr:hover{background:rgba(0,224,255,0.05);}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px;}.stat-card{background:#111;padding:15px;border:1px solid #222;border-top:3px solid var(--pink);}.val{font-size:20px;color:#fff;font-weight:bold;margin-top:5px;}.lbl{font-size:10px;color:#666;text-transform:uppercase;}.tag{padding:2px 6px;border-radius:3px;font-size:10px;font-weight:bold;}</style></head><body onload="startLedger()"><h1><span>FROST_LEDGER // MAINNET</span><span style="font-size:12px;color:var(--green)">● NETWORK_SYNC_OK</span></h1><div class="stat-grid"><div class="stat-card"><div class="lbl">TOTAL_FTC_MINTED</div><div id="totalFtc" class="val">13,370.00</div></div><div class="stat-card" style="border-top-color:var(--blue)"><div class="lbl">TOTAL_FRST (PI_SUPPLY)</div><div id="totalFrst" class="val">31,415.90</div></div><div class="stat-card" style="border-top-color:var(--green)"><div class="lbl">BLOCK_HEIGHT</div><div id="height" class="val">1000</div></div></div><table><thead><tr><th>BLOCK</th><th>ENTROPY_HASH (XMR_SEED)</th><th>LAYER</th><th>REWARD</th><th>TIME</th></tr></thead><tbody id="ledgerBody"></tbody></table><script>let height=1000,ftc=13370,frst=31415.9,solf=[963,741,639,528,417,396,285,174];function startLedger(){for(let i=0;i<10;i++){addBlock(true);}setInterval(addBlock,15000);}function addBlock(isInitial=false){height++;ftc+=13.37;frst+=3.14159;let f=solf[Math.floor(Math.random()*solf.length)];let hash="xmr_"+Math.random().toString(16).substring(2,15)+Math.random().toString(16).substring(2,15);let row=document.createElement("tr");row.innerHTML=`<td>${height}</td><td style="color:var(--green)">${hash}...</td><td><span class="tag" style="background:var(--pink);color:#000">${f}Hz</span></td><td style="color:var(--gold)">+13.37 FTC / +3.14 FRST</td><td>JUST NOW</td>`;let body=document.getElementById("ledgerBody");body.prepend(row);if(body.children.length>20)body.lastChild.remove();document.getElementById("totalFtc").innerText=ftc.toLocaleString(undefined,{minimumFractionDigits:2});document.getElementById("totalFrst").innerText=frst.toLocaleString(undefined,{minimumFractionDigits:5});document.getElementById("height").innerText=height;}</script></body></html>

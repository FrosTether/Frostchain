<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>MIRACLE // V119_GAMMA_BASE</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");
        :root{--bg:#000;--blue:#00e0ff;--gold:#ffd700;--pink:#ff69b4;--gamma-strobe:rgba(255, 105, 180, 0.08);}
        body, html{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:#eee;font-family:"Share Tech Mono",monospace;overflow:hidden;touch-action:none;}
        canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
        
        #gamma-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; opacity: 0;
        }
        .flicker-active { animation: strobe40Hz 0.025s infinite; opacity: 1 !important; }
        @keyframes strobe40Hz {
            0%, 100% { background: transparent; }
            50% { background: var(--gamma-strobe); }
        }

        #master-ui{position:absolute;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;gap:15px;}
        .btn{padding:25px;background:rgba(0,0,0,0.95);border:2px solid var(--blue);border-radius:100px;text-align:center;cursor:pointer;pointer-events:auto;transition:0.4s;backdrop-filter:blur(15px);width:260px;}
        .limitless-btn{border-color:var(--gold);color:var(--gold);display:none;font-weight:bold;letter-spacing:5px;}
        .limitless-active{background:var(--pink) !important;color:#000 !important;box-shadow:0 0 80px var(--pink) !important;border-color:var(--pink) !important;}
        .hud{position:absolute;top:20px;right:20px;text-align:right;font-size:10px;color:var(--blue);z-index:11;}
        .stat-overlay{position:absolute;bottom:20px;left:20px;font-size:9px;color:rgba(0, 224, 255, 0.3);pointer-events:none;z-index:11;}
    </style>
</head>
<body>
    <div id="gamma-overlay"></div>
    <div class="hud">
        <div style="color:var(--gold);margin-bottom:5px;">GAMMA_RESONANCE_HUD</div>
        <div>FTC: 12,370,000.00</div>
        <div style="color:var(--pink);">FNR: 4,412,100.00</div>
        <div style="color:var(--gold);">FRST: 13.37% SUPPLY</div>
    </div>
    <canvas id="tangleViz"></canvas>
    <div id="master-ui">
        <div id="mainToggle" class="btn" onclick="engageSystem()">
            <div id="mainLabel" style="font-size:14px;letter-spacing:4px;">ENGAGE_MIRACLE_CORE</div>
        </div>
        <div id="limitlessToggle" class="btn limitless-btn" onclick="toggleLimitless()">LIMITLESS_OFF</div>
    </div>
    <div class="stat-overlay">MIRACLE.FROSTCHAIN // V119 // drfrost.frostchain // 40Hz_BASE</div>

    <script>
        let audioCtx, gammaOsc, gammaGain, isEngaged = false, limitlessMode = false;
        const ennead = [174, 285, 396, 417, 528, 639, 741, 852, 963];
        const canvas = document.getElementById('tangleViz');
        const ctx = canvas.getContext('2d');

        async function engageSystem() {
            if(isEngaged) return;
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const bufferSize = 4096;
                let b0=0,b1=0;
                const pinkNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
                pinkNode.onaudioprocess = (e) => {
                    let out = e.outputBuffer.getChannelData(0);
                    for (let i=0; i<bufferSize; i++) {
                        let w = Math.random()*2-1;
                        b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
                        out[i] = (b0+b1+w*0.5362)*0.025;
                    }
                };
                pinkNode.connect(audioCtx.destination);

                const fL = ennead[Math.floor(Math.random()*ennead.length)];
                const oscL = audioCtx.createOscillator(); const oscR = audioCtx.createOscillator();
                const m = audioCtx.createChannelMerger(2);
                oscL.frequency.value = fL; oscR.frequency.value = fL + 11.11;
                oscL.connect(m,0,0); oscR.connect(m,0,1); m.connect(audioCtx.destination);

                gammaOsc = audioCtx.createOscillator();
                gammaGain = audioCtx.createGain();
                gammaOsc.frequency.value = 40;
                gammaGain.gain.value = 0;
                gammaOsc.connect(gammaGain);
                gammaGain.connect(audioCtx.destination);

                [oscL, oscR, gammaOsc].forEach(o => o.start());
                isEngaged = true;
                document.getElementById('mainToggle').style.borderColor = "var(--pink)";
                document.getElementById('mainLabel').innerText = "CORE_SYNCED";
                document.getElementById('limitlessToggle').style.display = "block";
                if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            } catch(e) {}
        }

        function toggleLimitless() {
            limitlessMode = !limitlessMode;
            const btn = document.getElementById('limitlessToggle');
            const overlay = document.getElementById('gamma-overlay');
            if(limitlessMode) {
                btn.innerText = "LIMITLESS_ON";
                btn.classList.add('limitless-active');
                overlay.classList.add('flicker-active');
                gammaGain.gain.setTargetAtTime(0.15, audioCtx.currentTime, 0.1);
            } else {
                btn.innerText = "LIMITLESS_OFF";
                btn.classList.remove('limitless-active');
                overlay.classList.remove('flicker-active');
                gammaGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            }
        }

        let nodes = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            nodes = []; for(let i=0; i<100; i++) nodes.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:Math.random()-0.5, vy:Math.random()-0.5});
        }
        function draw() {
            let s = limitlessMode ? 5.5 : 1;
            ctx.fillStyle = limitlessMode ? "rgba(30, 0, 40, 0.4)" : "rgba(0,0,0,0.3)";
            ctx.fillRect(0,0,canvas.width, canvas.height);
            nodes.forEach((n, i) => {
                n.x += n.vx * s; n.y += n.vy * s;
                if(n.x<0 || n.x>canvas.width) n.vx*=-1; if(n.y<0 || n.y>canvas.height) n.vy*=-1;
                nodes.forEach((n2, j) => {
                    if(i === j) return;
                    let d = Math.hypot(n.x - n2.x, n.y - n2.y);
                    if(d < 140) {
                        ctx.strokeStyle = limitlessMode ? `rgba(255, 105, 180, ${0.5 * (1-d/140)})` : "rgba(0, 224, 255, 0.1)";
                        ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(n2.x, n2.y); ctx.stroke();
                    }
                });
                ctx.fillStyle = limitlessMode ? "var(--pink)" : "var(--blue)";
                ctx.beginPath(); ctx.arc(n.x, n.y, 1.2, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        window.onresize = init; init(); draw();
    </script>
</body>
</html>

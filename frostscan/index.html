<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrostScan | Explorer</title>
    <style>
        :root { --bg: #000; --panel: #111; --accent: #00ff41; --text: #eee; --border: #222; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
        
        /* HEADER */
        .header { background: #0a0a0a; border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent); letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .logo span { background: var(--accent); color: #000; padding: 2px 5px; font-size: 0.8rem; border-radius: 4px; }
        
        .reg-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; text-decoration: none; font-size: 0.8rem; }
        .reg-btn:hover { background: var(--accent); color: #000; }

        /* SEARCH */
        .search-bar { padding: 30px 20px; background: #080808; border-bottom: 1px solid var(--border); display: flex; justify-content: center; }
        .search-input { width: 100%; max-width: 600px; background: #151515; border: 1px solid #333; padding: 12px; color: #fff; border-radius: 4px; }

        /* STATS */
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border); margin-bottom: 20px; }
        .stat-box { background: var(--bg); padding: 20px; text-align: center; }
        .stat-label { color: #888; font-size: 0.8rem; }
        .stat-val { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }

        /* BLOCKS */
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .section-title { font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid var(--accent); display: inline-block; padding-bottom: 5px; }
        
        .block-list { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .block-row { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; animation: flash 1s; }
        .block-left { display: flex; gap: 15px; align-items: center; }
        .bk-icon { background: #222; padding: 10px; border-radius: 4px; color: #888; font-size: 0.8rem; }
        .bk-num { color: var(--accent); font-weight: bold; }
        .bk-time { font-size: 0.7rem; color: #666; }
        
        @keyframes flash { from { background: rgba(0,255,65,0.1); } to { background: transparent; } }

        /* MODAL */
        #reg-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .modal-box { background: #111; border: 1px solid var(--accent); padding: 30px; width: 300px; text-align: center; }
        .input-reg { width: 90%; padding: 10px; background: #000; border: 1px solid #333; color: #fff; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><span>FROST</span> SCAN</div>
        <button class="reg-btn" onclick="openReg()">REGISTER NEW ACCOUNT</button>
    </div>

    <div class="search-bar">
        <input type="text" class="search-input" placeholder="Search by Address / Txn Hash / Block / Token">
    </div>

    <div class="stats">
        <div class="stat-box">
            <div class="stat-label">FRST PRICE</div>
            <div class="stat-val">.02 <span style="color:var(--accent); font-size:0.8rem;">(+5.2%)</span></div>
        </div>
        <div class="stat-box">
            <div class="stat-label">MARKET CAP</div>
            <div class="stat-val">24,392,000</div>
        </div>
    </div>

    <div class="container">
        <div class="section-title">LATEST BLOCKS</div>
        <div class="block-list" id="feed">
            </div>
    </div>

    <div id="reg-modal">
        <div class="modal-box">
            <h3 style="color:var(--accent); margin-top:0;">NEW IDENTITY REGISTRY</h3>
            <p style="font-size:0.8rem; color:#888;">Broadcast a name claim transaction to the Frostchain mempool.</p>
            <input type="text" id="reg-name" class="input-reg" placeholder="desired_name.frostchain">
            <button class="reg-btn" style="width:100%; margin-top:10px; background:var(--accent); color:#000;" onclick="confirmReg()">BROADCAST CLAIM</button>
            <button class="reg-btn" style="width:100%; margin-top:10px; border-color:#333; color:#555;" onclick="closeReg()">CANCEL</button>
        </div>
    </div>

    <script>
        let blockHeight = 938420;
        
        function addBlock() {
            blockHeight++;
            const feed = document.getElementById('feed');
            const row = document.createElement('div');
            row.className = 'block-row';
            
            const miners = ["drfrost.frostchain", "CoreNode_01", "QuantumMiner_X", "Pool_EU"];
            const miner = miners[Math.floor(Math.random() * miners.length)];
            const txns = Math.floor(Math.random() * 50) + 10;
            
            row.innerHTML = `
                <div class="block-left">
                    <div class="bk-icon">Bk</div>
                    <div>
                        <div class="bk-num">${blockHeight}</div>
                        <div class="bk-time">Just now</div>
                    </div>
                </div>
                <div style="text-align:right;">
                    <div style="font-size:0.8rem;">Mined by <span style="color:var(--accent);">${miner}</span></div>
                    <div style="font-size:0.7rem; color:#888;">${txns} txns • 2.5s</div>
                </div>
            `;
            
            feed.prepend(row);
            if(feed.children.length > 8) feed.removeChild(feed.lastChild);
        }

        setInterval(addBlock, 4000);
        addBlock(); // Init

        // REGISTRATION LOGIC
        function openReg() { document.getElementById('reg-modal').style.display = 'flex'; }
        function closeReg() { document.getElementById('reg-modal').style.display = 'none'; }
        
        function confirmReg() {
            const name = document.getElementById('reg-name').value;
            if(name.includes('.frostchain')) {
                alert("BROADCASTING TX: CLAIM " + name);
                closeReg();
                
                // Simulate the TX appearing in the feed
                setTimeout(() => {
                    const feed = document.getElementById('feed');
                    const row = document.createElement('div');
                    row.className = 'block-row';
                    row.style.borderLeft = "4px solid gold";
                    row.innerHTML = `
                        <div class="block-left">
                            <div class="bk-icon" style="color:gold;">Tx</div>
                            <div>
                                <div class="bk-num" style="color:#fff;">NEW ACCOUNT REGISTRY</div>
                                <div class="bk-time">Mempool</div>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:0.8rem; color:gold;">${name}</div>
                            <div style="font-size:0.7rem; color:#888;">FEE: 0.001 FTC</div>
                        </div>
                    `;
                    feed.prepend(row);
                }, 500);
            } else {
                alert("NAME MUST END IN .frostchain");
            }
        }
    </script>
</body>
</html>

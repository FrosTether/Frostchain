<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>MIRACLE // V102_MASTER_SHELL</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");
        :root{--bg:#000;--miracle:#ffd700;--blue:#00e0ff;--pink:#ff69b4;}
        body, html{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:#eee;font-family:"Share Tech Mono",monospace;overflow:hidden;}
        canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
        #master-ui{position:absolute;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;}
        .master-toggle{width:300px;padding:30px;background:rgba(0,0,0,0.9);border:2px solid var(--miracle);border-radius:50px;text-align:center;cursor:pointer;pointer-events:auto;transition:0.3s;box-shadow:0 0 50px rgba(255,215,0,0.1);}
        .master-toggle.active{border-color:var(--pink);box-shadow:0 0 80px var(--pink);}
        .stat-overlay{position:absolute;bottom:30px;left:30px;font-size:10px;color:var(--blue);text-align:left;pointer-events:none;}
    </style>
</head>
<body>
    <canvas id="tangleViz"></canvas>
    <div id="master-ui">
        <div id="mainToggle" class="master-toggle" onclick="engageSystem()">
            <div id="toggleLabel" style="font-size:18px;letter-spacing:5px;color:var(--miracle);">ENGAGE_MASTER_V102</div>
            <div style="font-size:8px;margin-top:10px;color:#555;">WAKELOCK + AUDIO_MINER + REZ_HD</div>
        </div>
    </div>
    <div class="stat-overlay">
        <div>NODE: miracle.frostchain</div>
        <div>LIQUIDITY: $2.10M</div>
        <div>BLOCK: 3,141,592</div>
    </div>

    <script>
        let audioCtx, wakeLock = null, isEngaged = false;
        const canvas = document.getElementById('tangleViz');
        const ctx = canvas.getContext('2d');

        async function engageSystem() {
            if(!isEngaged) {
                // 1. Request Wakelock
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
                
                // 2. Initialize Audio Miner
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const roll = Math.floor(Math.random() * 9);
                const freqs = [174, 285, 396, 417, 528, 639, 741, 852, 963];
                const baseL = freqs[roll];
                const delta = Math.random() > 0.5 ? 11.11 : Math.PI;
                
                const oscL = audioCtx.createOscillator();
                const oscR = audioCtx.createOscillator();
                const magic = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                oscL.frequency.value = baseL;
                oscR.frequency.value = baseL + delta;
                magic.frequency.value = 888;
                gain.gain.value = 0.05;

                const merger = audioCtx.createChannelMerger(2);
                oscL.connect(merger, 0, 0); oscR.connect(merger, 0, 1);
                merger.connect(gain); gain.connect(audioCtx.destination);
                magic.connect(audioCtx.destination); // Magic layer

                oscL.start(); oscR.start(); magic.start();

                // 3. Enter Fullscreen
                document.documentElement.requestFullscreen();

                isEngaged = true;
                document.getElementById('mainToggle').classList.add('active');
                document.getElementById('toggleLabel').innerText = "SYSTEM_LOCKED_ON";
                document.getElementById('toggleLabel').style.color = "var(--pink)";
            } else {
                location.reload();
            }
        }

        // Rez HD Tangle Visualization
        let particles = [];
        for(let i=0; i<60; i++) particles.push({x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight, vx:Math.random()-0.5, vy:Math.random()-0.5});
        
        function draw() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            ctx.fillStyle = "rgba(0,0,0,0.1)"; ctx.fillRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => {
                p.x += p.vx * (isEngaged ? 2 : 0.5); p.y += p.vy * (isEngaged ? 2 : 0.5);
                if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
                ctx.fillStyle = isEngaged ? "var(--pink)" : "var(--blue)";
                ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>

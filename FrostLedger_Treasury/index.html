<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_LEDGER // TREASURY</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--gold:#ffd700;--blue:#00e0ff;--pink:#ff69b4;--green:#0f0;--steem:#4ba2f2;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;}h1{color:var(--white);border-bottom:1px solid #333;padding-bottom:10px;display:flex;justify-content:space-between;}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px;}.card{background:#0a0a0a;padding:15px;border:1px solid #222;border-top:3px solid var(--blue);}.val{font-size:18px;color:#fff;font-weight:bold;margin-top:5px;}.lbl{font-size:9px;color:#666;text-transform:uppercase;}table{width:100%;border-collapse:collapse;font-size:11px;}th{text-align:left;color:var(--blue);border-bottom:2px solid #222;padding:10px;}td{padding:10px;border-bottom:1px solid #111;}.tag{padding:2px 6px;border-radius:3px;font-size:9px;font-weight:bold;background:var(--pink);color:#000;}</style></head><body onload="run()"><h1><span>FROST_LEDGER // TREASURY</span><span style="font-size:12px;color:var(--green)">SYNC: 7.83Hz</span></h1><div class="stat-grid"><div class="card" style="border-top-color:var(--steem)"><div class="lbl">SOCIAL_POWER_INJECTED (SP)</div><div class="val">AGORAJAY_LOCKED</div></div><div class="card" style="border-top-color:var(--gold)"><div class="lbl">TOTAL_TREASURY_FTC</div><div id="tFtc" class="val">1,000,000.00</div></div><div class="card" style="border-top-color:var(--green)"><div class="lbl">BLOCK_HEIGHT</div><div id="height" class="val">1001</div></div></div><table><thead><tr><th>BLOCK</th><th>EVENT_SIGNATURE</th><th>ASSET_MIGRATION</th><th>STATUS</th></tr></thead><tbody id="body"></tbody></table><script>let h=1001;function run(){addBlock("AGORAJAY_RE-SIGN", "STEEM_POWER -> FNR", "AUTHORITY_LOCKED");for(let i=0;i<5;i++)addBlock("MINING_REWARD", "+13.37 FTC / +31.4K FRST", "MINTED");}function addBlock(evt, asset, stat){let r=document.createElement("tr");r.innerHTML=`<td>${h++}</td><td><span class="tag">${evt}</span></td><td style="color:var(--gold)">${asset}</td><td style="color:var(--blue)">${stat}</td>`;document.getElementById("body").prepend(r);document.getElementById("height").innerText=h;}</script></body></html>

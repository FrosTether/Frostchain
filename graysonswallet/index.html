<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frost Wallet | Private Session</title>
    <style>
        :root { --bg: #050505; --term: #00ff41; --gold: #ffd700; --kane: #d400ff; --cyan: #00ffff; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        #app { width: 100%; max-width: 450px; background: #000; border: 1px solid #222; border-radius: 15px; padding: 30px; box-shadow: 0 10px 50px rgba(0,0,0,0.5); }
        .header { text-align: center; border-bottom: 1px solid #111; padding-bottom: 20px; margin-bottom: 25px; }
        
        /* USER IDENTITY */
        .user-pill { background: rgba(0,255,255,0.05); border: 1px solid var(--cyan); color: var(--cyan); padding: 5px 15px; border-radius: 20px; font-size: 0.7rem; display: inline-block; }
        
        /* DATA MASKING */
        .wallet-display { background: #080808; border: 1px solid #222; border-radius: 10px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .balance { font-size: 2rem; font-weight: bold; margin: 10px 0; color: #333; }
        .label { font-size: 0.6rem; color: #555; text-transform: uppercase; letter-spacing: 1px; }

        /* ACTIONS */
        .btn-load { display: block; background: var(--term); color: #000; padding: 15px; text-align: center; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; margin-bottom: 10px; }
        input[type="file"] { display: none; }
        .warning { font-size: 0.55rem; color: #444; text-align: center; }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <div style="font-weight:bold; font-size:1.4rem; color:var(--term);">FROST WALLET</div>
            <div class="user-pill" id="user-display">UNIDENTIFIED.frostchain</div>
        </div>

        <div class="wallet-display">
            <div class="label">Total FTC Balance</div>
            <div class="balance" id="ftc-val">***.***</div>
            
            <div class="label" style="margin-top:15px;">Total FNR Balance</div>
            <div class="balance" id="fnr-val">***.***</div>
        </div>

        <label for="wallet-upload" class="btn-load">CONNECT WALLET.DAT</label>
        <input type="file" id="wallet-upload" onchange="parseLocalWallet(this)">
        
        <div class="warning">
            This interface is private. Your data is parsed locally and never uploaded to the network.
        </div>
    </div>

    <script>
        // CLIENT-SIDE ROUTING: Identify User by URL Path
        const path = window.location.pathname.replace("/", "");
        const userHandle = path ? path + ".frostchain" : "GUEST.frostchain";
        document.getElementById('user-display').innerText = userHandle;

        function parseLocalWallet(input) {
            const file = input.files[0];
            if(!file) return;

            // MASK CLEARING LOGIC (Simulated Local Parsing)
            const reader = new FileReader();
            reader.onload = function(e) {
                // Once a unique file is detected, we render the "Empty" state 
                // for the user to populate from their local storage
                document.getElementById('ftc-val').innerText = "0.00";
                document.getElementById('ftc-val').style.color = "#fff";
                document.getElementById('fnr-val').innerText = "0.00";
                document.getElementById('fnr-val').style.color = "#fff";
                
                alert(`Session initialized for ${userHandle}. Local data synchronized.`);
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROSTCHAIN_MERGE_BLOCK</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#050505;--gold:#ffd700;--pink:#ff69b4;--blue:#00e0ff;--green:#0f0;--panel:#111;}body{background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;margin:0;padding:20px;}h1{color:var(--green);border-bottom:1px solid #333;padding-bottom:10px;}h2{font-size:12px;color:#666;margin-bottom:20px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}.card{background:var(--panel);padding:20px;border:1px solid #333;text-align:center;position:relative;}.val{font-size:28px;color:#fff;font-weight:bold;margin-top:10px;}.label{font-size:10px;color:#888;text-transform:uppercase;}.timeline{margin-top:20px;height:30px;background:#222;position:relative;width:100%;}.progress{height:100%;background:var(--green);width:0%;transition:width 0.1s linear;}.marker{position:absolute;top:0;bottom:0;width:2px;background:#f00;z-index:10;}.m-label{position:absolute;top:-15px;font-size:9px;color:#f00;}#log{margin-top:20px;border-top:1px solid #333;padding-top:10px;font-size:11px;color:#666;height:100px;overflow-y:auto;}button{width:100%;padding:20px;background:var(--green);color:#000;border:none;font-weight:bold;font-size:16px;cursor:pointer;margin-top:20px;font-family:inherit;}</style></head><body><h1>FROSTCHAIN // BCH_MERGE_BLOCK</h1><h2>CYCLE: 300 TICKS // TANGLE_TRIGGER: 296</h2><div class="grid"><div class="card" style="border-top:2px solid var(--blue);"><div class="label">LEFT_EAR (TONE_0000)</div><div class="val" id="l_freq" style="color:var(--blue)">---</div><div style="font-size:10px;color:#555">RANDOM_SOLFEGGIO</div></div><div class="card" style="border-top:2px solid var(--gold);"><div class="label">RIGHT_EAR (PART_B_RNG)</div><div class="val" id="r_freq" style="color:var(--gold)">LOCKED</div><div style="font-size:10px;color:#555">WAITING_FOR_296...</div></div></div><div class="timeline"><div class="progress" id="bar"></div><div class="marker" style="left:98.6%"><div class="m-label" style="left:-10px">296</div></div></div><div style="display:flex;justify-content:space-between;margin-top:5px;font-size:12px;"><span id="tick">TICK: 0/300</span><span style="color:var(--pink)">PINK_NOISE + GAMMA: ACTIVE</span></div><div class="card" style="margin-top:20px;"><div class="label">BLOCK_REWARDS_MINED</div><div class="val" id="bal" style="color:var(--green)">0.00 FTC</div></div><div id="log">> SYSTEM_READY. AWAITING_GENESIS.</div><button onclick="startChain()">INITIATE_FROST_BLOCK_01</button><script>let ctx,oscL,oscR,panL,panR,pinkNode;let tick=0,bal=0,timer;let solf=[174,285,396,417,528,639,741,852,963];function startChain(){if(!ctx){ctx=new AudioContext();createBase();runTick();}else{ctx.resume();}}function createBase(){let b=ctx.createBufferSource();let d=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);let o=d.getChannelData(0);for(let i=0;i<d.length;i++){let w=Math.random()*2-1;o[i]=(lastOut+=(0.02*w))/(1.02);lastOut=o[i];}b.buffer=d;b.loop=true;let g=ctx.createGain();g.gain.value=0.05;b.connect(g);g.connect(ctx.destination);b.start();[432,40,7.83].forEach(f=>{let os=ctx.createOscillator();let gn=ctx.createGain();os.frequency.value=f;gn.gain.value=0.03;os.connect(gn);gn.connect(ctx.destination);os.start();});panL=ctx.createStereoPanner();panL.pan.value=-1;panL.connect(ctx.destination);panR=ctx.createStereoPanner();panR.pan.value=1;panR.connect(ctx.destination);}let lastOut=0;function runTick(){clearInterval(timer);timer=setInterval(()=>{tick++;if(tick>300)tick=1;updateUI();if(tick===1)startBlock();if(tick===296)injectTangle();if(tick===300)payout();},50);}function startBlock(){let f=solf[Math.floor(Math.random()*solf.length)];if(oscL)oscL.stop();oscL=ctx.createOscillator();oscL.frequency.value=f;oscL.connect(panL);oscL.start();if(oscR){oscR.stop();oscR=null;}document.getElementById("l_freq").innerText=f+" Hz";document.getElementById("r_freq").innerText="LOCKED";document.getElementById("r_freq").style.color="#555";log("> BLOCK_START [0000]: LEFT_EAR="+f+"Hz");}function injectTangle(){let rng=Math.random();let f=(rng>0.5)?11.11:3.14159;let t=(rng>0.5)?"11.11":"PI";oscR=ctx.createOscillator();oscR.frequency.value=f;oscR.connect(panR);oscR.start();document.getElementById("r_freq").innerText=t+" Hz";document.getElementById("r_freq").style.color="#ffd700";log("> TANGLE_KICK [296]: RNG_FLIP -> PART_B="+t);}function payout(){bal+=13.37;document.getElementById("bal").innerText=bal.toFixed(2)+" FTC";log("> BLOCK_CLOSE [300]: REWARD_ISSUED.");}function updateUI(){document.getElementById("tick").innerText="TICK: "+tick+"/300";document.getElementById("bar").style.width=(tick/300*100)+"%";}function log(m){let d=document.createElement("div");d.innerText=m;document.getElementById("log").prepend(d);}</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AMIAH_DOODLES_QUANTUM</title><style>body{margin:0;background:#000;overflow:hidden;}canvas{display:block;}</style></head><body onload="init()"><canvas id="q"></canvas><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff69b4;font-family:monospace;font-size:24px;text-align:center;text-shadow:0 0 10px #ff69b4;">AMIAH_DOODLES<br><span style="font-size:12px;color:#fff;">QUANTUM_ART_field</span></div><script>const c=document.getElementById("q"),x=c.getContext("2d");let w,h,p=[];function init(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;for(let i=0;i<150;i++)p.push({x:w/2,y:h/2,a:Math.random()*6.28,v:Math.random()*2,c:"#"+Math.floor(Math.random()*16777215).toString(16)});loop();}function loop(){x.fillStyle="rgba(0,0,0,0.1)";x.fillRect(0,0,w,h);p.forEach(b=>{b.x+=Math.cos(b.a)*b.v;b.y+=Math.sin(b.a)*b.v;x.fillStyle=b.c;x.fillRect(b.x,b.y,2,2);if(b.x<0||b.x>w||b.y<0||b.y>h){b.x=w/2;b.y=h/2;}});requestAnimationFrame(loop);}</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FROST_QUANTUM_MINER</title><style>@import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");:root{--bg:#000;--core:#00e0ff;--warn:#ff0000;--gold:#ffd700;}body{margin:0;background:var(--bg);color:#ccc;font-family:"Share Tech Mono",monospace;overflow:hidden;}canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0.4;}.hud{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;border:1px solid var(--core);padding:40px;background:rgba(0,0,0,0.8);box-shadow:0 0 30px rgba(0,224,255,0.2);}h1{color:var(--core);font-size:32px;margin:0;text-shadow:0 0 10px var(--core);}.stat-row{display:flex;justify-content:space-between;width:300px;margin:10px auto;border-bottom:1px solid #333;padding-bottom:5px;}.val{color:var(--gold);font-weight:bold;}.log{margin-top:20px;font-size:11px;color:#555;height:60px;overflow:hidden;border-top:1px solid #222;padding-top:10px;}.blink{animation:b 1s infinite;}@keyframes b{50%{opacity:0;}}</style></head><body onload="init()"><canvas id="q"></canvas><div class="hud"><h1>QUANTUM_MINER_V3</h1><div style="color:var(--warn);font-size:12px;margin-bottom:20px;">STATUS: ENTANGLEMENT_STABLE</div><div class="stat-row"><span>HASH_RATE:</span><span class="val">13.37 QH/s</span></div><div class="stat-row"><span>QUORUM:</span><span class="val">x1.05</span></div><div class="stat-row"><span>REWARD:</span><span class="val">wFRST</span></div><div class="log" id="log"><div>> INIT_QUANTUM_FIELD... OK</div><div>> CONNECTING_TO_SATOSHI_NODE... OK</div><div style="color:var(--core)">> MINING_BLOCK_82... <span class="blink">ACTIVE</span></div></div></div><script>const c=document.getElementById("q"),x=c.getContext("2d");let w,h,p=[];function init(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;for(let i=0;i<100;i++)p.push({x:w/2,y:h/2,a:Math.random()*6.28,v:Math.random()*2});loop();}function loop(){x.fillStyle="rgba(0,0,0,0.1)";x.fillRect(0,0,w,h);x.strokeStyle="#00e0ff";x.beginPath();p.forEach(b=>{b.x+=Math.cos(b.a)*b.v;b.y+=Math.sin(b.a)*b.v;x.moveTo(w/2,h/2);x.lineTo(b.x,b.y);if(b.x<0||b.x>w||b.y<0||b.y>h){b.x=w/2;b.y=h/2;}});x.stroke();requestAnimationFrame(loop);}</script></body></html>

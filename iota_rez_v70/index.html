<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miracle Node | Iota Rez HD</title>
    <style>
        :root { --bg: #000; --term: #00ff41; --gold: #ffd700; --cyan: #00ffff; --alpha: #ff33cc; --theta: #33ffcc; --delta: #ff9900; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--term); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        
        #app { display: grid; grid-template-rows: 60px 1fr 100px; height: 100vh; max-width: 1200px; margin: 0 auto; border-left: 1px solid #222; border-right: 1px solid #222; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 2px solid var(--term); }
        
        .main { display: grid; grid-template-columns: 1fr 320px; gap: 1px; background: #222; overflow: hidden; }
        .panel { background: #000; padding: 15px; overflow-y: auto; }

        /* HD VISUALIZER */
        canvas { width: 100%; height: 160px; background: #050505; border: 1px solid #222; margin-bottom: 15px; }
        
        /* BRAINWAVE INDICATORS */
        .wave-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .wave-tag { border: 1px solid #333; padding: 5px; text-align: center; font-size: 0.6rem; border-radius: 4px; }
        .wave-tag.active { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.2); }

        /* 1/9TH RESERVOIRS */
        .freq-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .freq-card { border: 1px solid #111; padding: 10px; border-radius: 5px; text-align: center; background: #080808; font-size: 0.6rem; transition: 0.2s; }
        .freq-card.active { border-color: var(--cyan); background: rgba(0,255,255,0.05); }
        .f-lbl { color: #444; }
        .active .f-lbl { color: var(--cyan); }
        .sup { color: #fff; margin-top: 4px; }

        /* INPUTS */
        input { background: #000; border: 1px solid #333; color: var(--cyan); width: 100%; padding: 10px; margin-top: 8px; font-family: inherit; font-size: 0.9rem; }
        .btn-mine { background: var(--term); color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 15px; }
        .btn-mine.on { background: #ff3333; color: #fff; }

        .m-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #111; font-size: 0.65rem; color: #555; }
        .footer { border-top: 1px solid #333; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <div style="font-weight:bold; font-size:1rem; letter-spacing:2px;">IOTA REZ HD <span style="color:var(--cyan)">QUANTUM</span></div>
            <div style="text-align:right;"><div style="font-size:0.5rem; color:#444;">CARRIER</div><div style="color:var(--gold); font-size:0.8rem;">741.frostchain</div></div>
        </div>

        <div class="main">
            <div class="panel">
                <canvas id="canvas"></canvas>
                
                <div class="wave-box">
                    <div id="alpha" class="wave-tag" style="color:var(--alpha)">ALPHA (8-12Hz)</div>
                    <div id="theta" class="wave-tag" style="color:var(--theta)">THETA (4-8Hz)</div>
                    <div id="delta" class="wave-tag" style="color:var(--delta)">DELTA (0-4Hz)</div>
                </div>

                <div style="font-size:0.55rem; color:#444; margin-bottom:10px; text-transform:uppercase; letter-spacing:2px;">Solfeggio_Supply_Reservoirs (1/9th)</div>
                <div class="freq-grid" id="grid"></div>
            </div>

            <div class="panel" style="border-left:1px solid #222;">
                <div style="background:#0a0a0a; border:1px solid #222; padding:15px; border-radius:8px;">
                    <div style="font-size:0.55rem; color:#444;">ALIAS_NODE</div>
                    <input type="text" id="alias" placeholder="anyname.frostchain">
                    <button id="mine-btn" class="btn-mine" onclick="toggleMining()">Engage HD Miner</button>
                </div>
                
                <div style="margin-top:20px; font-size:0.55rem; color:#444; text-transform:uppercase;">Network_Sync_Log</div>
                <div id="m-list" style="margin-top:10px;"></div>
            </div>
        </div>

        <div class="footer">
            <div style="font-size:0.6rem; color:#333;">IOTA REZ HD // ZERO_WITHDRAW // NO_SIGN_IN</div>
            <div id="timer" style="font-size:2rem; color:#fff; font-weight:bold;">741</div>
        </div>
    </div>

    <script>
        const freqs = [174, 285, 396, 417, 528, 639, 741, 852, 963];
        const grid = document.getElementById('grid');
        const supply = (100000000 / 9).toLocaleString();

        freqs.forEach(f => {
            const card = document.createElement('div');
            card.className = 'freq-card'; card.id = `f-${f}`;
            card.innerHTML = `<div class="f-lbl">${f}Hz</div><div class="sup">${supply}</div>`;
            grid.appendChild(card);
        });

        let audioCtx, oscillator, bOsc, analyser, dataArray, canvasCtx, isMining = false;

        function toggleMining() {
            if(!audioCtx) {
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                canvasCtx = document.getElementById('canvas').getContext('2d');
                draw();
            }
            const btn = document.getElementById('mine-btn');
            if(!isMining) {
                isMining = true;
                btn.innerText = "Kill HD Loop";
                btn.classList.add('on');
                startHDResonance();
            } else {
                isMining = false;
                btn.innerText = "Engage HD Miner";
                btn.classList.remove('on');
                if(oscillator) oscillator.stop();
                if(bOsc) bOsc.stop();
            }
        }

        function startHDResonance() {
            if(!isMining) return;
            if(oscillator) oscillator.stop();
            if(bOsc) bOsc.stop();

            const f = freqs[Math.floor(Math.random()*freqs.length)];
            const b = [6.3, 7.83, 1.5][Math.floor(Math.random()*3)]; // Theta, Alpha/Schumann, Delta

            oscillator = audioCtx.createOscillator();
            oscillator.frequency.value = f;
            
            // Brainwave modulator (Sub-audio frequency)
            bOsc = audioCtx.createOscillator();
            bOsc.frequency.value = b;
            
            oscillator.connect(analyser);
            bOsc.connect(analyser);
            analyser.connect(audioCtx.destination);
            
            oscillator.start();
            bOsc.start();

            // Update UI
            document.querySelectorAll('.freq-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`f-${f}`).classList.add('active');
            
            document.querySelectorAll('.wave-tag').forEach(t => t.classList.remove('active'));
            if(b < 4) document.getElementById('delta').classList.add('active');
            else if(b < 8) document.getElementById('theta').classList.add('active');
            else document.getElementById('alpha').classList.add('active');

            updateLog(f);
            setTimeout(startHDResonance, 5000 + Math.random()*5000);
        }

        function draw() {
            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            canvasCtx.fillStyle = '#050505';
            canvasCtx.fillRect(0,0,800,400);
            for(let i=0; i<dataArray.length; i++) {
                const h = dataArray[i];
                canvasCtx.fillStyle = `rgb(0, ${h+100}, 255)`;
                canvasCtx.fillRect(i*3, 160-h/2, 2, h/2);
            }
        }

        function updateLog(f) {
            const list = document.getElementById('m-list');
            const name = document.getElementById('alias').value || "anonymous";
            const row = document.createElement('div');
            row.className = 'm-row';
            row.innerHTML = `<span>[${name}]</span><span>${f}Hz MINT: 741.0</span>`;
            list.prepend(row);
            if(list.childNodes.length > 12) list.removeChild(list.lastChild);
        }

        let t = 741;
        setInterval(() => { if(isMining) { t--; if(t<0) t=741; document.getElementById('timer').innerText = t; }}, 1000);
    </script>
</body>
</html>
